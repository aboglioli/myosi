[main]
# COPR CDN is flaky in CI (504s + stalls). retries=20 escapes sticky
# edges; minrate=10 (default 1000 B/s) tolerates metadata-light slow
# mirrors while still catching dead connections; timeout=300 covers cold
# COPR repodata pulls. Applied via mkosi's --use-host-config mapping.
retries=20
minrate=10
timeout=300
install_weak_deps=False
