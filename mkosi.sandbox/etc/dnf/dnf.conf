[main]
# CI's COPR CDN access is flaky — repodata fetch from
# download.copr.fedorainfracloud.org regularly hits HTTP 504s and
# stalls under dnf5's default minrate=1000/timeout=30/retries=10
# combo. Loosen all three so transient COPR slowness doesn't fail
# the build with "No match for argument: ghostty" / "starship":
#
#   retries=20   double the default; spread reties across the CDN
#                pool to escape sticky 504-emitting edges.
#   minrate=10   default 1000 bytes/sec trips on slow COPR mirrors
#                whose initial response is metadata-light; 10 B/s
#                still detects a fully stalled connection.
#   timeout=300  default 30s is too aggressive for 100+ KB repodata
#                pulls from cold COPR cache.
#
# All three apply via --use-host-config (mkosi maps the sandbox's
# /etc/dnf/dnf.conf into the dnf5 invocation environment).
retries=20
minrate=10
timeout=300
install_weak_deps=False
