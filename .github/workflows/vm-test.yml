# Boot the released image on an empty disk and assert the result.
#
# Deliberately NOT on every push: the artifact only exists after a build,
# and a first-boot test costs minutes that a docs change should not pay.
# It runs when a release is published (the artifact it tests) and on
# demand for any tag.
name: vm-test

on:
  # NOT release:published — that fires when the release object is created,
  # which is before the build has uploaded any asset to it, so the download
  # step raced and lost every time ("no assets to download"). Waiting for the
  # build workflow to finish is the actual dependency.
  workflow_run:
    workflows: [myosi]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to boot (defaults to latest)"
        required: false
        type: string
      secure_boot:
        description: Enroll our keys and boot with Secure Boot
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  vm-test:
    name: First boot (fresh disk)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # A manual dispatch always runs. An automatic one only after a build that
    # actually succeeded AND was building a release tag.
    #
    # The build workflow runs on pushes to main as well as on tags, but only
    # its build+upload job is tag-gated, so a main push still finishes
    # "successfully" and still fires workflow_run. head_branch is then the
    # branch name, and the download step went looking for a release called
    # "main" and failed the whole workflow on every merge.
    #
    # Excluding names with a "/" was meant to be the tag test; it is not, as
    # "main" has no slash either. Release tags are calver -- 2026.08.25 or
    # 2026.08.25.01 per build.yml's own tag filter -- so require the dots
    # that every tag has and no branch here does.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       contains(github.event.workflow_run.head_branch, '.') &&
       !contains(github.event.workflow_run.head_branch, '/'))
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        # Hardware acceleration is available on standard hosted Linux
        # runners, but /dev/kvm is not world-accessible by default. Without
        # this the run falls back to TCG and takes several times longer
        # (vm-boot-test.sh detects that and extends its own timeout).
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && echo "kvm available" || echo "kvm NOT available — will use TCG"

      - name: Install VM tooling
        # The SSH control channel is a plain hostfwd out of QEMU's user-mode
        # network, so nothing beyond qemu is needed for it — no vhost_vsock
        # module and no socat. virt-firmware enrolls Secure Boot keys
        # without the interactive OVMF menu.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf swtpm python3-virt-firmware zstd
          ls -l /dev/kvm

      - name: Free disk space
        # The raw image plus its qcow2 do not fit alongside the runner's
        # preinstalled toolchains.
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet
          df -h / | tail -1

      - name: Decode Secure Boot certificate
        # An automatic run must always enroll: it is the per-release test, and
        # Secure Boot is the half of the boot chain most worth proving. The
        # old condition named the `release` event, which no longer triggers
        # this workflow -- and `inputs` does not exist outside a dispatch, so
        # on the automatic path both sides were false, SB_CERT stayed unset,
        # and the release quietly got the weaker non-Secure-Boot boot. Only a
        # manual dispatch gets to opt out, via its checkbox.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.secure_boot }}
        env:
          MYOSI_BOOT_CRT: ${{ secrets.MYOSI_BOOT_CRT }}
        run: |
          set -euo pipefail
          if [ -z "${MYOSI_BOOT_CRT:-}" ]; then
            echo "MYOSI_BOOT_CRT not set — falling back to a non-Secure-Boot run" >&2
            exit 0
          fi
          mkdir -p keys
          printf '%s' "$MYOSI_BOOT_CRT" | base64 -d > keys/boot.crt
          chmod 644 keys/boot.crt
          echo "SB_CERT=keys/boot.crt" >> "$GITHUB_ENV"

      - name: Download the image under test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          # head_branch on a tag push is the tag itself.
          [ -n "$TAG" ] || TAG="${{ github.event.workflow_run.head_branch }}"
          [ -n "$TAG" ] || TAG=$(gh release view --json tagName --jq .tagName)
          echo "testing $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Say which of the two failure modes this is, rather than leaving
          # "no assets to download" to be interpreted.
          if ! gh release download "$TAG" --pattern 'myosi_*_x86-64.raw.zst' --clobber; then
            echo "::error::no myosi_*_x86-64.raw.zst on release $TAG — the build may still be uploading, or it failed" >&2
            gh release view "$TAG" --json assets --jq '.assets[].name' >&2 || true
            exit 1
          fi
          ls -l myosi_*_x86-64.raw.zst

      - name: Boot and assert
        run: ./scripts/vm-boot-test.sh myosi_*_x86-64.raw.zst build/vm-test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-logs-${{ env.TAG }}
          path: |
            build/vm-test/console.log
            build/vm-test/guest-journal.log
          if-no-files-found: warn
          retention-days: 14
