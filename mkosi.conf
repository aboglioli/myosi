[Distribution]
Distribution=fedora
Release=44
Repositories=updates

[Output]
Format=disk
ImageId=myosi
# Pin artifact names to <ImageId>_<ImageVersion>_<Arch>: mkosi's
# Format=disk default drops the arch, so x86-64/arm64 assets would
# collide in one release bucket. Split artifacts, ESP and standalone
# .efi inherit this prefix.
Output=%i_%v_%a
OutputDirectory=build
SplitArtifacts=yes
CompressOutput=zstd
# Repart layout: mkosi.repart/ = 4-partition build-time set (ESP +
# root-A + verity-A + verity-sig-A); mkosi.extra/usr/lib/repart.d/ =
# 8-partition runtime set (adds root-B placeholders + data-luks) that
# first-boot systemd-repart uses to create the missing partitions and
# grow data-luks to fill the disk. Same .raw serves as installer USB
# and installed root.

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=auto
# Pin the in-image UKI filename to match the release .efi asset naming
# (Output=%i_%v_%a) so the ESP keeps ONE naming scheme after sysupdate.
# mkosi v26: use the config-parse-time %i/%v/%a specifiers here — there
# is NO delayed `&v`, and unknown &X specifiers are stripped to "",
# which once shipped a UKI named `myosi_.efi`.
UnifiedKernelImageFormat=%i_%v_%a
ShimBootloader=signed
Initrds=%O/initrd.cpio.zst
# UnifiedKernelImages=signed expects a pre-built UKI from the distro's
# kernel-install hooks, which don't run in mkosi's sandbox — the build
# aborts. =auto makes mkosi generate + sign the UKI itself via ukify.
# Microcode is included automatically from microcode_ctl + amd-ucode-firmware.
Hostname=myosi
Locale=en_US.UTF-8
Timezone=UTC
WithDocs=no
# The initrd sub-image (mkosi.images/initrd/) produces initrd.cpio.zst,
# referenced above — it supersedes the default initrd entirely.
#
# image.crt is NOT staged into the rootfs: dm-verity sig validation
# consults the kernel .platform keyring, populated at boot from UEFI db
# (OVMF vars in qemu, MOK on hardware); lockdown=integrity blocks
# userspace .machine loads anyway. See README.md "Design notes" §10.5.
#
# Relabel after package install; postinst relabels /etc before the
# /usr/share/factory/etc snapshot so the overlay lowerdir has correct contexts.
SELinuxRelabel=yes
# Baked into the signed UKI. Indented continuation form — mkosi v26 merges
# all lines into a single space-separated cmdline.
KernelCommandLine=rootfstype=erofs
                  # dm-verity root auto-detected via GPT type GUID (DPS). A/B slot
                  # selection is sd-boot boot-counting, NOT PARTLABEL pinning.
                  rd.systemd.verity=1
                  systemd.verity_root_options=panic-on-corruption,restart-on-corruption
                  # Pinned dissection policy: signed root + encrypted var, refuse
                  # anything undeclared. /home is a btrfs subvol of /var (no
                  # partition) — the trailing :=ignore covers it.
                  systemd.image_policy=root=signed:var=encrypted:=ignore
                  # Only dissect partitions matching our label convention —
                  # partial mitigation for dual-disk PARTLABEL collisions.
                  systemd.image_filter=root=root-*:var=data-*
                  # /var + /home live in data-luks (LUKS2, formatted by repart on
                  # first boot). Initrd sysroot-prep.service unlocks it (TPM2
                  # first, key-file fallback) and mounts /sysroot/var before the
                  # /etc overlay; home.mount handles the /home subvol.
                  rd.luks.timeout=120
                  # Keep key-file visible to generated cryptsetup units; the
                  # initrd helper also passes it explicitly, and data-N pool
                  # members are unlocked by explicit systemd-cryptsetup calls.
                  rd.luks.options=key-file=/usr/share/myosi/keys/data.key,discard
                  # Kernel hardening
                  lockdown=integrity
                  module.sig_enforce=1
                  init_on_alloc=1
                  init_on_free=1
                  slab_nomerge
                  page_alloc.shuffle=1
                  randomize_kstack_offset=on
                  vsyscall=none
                  debugfs=off
                  mitigations=auto,nosmt
                  # SELinux enforcing on by default
                  selinux=1
                  enforcing=1
                  # Cgroup v2 only
                  systemd.unified_cgroup_hierarchy=1
                  cgroup_no_v1=all
                  # IOMMU for VM passthrough (kernel ignores wrong vendor)
                  iommu=pt
                  intel_iommu=on
                  amd_iommu=on
                  # Cmdline is the single canonical home for never-load-module
                  # rules (signed in UKI, effective from earliest initrd); sysext
                  # modprobe.d files carry module OPTIONS only.
                  # nouveau/nova_core would grab the GPU before the nvidia sysext
                  # merges; iTCO_*/sp5100_tco watchdogs cause spurious resets.
                  module_blacklist=nouveau,nova_core,iTCO_wdt,iTCO_vendor_support,sp5100_tco
                  # NOTE: `rd.driver.blacklist=` is dracut-only — mkosi-initrd is
                  # a systemd initrd and silently ignores it. Modules that load
                  # dead in the initrd (firmware -ENOENT, e.g. iwlwifi) are fixed
                  # post-pivot by myosi-firmware-reprobe.service (rmmod+modprobe).
                  # Transparent hugepages on demand
                  transparent_hugepage=madvise
                  # Verbose boot: no `quiet`, loglevel KERN_WARNING. A big UKI
                  # off USB + cold TPM2 + quiet looked like a 30-45 s black-
                  # screen hang. No serial console baked in — real hardware has
                  # no port and agetty spams I/O errors; qemu adds console=ttyS0.
                  loglevel=4
                  # Force per-unit [ OK ]/[FAILED] lines — systemd suppresses
                  # them on framebuffer consoles otherwise. Both flags needed:
                  # cmdline is re-parsed after switch_root (rd.* = initrd pid1,
                  # bare = main-system pid1).
                  rd.systemd.show_status=true
                  systemd.show_status=true
                  # `warning` shows firmware-load failures / missing drivers
                  # without flooding; rd.* targets the initrd's udev where
                  # verity/LUKS/partition discovery happens.
                  rd.udev.log_level=warning
                  udev.log_level=warning
                  console=tty0
                  # Cold-boot time savers: 8250.nr_uarts=1 skips ~5 s probes of
                  # nonexistent ttyS1-3; tpm_tis.interrupts=0 avoids ~15-20 s
                  # IRQ negotiation on some boards (polled TPM ops are cheap).
                  8250.nr_uarts=1
                  tpm_tis.interrupts=0
                  # Audit off (SELinux gives us most of what audit covers)
                  audit=0

# Strip erofs /var children — shadowed at runtime by the btrfs mount
# over /var; tmpfiles re-creates needed dirs at sysinit. Glob keeps the
# /var dir itself as mount point.
# /etc is NOT wiped here: RemoveFiles= runs BEFORE mkosi.finalize, which
# must snapshot /etc → /usr/share/factory/etc first. The snapshot + wipe
# happen atomically in mkosi.finalize.
RemoveFiles=/var/*

[Validation]
Verity=signed
VerityKey=keys/image.key
VerityCertificate=keys/image.crt
SignExpectedPcr=no
SecureBoot=yes
SecureBootKey=keys/boot.key
SecureBootCertificate=keys/boot.crt
SecureBootSignTool=sbsign

[Build]
# Source:Target. Without an explicit Target mkosi flattens the source
# into SRCDIR root (keys/boot.crt → $SRCDIR/boot.crt) and the postinst
# cert-copy silently no-ops. Always pin the target.
BuildSources=keys:keys
BuildSources=mkosi.shared:mkosi.shared
# Expose mkosi.sandbox/ via $SRCDIR: mkosi applies sandbox trees to its
# OWN dnf runs only, so postinsts running dnf5 manually must copy the
# third-party repo files into the buildroot themselves.
BuildSources=mkosi.sandbox:mkosi.sandbox
# Expose the host OutputDirectory under a distinct target so a postinst
# can read prior sub-images' artifacts ($OUTPUTDIR is per-build staging
# and does NOT see them). For future baseline sysext bakes.
BuildSources=build:build_share
CacheDirectory=mkosi.cache
WithNetwork=yes
Environment=SYSTEMD_LOG_LEVEL=info

[Config]
# Baseline + the standard image set: containers/virt profiles baked
# into the main image, desktop + nvidia built as sysexts. Per-host
# additions (mybox, nvidia-580xx, zfs) and build overrides go in
# mkosi.local.conf — see mkosi.local.conf.example.
Dependencies=initrd
Profiles=containers
Profiles=virt
Dependencies=desktop
Dependencies=nvidia
