[Distribution]
Distribution=fedora
Release=44
Repositories=updates

[Output]
Format=disk
ImageId=myosi
# Pin every artifact name to <ImageId>_<ImageVersion>_<Arch>. Without
# this, mkosi's default for Format=disk drops the arch and we end up
# with `myosi_<VER>.raw.zst` on x86-64 — fine until an arm64 build
# lands in the same release bucket and collides. The split partition
# artifacts (root.raw.zst, verity.raw.zst, verity-sig.raw.zst), the
# ESP image, and the standalone .efi all inherit this prefix via
# their default naming, so a single change here covers every
# top-level file.
Output=%i_%v_%a
OutputDirectory=build
SplitArtifacts=yes
CompressOutput=zstd
# Repart directory layout (the "ParticleOS pattern" — ship a small image,
# grow on first boot):
#
#   mkosi.repart/                       4-partition build-time layout:
#                                       ESP + root-A + verity-A +
#                                       verity-sig-A. mkosi auto-
#                                       discovers this dir and lays out
#                                       the shipped .raw at build time
#                                       (~7 GiB uncompressed, ~700 MB
#                                       zstd).
#   mkosi.extra/usr/lib/repart.d/       8-partition runtime layout (the
#                                       build set above + root-B
#                                       placeholders + data-luks). Lives
#                                       in the rootfs at /usr/lib/repart.d/
#                                       (ParticleOS pattern); the auto-
#                                       built initrd inherits it via the
#                                       standard mkosi.extra/ tree. On
#                                       first boot systemd-repart sees
#                                       the shipped partitions, creates
#                                       the missing ones, grows data-
#                                       luks to fill the disk.
#
# Same `.raw.zst` serves as installer USB and as installed root — Lennart
# Poettering's "Fitting Everything Together" image-based OS pattern.

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=auto
# Pin the in-image UKI filename to <ImageId>_<ImageVersion>_<Arch>.efi
# (e.g. myosi_2026.06.05.02_x86-64.efi) so it matches the standalone
# .efi asset uploaded to the GitHub release, which mkosi names
# <ImageId>_<ImageVersion>_<Arch>.efi via [Output] Output=%i_%v_%a
# above. Without this override, the in-image UKI lands at
# /boot/EFI/Linux/<entry-token>-<kver>-<boothash>.efi (mkosi's
# default), and after a sysupdate run the ESP ends up with TWO
# naming schemes side by side — confusing and inconsistent.
#
# mkosi v26 has TWO substitution layers and they are NOT
# interchangeable. UnifiedKernelImageFormat= is run through both: first
# the config-parse-time `%X` specifiers (resolved when mkosi reads this
# file from settings/env), then the delayed `&X` specifiers (resolved
# when the UKI is installed, only e/k/h are defined).
#
#   %i = ImageId            (config-parse-time)   <-- this one
#   %v = ImageVersion       (config-parse-time)   <-- this one
#   &e = entry token        (delayed)
#   &k = kernel version     (delayed)
#   &h = roothash           (delayed)
#
# There is NO `&v` in mkosi v26 — expand_kernel_specifiers strips
# unknown delayed specifiers to "" (and logs a warning), which is how
# this file used to ship a UKI named `myosi_.efi` (version chopped
# off). Use the config-parse-time `%v` instead so mkosi substitutes
# the actual ImageVersion (from mkosi.version) into the in-image UKI
# filename.
#
# Result inside the rootfs at build time:
#   /boot/EFI/Linux/myosi_2026.06.06.02_x86-64.efi
# Same path mkosi.repart/00-esp.conf's CopyFiles=/boot/EFI/Linux
# delivers to the ESP at /efi/EFI/Linux/myosi_<VER>_<ARCH>.efi.
# %a (architecture) is appended for multi-arch release alignment —
# x86-64 hosts get the x86-64 UKI, arm64 hosts get arm64. Same
# convention applies to every other artifact (Output=%i_%v_%a on
# every sub-image, sysupdate transfers use the %a specifier).
UnifiedKernelImageFormat=%i_%v_%a
ShimBootloader=signed
Initrds=%O/initrd.cpio.zst
# UnifiedKernelImages=signed sounds stricter but it expects a UKI to
# already exist at /usr/lib/modules/<kver>/uki.efi, produced by the
# distribution's kernel-install hooks. Those hooks don't run inside
# mkosi's sandbox (no systemd, no /proc, no working machinectl), so we
# get "Couldn't find a signed UKI binary installed" and the build
# aborts. =auto is NOT a silent-skip footgun in our setup — it tells
# mkosi to generate + sign the UKI itself using ukify (the systemd-ukify
# package is in base.list). Build log shows the .efi being produced
# and signed when this is set.
#
# Microcode is included automatically when microcode_ctl + amd-ucode-firmware
# are installed (mkosi picks files from /usr/lib/firmware/). Add MicrocodeHost=
# only if you want to ship per-CPU images that only carry the host's microcode.
Hostname=myosi
Locale=en_US.UTF-8
Timezone=UTC
WithDocs=no
# The `initrd` sub-image inherits mkosi-initrd via Include= and produces
# initrd.cpio.zst — supersedes the default initrd entirely (one file,
# referenced above via %O/initrd.cpio.zst). Contents: writable /etc
# overlay setup before switch_root. See mkosi.images/initrd/.
#
# Image-signing trust note: image.crt does NOT need to be staged into
# the rootfs. dm-verity signature validation
# (CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG_PLATFORM_KEYRING) consults the
# kernel .platform keyring directly, which is populated at boot from
# UEFI db (CONFIG_LOAD_UEFI_KEYS) — qemu via OVMF_VARS, hardware via
# MOK. Under lockdown=integrity userspace cannot write to .machine
# anyway, so any cert-load service would fail. See README.md "Design notes" §10.5.
# Runtime repart.d now lives in mkosi.extra/usr/lib/repart.d/
# (ParticleOS pattern). Picked up by both the rootfs and the auto-
# built initrd via the standard mkosi.extra/ tree — no special
# ExtraTrees= line needed here.
# Relabel rootfs against selinux-policy-targeted after package install.
# Runs after postinst; postinst itself relabels /etc before snapshotting
# it to /usr/share/factory/etc so the overlay lowerdir carries correct contexts.
SELinuxRelabel=yes
# Baked into the signed UKI. Indented continuation form — mkosi v26 merges
# all lines into a single space-separated cmdline.
KernelCommandLine=rootfstype=erofs
                  # dm-verity root: kernel auto-detects via GPT type GUID + discoverable
                  # partitions spec. A/B slot selection is driven by sd-boot boot-counting,
                  # NOT explicit PARTLABEL pinning (PartitionUUIDs are different per slot).
                  rd.systemd.verity=1
                  systemd.verity_root_options=panic-on-corruption,restart-on-corruption
                  # Pin the image dissection policy explicitly. ParticleOS-style
                  # contract: signed root + encrypted var, refuse anything else
                  # we didn't declare (= ignore). systemd-image-policy(7).
                  # /home is a btrfs subvol of /var (not a partition), so no
                  # home= entry — the trailing :=ignore covers it.
                  systemd.image_policy=root=signed:var=encrypted:=ignore
                  # Restrict dissect to partitions whose labels match our
                  # naming convention. Prevents accidental dissection of
                  # another OS's partitions on a shared disk (partial
                  # mitigation for the dual-disk PARTLABEL collision).
                  systemd.image_filter=root=root-*:var=data-*
                  # Mutable state encryption: /var and /home live inside
                  # data-luks. systemd-repart formats it as LUKS2 with a
                  # key file on first boot. In the initrd,
                  # sysroot-prep.service selects the Type=var partition
                  # from the same disk as the booted root, unlocks it as
                  # /dev/mapper/data with TPM2-first/key-file-fallback
                  # semantics, unlocks present data-N pool members, scans
                  # btrfs, and mounts /sysroot/var before the /etc overlay.
                  # Post-switch, DPS Type=var still lets
                  # systemd-gpt-auto-generator reason about /var normally.
                  # Static home.mount handles the /home subvol of the same
                  # LUKS volume.
                  rd.luks.timeout=120
                  # Keep the key-file option visible to generated
                  # cryptsetup units. The initrd sysroot-prep helper
                  # also passes this key explicitly when attaching the
                  # primary var mapper; secondary data-N LUKS pool members
                  # are unlocked by explicit systemd-cryptsetup calls and
                  # do not rely on this global generator option.
                  rd.luks.options=key-file=/usr/share/myosi/keys/data.key,discard
                  # Kernel hardening
                  lockdown=integrity
                  module.sig_enforce=1
                  init_on_alloc=1
                  init_on_free=1
                  slab_nomerge
                  page_alloc.shuffle=1
                  randomize_kstack_offset=on
                  vsyscall=none
                  debugfs=off
                  mitigations=auto,nosmt
                  # SELinux enforcing on by default
                  selinux=1
                  enforcing=1
                  # Cgroup v2 only
                  systemd.unified_cgroup_hierarchy=1
                  cgroup_no_v1=all
                  # IOMMU for VM passthrough (kernel ignores wrong vendor)
                  iommu=pt
                  intel_iommu=on
                  amd_iommu=on
                  # Module blacklist policy — kernel cmdline is the single
                  # canonical home for "never load this module" rules in
                  # myosi (signed in the UKI, effective from earliest
                  # initrd phase, no risk of an /etc/modprobe.d/ shim).
                  # modprobe.d files in sysexts only carry MODULE OPTIONS
                  # from here on; runtime operator overrides still drop
                  # into /etc/modprobe.d/ on the writable overlay.
                  #
                  # nouveau + nova_core: in-tree NVIDIA drivers. They grab
                  # the GPU before the nvidia sysext merges, leaving
                  # nvidia.ko stuck on a busy device. Hosts without an
                  # NVIDIA GPU are unaffected — the modules never probe.
                  #
                  # iTCO_wdt + iTCO_vendor_support + sp5100_tco: Intel /
                  # AMD chipset hardware watchdogs. Spurious resets on
                  # consumer hardware. Same disable list as myos.
                  module_blacklist=nouveau,nova_core,iTCO_wdt,iTCO_vendor_support,sp5100_tco
                  #
                  # NOTE on initrd-only blacklisting (iwlwifi / btusb /
                  # btintel deferral):
                  #
                  # mkosi-initrd is a generic systemd-tools initrd, NOT
                  # dracut. `rd.driver.blacklist=` is a dracut-specific
                  # cmdline option — systemd-initrd silently ignores it,
                  # so a previous attempt to put iwlwifi,btintel,btusb
                  # there did nothing (verified by dmesg: iwlwifi loaded
                  # at hostname=fedora i.e. inside initrd, failed -ENOENT
                  # on iwlwifi-so-a0-gf-a0-89.ucode, marked AX211 dead).
                  #
                  # Instead, myosi-firmware-reprobe.service runs a
                  # rmmod+modprobe cycle post-pivot, which forcibly drops
                  # the dead initrd-loaded module and reloads it against
                  # the deployed root where /usr/lib/firmware/ has the
                  # full payload. See that unit for the full rationale.
                  # i915 does NOT need this — Fedora's i915 uses
                  # request_firmware_nowait so the DMC firmware load
                  # completes asynchronously when /usr/lib/firmware/i915/
                  # appears.
                  # Transparent hugepages on demand
                  transparent_hugepage=madvise
                  # Verbose boot — keep laptop display as the primary console
                  # and PRINT every systemd unit's [ OK ] / [FAILED] line plus
                  # kernel-warning-and-above messages. Matches the myos bootc
                  # cmdline (system/usr/lib/bootc/kargs.d/00-boot-logging.toml).
                  #
                  # Rationale: a 476 MB UKI loaded from USB plus a cold TPM2
                  # plus `quiet` made every cold boot look like a 30-45 s
                  # black-screen hang to the operator. Removing `quiet` and
                  # raising loglevel to KERN_WARNING (4) makes early-boot
                  # progress visible without flooding console with debug noise.
                  # rd.systemd.show_status=true forces systemd-pid1 (initrd
                  # AND main system) to print per-unit status lines even when
                  # the firmware reports a graphical console — without it
                  # systemd auto-suppresses status on framebuffer consoles.
                  #
                  # No serial console on the baked-in UKI — real hardware has
                  # no physical port and agetty spams I/O errors on every retry.
                  # QEMU/mkosi vm add console=ttyS0 automatically for inter-
                  # active console output; SSH (mkosi ssh) uses virtio-vsock.
                  loglevel=4
                  # systemd.show_status= forces pid1 to print per-unit
                  # status lines on the console. Without it, systemd auto-
                  # detects a framebuffer console (/dev/tty0 backed by
                  # i915) and suppresses [ OK ] / [FAILED] in favour of a
                  # single rotating indicator at the top of the screen —
                  # nice-looking but useless for diagnosing the post-pivot
                  # boot.
                  #
                  # Two flags needed because cmdline is re-parsed after
                  # switch_root: `rd.systemd.show_status=` controls the
                  # initrd's pid1, `systemd.show_status=` controls the
                  # main system's. Without the second one we'd see initrd
                  # units stream nicely up to the pivot, then the screen
                  # goes back to the rotating indicator for the remaining
                  # ~10 s of userspace boot.
                  rd.systemd.show_status=true
                  systemd.show_status=true
                  # udev device-event verbosity. `warning` (level 4) shows
                  # firmware-load failures, missing-driver warnings, and
                  # rule errors — exactly the diagnostic surface we need
                  # (e.g. iwlwifi failing firmware lookups, i915 waiting on
                  # DMC blobs) without flooding the console with every
                  # PCI/USB device add and every persistent-storage symlink
                  # creation. Bump to `info` temporarily when debugging USB
                  # enum / verity device discovery; revert to `warning` for
                  # steady-state.
                  # `rd.` prefix targets the initrd's udev (where the
                  # critical work — verity, LUKS, partition discovery —
                  # actually happens); the second one is for post-pivot udev.
                  rd.udev.log_level=warning
                  udev.log_level=warning
                  console=tty0
                  # Boot-time tunables that shave seconds off cold boot on
                  # real hardware. None affect security posture or functional
                  # correctness.
                  #
                  # 8250.nr_uarts=1
                  #   Limits the 8250 (legacy ISA serial) driver to a single
                  #   port (ttyS0 — the one we use as console). Without it
                  #   the kernel probes 4 ports (ttyS0..ttyS3) and each
                  #   probe waits ~5-6 s on a non-existent chip. ttyS0 keeps
                  #   working for serial debug + qemu boot output.
                  #
                  # tpm_tis.interrupts=0
                  #   Switches TPM_TIS (Intel/AMD fTPM + most discrete TPM2
                  #   chips) from interrupt-driven to polled mode. IRQ
                  #   negotiation with the chipset adds ~15-20 s on
                  #   Z690/Z790 Asus boards. Polling makes the driver ready
                  #   instantly; each TPM op pays ~10-50 ms vs interrupts.
                  #   TPM2-bound LUKS unlock needs ~10 ops total, so the
                  #   net is still ~+20 s saved once we wire
                  #   systemd-cryptenroll tpm2-device=auto.
                  8250.nr_uarts=1
                  tpm_tis.interrupts=0
                  # Audit off (SELinux gives us most of what audit covers)
                  audit=0

# Strip erofs /var children — fully SHADOWED at runtime by the btrfs
# mount from /dev/mapper/data over /var. In the initrd this is mounted by
# sysroot-prep.service so /var/etc is available for the /etc overlay;
# post-switch gpt-auto-generator can still emit var.mount from the Type=var
# data partition.
# Saves ~15 MB of empty package shells (/var/lib/<svc>/) that are
# re-created by /usr/lib/tmpfiles.d/myosi.conf at sysinit.
#
# Glob keeps /var dir as the mount point — only children purged.
#
# /etc cleanup does NOT live here. mkosi pipeline order:
#   17. mkosi.postinst
#   …
#   26. RemoveFiles=
#   27. SELinux relabel
#   28. mkosi.finalize
# RemoveFiles= runs BEFORE finalize, so wiping /etc/* here would empty
# /etc before finalize's /etc → /usr/share/factory/etc snapshot, producing an empty
# /usr/share/factory/etc. The snapshot + /etc wipe is done atomically inside
# myosi/mkosi.finalize itself.
RemoveFiles=/var/*

[Validation]
Verity=signed
VerityKey=keys/image.key
VerityCertificate=keys/image.crt
SignExpectedPcr=no
SecureBoot=yes
SecureBootKey=keys/boot.key
SecureBootCertificate=keys/boot.crt
SecureBootSignTool=sbsign

[Build]
# Source:Target. Without an explicit Target, mkosi flattens the source
# contents into SRCDIR root — so ./keys/boot.crt would land at
# $SRCDIR/boot.crt instead of $SRCDIR/keys/boot.crt, and the mkosi.postinst
# cert-copy step would silently no-op. Always pin the target.
BuildSources=keys:keys
BuildSources=mkosi.shared:mkosi.shared
# Expose mkosi.sandbox/ to postinst scripts via $SRCDIR. mkosi already
# applies the sandbox tree to its OWN dnf invocations (SandboxTrees=
# default), but a sub-image postinst running `dnf5 install` manually
# needs to copy the third-party repo files (rpmfusion-*, nvidia-
# container-toolkit, COPRs) into the buildroot before dnf can see
# them. Without this BuildSources= line, $SRCDIR/mkosi.sandbox does
# not exist inside the postinst sandbox — verified by the local-build
# failure "cp: cannot stat '/work/src/mkosi.sandbox/etc/yum.repos.d/
# *.repo': No such file or directory" in desktop/mkosi.postinst.
BuildSources=mkosi.sandbox:mkosi.sandbox
# build/ on the host is mkosi's OutputDirectory. Sub-images write their
# final .raw artifacts there in dependency order. Expose it under a
# distinct in-sandbox target (`build_share`) so the base postinst can
# read other sub-images' outputs without colliding with $OUTPUTDIR
# (= /work/out), which is the current sub-image's per-build staging
# and does NOT see prior sub-images' artifacts. Used by future
# baseline sysext bakes (no current consumer — fleet-keys was moved
# to mkosi.extra; kept around for the next baseline that needs it).
BuildSources=build:build_share
CacheDirectory=mkosi.cache
WithNetwork=yes
Environment=SYSTEMD_LOG_LEVEL=info

[Config]
# mkosi.conf carries ONLY the minimum required to build the base
# image: the rootfs + the initrd. Everything else
# (containers/virt profile bakes, desktop/nvidia/mybox sub-image
# materializations, per-host overrides) belongs in mkosi.local.conf
# so the committed file stays minimal and uniform across hosts.
#
# Why split:
#   - mkosi.conf = baseline that builds on any host (CI, fleet bare
#     metal, qemu dev box) and produces a bootable image with no
#     optional features
#   - mkosi.local.conf = host-specific additions (Profiles=containers
#     for dev hosts, Dependencies=nvidia-580xx for Pascal boxes,
#     WorkspaceDirectory= for in-container builds, QEMU-friendly
#     Output/Content/Runtime overrides for `mkosi vm`)
#
# See mkosi.local.conf.example for the canonical local-config template
# including the Profiles= / Dependencies= block that was previously
# baked here.
Dependencies=initrd
