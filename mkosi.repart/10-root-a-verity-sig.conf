[Partition]
Type=root-verity-sig
Label=root-%A-verity-sig
Verity=signature
VerityMatchKey=root
SplitName=verity-sig
# No SizeMinBytes/SizeMaxBytes here — systemd-repart enforces that
# Verity=signature partitions cannot have explicit sizes (the
# PKCS7-wrapped roothash signature length determines the partition
# size automatically). B slot uses fixed 16K to match what the kernel
# rounds A's signature to.
