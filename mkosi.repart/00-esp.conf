[Partition]
Type=esp
Format=vfat
SizeMinBytes=2G
SizeMaxBytes=2G
# Empty SplitName= suppresses the .esp.raw.zst split file no sysupdate
# transfer uses (20-uki.transfer writes the .efi straight to the ESP).
SplitName=

# Both sources are required: /efi has the shim + sd-boot chain, but
# mkosi v26's ukify pass writes the signed UKI under /boot/EFI/Linux/.
# Dropping /boot silently orphans the UKI (sd-boot finds no entries →
# unbootable); copy only the /boot/EFI/Linux subtree to avoid dragging
# Fedora's shim-x64 RPM clutter onto the ESP.
CopyFiles=/efi:/
CopyFiles=/boot/EFI/Linux:/EFI/Linux
