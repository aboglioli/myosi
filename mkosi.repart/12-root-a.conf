[Partition]
# Build-time root-A — minimized erofs. Last in partition order
# (after verity-sig + verity) so free space at the end of the disk
# is available for runtime growth without moving verity partitions
# (systemd-repart cannot move partitions). Mirrors ParticleOS's
# `usr` placement.
#
# %A expands to IMAGE_VERSION from /etc/os-release at systemd-repart
# build time. Versioned labels let sysupdate compare slot versions
# lexicographically.
Label=root-%A
Type=root
Format=erofs
CopyFiles=/
Verity=data
VerityMatchKey=root
SplitName=root
# Minimize=yes packs erofs tightly to actual content. Compressed
# install media stays small. Verity hash computed against minimized
# content — runtime partition can grow without invalidating signature.
Minimize=yes
Compression=zstd
CompressionLevel=3
