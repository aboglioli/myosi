[Partition]
# Build-time root-A, minimized erofs. Last in partition order so it can
# grow into end-of-disk free space — systemd-repart cannot move the
# verity partitions. %A = IMAGE_VERSION; versioned labels let sysupdate
# compare slot versions.
Label=root-%A
Type=root
Format=erofs
CopyFiles=/
Verity=data
VerityMatchKey=root
SplitName=root
# Verity hash is computed against minimized content — the runtime
# partition can grow without invalidating the signature.
Minimize=yes
Compression=zstd
CompressionLevel=3
