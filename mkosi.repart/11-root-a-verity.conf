[Partition]
# Build-time root-A verity hash partition. Variable-sized to fit the
# minimized erofs's hash tree (Minimize=yes implies no fixed size).
# Verity hash tree depth depends on content size — for our ~3 GB
# erofs at 4 KiB block + SHA-256 fanout 128, hash tree is ~24 MiB.
# Runtime config pins this at 400 MiB (matches ParticleOS) to leave
# comfortable headroom for image growth via sysupdate.
Type=root-verity
Label=root-%A-verity
Verity=hash
VerityMatchKey=root
SplitName=verity
# Pin 400M (matches ParticleOS + matches our runtime config). systemd-
# repart needs explicit bounds for the verity hash partition even with
# Minimize=yes on the root — without them, repart sizes the verity
# partition to GPT entry header size (4K), and the actual hash tree
# (~10M for our 1.1G erofs) doesn't fit.
SizeMinBytes=400M
SizeMaxBytes=400M
