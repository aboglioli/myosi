[Partition]
# Build-time root-A verity hash partition.
Type=root-verity
Label=root-%A-verity
Verity=hash
VerityMatchKey=root
SplitName=verity
# Pin 400M (matches ParticleOS + runtime config): even with Minimize=yes
# on the root, repart needs explicit bounds here — otherwise it sizes the
# verity partition to 4K and the actual hash tree doesn't fit.
SizeMinBytes=400M
SizeMaxBytes=400M
