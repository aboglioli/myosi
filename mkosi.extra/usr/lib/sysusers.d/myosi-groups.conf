# Supplementary groups referenced by homed user records via memberOf.
# Purpose is GID pinning only — homed silently drops missing groups, but
# unpinned GIDs drift per host and break chown scripts / migrated /var.
#
# Do NOT pre-declare homed users' primary groups (collides with homed's
# NSS group: "conflicts with an NSS group by the same name") and do NOT
# use `m USER GROUP` lines — sysusers' `m` creates a ghost /etc/passwd
# user that makes `homectl create` refuse with "user exists in NSS".
#
# Sysext-owned groups (libvirt, incus-admin, …) are created by each
# sysext's own sysusers.d file on merge; memberships are bound at runtime
# by homed-bind-sysext-groups (idempotent gpasswd into persistent
# /etc/group), so enabling a sysext auto-adds the user at next boot.
#
# wheel pinned at GID 10 defensively against `setup` install ordering.

g wheel       10 -
g video       -  -
g render      -  -
g input       -  -
g kvm         -  -
