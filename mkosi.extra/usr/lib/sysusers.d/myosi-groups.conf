# Supplementary groups referenced by homed user records shipped as
# credentials under /etc/credstore/home.create.<name> via the
# `memberOf` field.
#
# Why pre-declare them: homed user-record validation accepts missing
# groups at create time (the membership is silently dropped at home
# activation), so this file is NOT strictly required for bootstrap.
# It's useful for one thing — explicit GID pinning. Without these
# lines the GIDs drift between hosts depending on which package
# happened to install first; pinning here keeps `chown 36:36 …`
# scripts (kvm = 36), tar archives, and migrated /var partitions
# portable across the fleet.
#
# Primary groups for homed-managed users are NOT pre-declared here.
# systemd-homed creates them; nss-systemd exposes them via NSS so
# `getent group <name>` resolves. Pre-declaring would land the group
# in /etc/group, which collides with `homectl create` ("conflicts
# with an NSS group by the same name") — the same-name primary group
# must be owned by homed.
#
# Do NOT use `m USER GROUP` lines here for homed users. sysusers' `m`
# directive creates the user if missing (with auto-assigned UID and a
# nologin shell), which lands an /etc/passwd ghost that then makes
# `homectl create` refuse with "user exists in NSS database". The
# memberOf list in the JSON record is the only place that should set
# group memberships for a homed user.
#
# Groups owned by sysext-shipped packages — libvirt (libvirt-daemon),
# incus-admin (incus), and anything similar — are NOT declared here.
# Each sysext's own sysusers.d file (shipped by the matching upstream
# RPM, e.g. /usr/lib/sysusers.d/libvirt.conf from libvirt-daemon)
# creates the group when the sysext merges, picked up by our
# systemd-sysext.service ExecStartPost=systemd-sysusers replay.
#
# The base homed credential intentionally lists ONLY groups that
# always exist on a base host. Sysext-introduced memberships are
# bound at runtime by /usr/libexec/myosi/homed-bind-sysext-groups,
# which:
#   - runs as ExecStartPost of systemd-homed.service (first-boot
#     path, after homed materializes user)
#   - runs from refresh_sysext in lib.sh (live sysext refresh path)
#   - scans for known sysext-owned groups currently present in NSS
#   - calls `gpasswd -a user <group>` for each, which is
#     idempotent and writes to /etc/group (persistent btrfs subvol on
#     data-luks, preserved across image upgrades).
#
# Net effect: a base-only host has user in the universal groups
# only. Enabling the virt or containers sysext later AUTOMATICALLY
# adds user to the new groups at next boot, without operator
# intervention or hardcoding sysext-specific groups in this file.
#
# wheel: shipped by the `setup` package; pinned at GID 10 (the
#   historical Fedora value) defensively in case `setup` install
#   ordering ever changes.
# video / render / input / kvm: shipped by the `systemd` package;
#   pinned for the same reason.

g wheel       10 -
g video       -  -
g render      -  -
g input       -  -
g kvm         -  -
