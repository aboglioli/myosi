# State directories
d /var/lib/myosi 0755 root root -
# Per-task "run once" markers: one <task>.done file per oneshot service.
d /var/lib/myosi/.marks 0755 root root -
d /var/lib/extensions 0755 root root -
# Versioned sysext store, filled by sysupdate (InstancesMax=2). Kept
# OUTSIDE sysext's discovery paths; sysext-select links one version per
# name into /var/lib/extensions at boot / refresh.
d /var/lib/myosi/extensions 0755 root root -
# Sysupdate staging. Must be /var/lib (var_lib_t) — /var/cache is var_t and
# outside systemd-import-raw's ReadWritePaths=, which broke updatectl with
# "Permission denied" at source acquire.
d /var/lib/sysupdate 0755 root root -

# sysupdate silently ignores source files not owned by the caller (root);
# files copied from rootless builds carry uid 100000. Z normalizes to
# root:root every boot, mode untouched.
Z /var/lib/sysupdate - root root - -
Z /var/lib/extensions - root root - -
Z /var/lib/myosi/extensions - root root - -

# Landing pad for operator mounts; rootfs is read-only erofs so postinst
# symlinks /mnt -> var/mnt and this creates the target on the data volume.
d /var/mnt 0755 root root -

# Rootless quadlet app data. Outside homed's encrypted home so lingering
# user quadlets can start without the home unlocked. Sticky 1777: users
# mkdir their own <UID>/ subdir. Engine state stays in
# /var/lib/containers/users; SELinux stays var_t — quadlets must use :Z.
d /srv/users 1777 root root -

# Raw LXC machine trees; keep CoW for snapshot/reflink/send. Use NoCOW
# children only for VM disks/databases.
d /srv/machines 0755 root root -

# Game data off /home: keeps homed LUKS home small, disk-level LUKS
# suffices. Operator creates and chowns per-user library subdirs manually
# (not enforced here — tmpfiles would revert operator ownership each boot).
d /var/games  0755 root root -

# System-wide flatpak install path.
d /var/lib/flatpak  0755 root      root      -

# ----------------------------------------------------------------------
# Data partition: initrd repart creates /var /etc /home /srv subvolumes on
# data-luks; myosi-data-attach unlocks; tmpfiles fixes modes, NoCOW flags,
# and SELinux xattrs every boot.
# ----------------------------------------------------------------------

d /var/roothome       0700 root root -

# NoCOW (+C) on write-heavy paths; new files inherit the flag.
h /var/tmp            - - - - +C
h /var/cache          - - - - +C
h /var/log            - - - - +C
# /var/lib/containers is deliberately absent: nodatacow implies nodatasum,
# so scrub could not verify it, and it disables compression. Image layers
# are write-once, not the overwrite-heavy case btrfs scopes NoCOW to.
# Rootless podman storage outside /home: homed's idmapped mount only maps
# the user's own UID, so subuid (100000+) writes get EOVERFLOW on lchown.
# The image ships no containers config; each user points graphroot here
# from ~/.config/containers/storage.conf. Sticky 1777 so users mkdir
# their own <UID>/.
d /var/lib/containers/users 1777 root root -
h /var/lib/libvirt    - - - - +C
h /var/lib/incus      - - - - +C

# SELinux xattrs set directly via setxattr(2) — works without policy
# loaded. Without these, subvol roots created by repart come up
# unlabeled_t and journald + dbus-broker fail under enforcing.
t /var               - - - - security.selinux="system_u:object_r:var_t:s0"
t /var/cache         - - - - security.selinux="system_u:object_r:var_t:s0"
t /var/tmp           - - - - security.selinux="system_u:object_r:tmp_t:s0"
t /var/log           - - - - security.selinux="system_u:object_r:var_log_t:s0"
t /var/lib           - - - - security.selinux="system_u:object_r:var_lib_t:s0"
t /var/lib/incus     - - - - security.selinux="system_u:object_r:container_var_lib_t:s0"
t /var/lib/containers - - - - security.selinux="system_u:object_r:container_var_lib_t:s0"
t /var/lib/containers/users - - - - security.selinux="system_u:object_r:container_var_lib_t:s0"
# /srv/users deliberately not overridden: quadlet :Z relabels per
# container, and a forced label would flip back on restorecon anyway.
t /var/lib/libvirt   - - - - security.selinux="system_u:object_r:virt_var_lib_t:s0"
t /home              - - - - security.selinux="system_u:object_r:home_root_t:s0"
t /var/roothome      - - - - security.selinux="system_u:object_r:admin_home_t:s0"
# /etc must be seeded earlier by myosi-data-attach in the initrd (PID 1
# reads /etc before tmpfiles --boot); this line re-stamps every boot and
# survives operator restorecon -R /.
t /etc               - - - - security.selinux="system_u:object_r:etc_t:s0"

# Override directories that may be needed at first boot
d /etc/extensions 0755 root root -
d /etc/ssh/authorized_keys.d 0755 root root -

# mkosi --ssh delivers ssh.authorized_keys.root as a system credential.
# Upstream writes it to /root/.ssh, but /root is read-only erofs; land it
# in /etc (writable subvol, already in AuthorizedKeysFile). f^ = only when
# the credential is present, so production hosts stay untouched.
f^ /etc/ssh/authorized_keys.d/root 0600 root root - ssh.authorized_keys.root
