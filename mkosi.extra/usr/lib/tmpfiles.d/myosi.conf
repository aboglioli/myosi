# State directories
d /var/lib/myosi 0755 root root -
# Per-task "run once" markers: one <task>.done file per oneshot service.
d /var/lib/myosi/.marks 0755 root root -
d /var/lib/extensions 0755 root root -
# Versioned sysext store, filled by sysupdate (InstancesMax=2). Kept
# OUTSIDE sysext's discovery paths; sysext-select links one version per
# name into /var/lib/extensions at boot / refresh.
d /var/lib/myosi/extensions 0755 root root -
# Sysupdate staging. Must be /var/lib (var_lib_t) — /var/cache is var_t and
# outside systemd-import-raw's ReadWritePaths=, which broke updatectl with
# "Permission denied" at source acquire.
d /var/lib/sysupdate 0755 root root -

# sysupdate silently ignores source files not owned by the caller (root);
# files copied from rootless builds carry uid 100000. Z normalizes to
# root:root every boot, mode untouched.
Z /var/lib/sysupdate - root root - -
Z /var/lib/extensions - root root - -
Z /var/lib/myosi/extensions - root root - -

# Landing pad for operator mounts; rootfs is read-only erofs so postinst
# symlinks /mnt -> var/mnt and this creates the target on the data volume.
d /var/mnt 0755 root root -

# Mountpoint for var-mnt-backups.mount. 0700: nothing to see while unmounted,
# and no user writes to shadow once it is.
d /var/mnt/backups 0700 root root -

# Persistent journal. The systemd RPM owns /var/log/journal, but repart
# creates /var as an empty subvolume on first boot, so every RPM-owned
# /var path is discarded — 1826 of them in this image. journald's default
# Storage=auto is persistent only if this directory exists, so without
# this line a fresh install logs to /run and loses everything on reboot,
# exactly when the logs matter. systemd's own tmpfiles then set the mode,
# ACLs and NoCOW on it; only the creation was missing.
d /var/log/journal 2755 root systemd-journal -

# Rootless quadlet app data. Outside homed's encrypted home so lingering
# user quadlets can start without the home unlocked. Sticky 1777: users
# mkdir their own <UID>/ subdir. Engine state stays in
# /var/lib/containers/users; SELinux stays var_t — quadlets must use :Z.
d /srv/users 1777 root root -

# ----------------------------------------------------------------------
# Data partition: initrd repart creates /var /etc /home /srv subvolumes on
# data-luks; myosi-data-attach unlocks; tmpfiles fixes modes, NoCOW flags,
# and SELinux xattrs every boot.
# ----------------------------------------------------------------------

d /var/roothome       0700 root root -

# NoCOW (+C) is for data OVERWRITTEN IN PLACE, and only that. It implies
# nodatasum, so scrub can neither verify nor repair the file, and it
# disables compression — /var mounts compress=zstd:3, so both are a real
# loss on anything written once. Never flag a parent to get at its
# children: +C is inherited only by entries created after it is set, which
# is what made libvirt's swtpm/ come up NoCOW on one host and CoW on
# another purely on the order the directories happened to be created in.
#
# /var/tmp is the only path here that qualifies: transient scratch, where
# neither a checksum nor a compressed extent outlives the next boot.
# /var/log is NOT here: systemd's journal-nocow.conf already covers
# /var/log/journal, which is all of it that matters (53 of 59 files, 3.9G
# vs 497K), and its rationale — journal files carry internal checksums —
# does not extend to plain-text logs.
h /var/tmp            - - - - +C

# Deliberately NOT flagged, all for the same reason — write-once data that
# wants checksums and compression more than in-place writes:
#   /var/cache            regenerable, and dnf metadata is the most
#                         compressible thing in /var
#   /var/lib/containers   image layers are write-once
#   /var/lib/libvirt      the virt profile flags images/ alone, which is the
#                         scope libvirt itself uses for a btrfs pool
#   /var/lib/incus        the btrfs driver keeps a subvolume per instance,
#                         image and snapshot and snapshots on every launch,
#                         so CoW IS the storage model; nodatacow there also
#                         costs compression on VM disks
#
# Rootless podman storage outside /home: homed's idmapped mount only maps
# the user's own UID, so subuid (100000+) writes get EOVERFLOW on lchown.
# The image ships no containers config; each user points graphroot here
# from ~/.config/containers/storage.conf. Sticky 1777 so users mkdir
# their own <UID>/.
d /var/lib/containers/users 1777 root root -

# SELinux xattr set directly via setxattr(2). /etc only.
#
# This block once carried twelve paths, on the theory that repart-created
# subvolume roots come up unlabeled_t and journald + dbus-broker then fail
# under enforcing. What actually prevents that is systemd's own tmpfiles:
# var.conf ships `q /var`, home.conf ships `Q /home` and `q /srv`, and q/Q
# create the subvolume-or-directory AND adjust owner, mode and SELinux
# label. That is why /srv — which never had a line here — has always come
# up correctly var_t. /var and /home were duplicating those; the nine
# nested paths removed before them duplicated the policy default.
#
# Verified on a fresh install: /home's subvolume root deliberately set to
# unlabeled_t on disk, these lines removed, and it still came up
# home_root_t with home.mount active and zero AVC denials.
#
# /etc keeps its line for reasons that do not apply to the others:
# etc.conf carries no entry for /etc itself, PID 1 reads /etc before
# tmpfiles runs, and re-stamping every boot survives an operator's
# restorecon -R /.
# /etc must be seeded earlier by myosi-data-attach in the initrd (PID 1
# reads /etc before tmpfiles --boot); this line re-stamps every boot and
# survives operator restorecon -R /.
t /etc               - - - - security.selinux="system_u:object_r:etc_t:s0"

d /etc/ssh/authorized_keys.d 0755 root root -

# mkosi --ssh delivers ssh.authorized_keys.root as a system credential.
# Upstream writes it to /root/.ssh, but /root is read-only erofs; land it
# in /etc (writable subvol, already in AuthorizedKeysFile). f^ = only when
# the credential is present, so production hosts stay untouched.
f^ /etc/ssh/authorized_keys.d/root 0600 root root - ssh.authorized_keys.root
