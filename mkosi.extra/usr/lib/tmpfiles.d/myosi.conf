# State directories
d /var/lib/myosi 0755 root root -
# Per-task "run once" completion markers live here as <task>.done files,
# one per oneshot service (myosi-firstboot-relabel, flatpak-setup-
# flathub, …). Conditioning a service on a dedicated file under .marks/
# instead of scattering .relabeled / *-setup.done / random dotfiles
# across /var/lib/myosi gives the dir a single, greppable convention.
d /var/lib/myosi/.marks 0755 root root -
d /var/lib/extensions 0755 root root -
# Sysupdate stages downloaded release artifacts here. /var/lib is the
# canonical SELinux-labeled (var_lib_t) location systemd-sysupdate +
# systemd-import-raw expect by default; /var/cache/myosi/releases used
# to live here but fell under var_t (the data partition tmpfiles `t`
# entries below stamp /var/cache as var_t) AND outside
# systemd-import-raw's sandboxed ReadWritePaths=, which broke
# `updatectl update host@<VER>` at the source-acquire step with
# "Permission denied".
d /var/lib/sysupdate 0755 root root -

# systemd-sysupdate refuses to consider source files owned by anything
# other than the caller's uid (root). Files staged into /var/lib/sysupdate
# from rootless container builds carry uid 100000 (host-side userns
# remap), so `sudo cp -a build/*.raw /var/lib/sysupdate/` silently drops
# the new release from the "available" list — sysupdate just ignores
# non-root sources without an error. Same for /var/lib/extensions when
# the operator manually copies in a .raw. Z recurses ownership normalize
# to root:root on every boot; cheap, idempotent, mode left as-is via the
# - placeholder.
Z /var/lib/sysupdate - root root - -
Z /var/lib/extensions - root root - -

# /var/mnt — landing pad for operator-mounted block devices (USB
# drives, foreign root filesystems for migration, NFS shares, …). The
# rootfs is read-only erofs so /mnt itself can't host child dirs; the
# postinst symlinks /mnt → var/mnt and this entry ensures the target
# exists on every boot. Without it, `mkdir /mnt/foo` fails because
# /var/mnt hasn't been created on the LUKS-btrfs volume yet.
d /var/mnt 0755 root root -

# /srv/users — rootless quadlet service data (bind mounts, configs,
# DBs, app volumes). Lives OUTSIDE the homed-encrypted home so user
# quadlets activated by `loginctl enable-linger` at boot can mount
# their state without needing the home unlocked first.
#
# Sticky 1777 like /tmp: any user mkdir their own <UID>/ subdir on
# first quadlet pull, only owner can delete. Each user's tree is
# self-managed underneath.
#
# Separation from /var/lib/containers/users (podman engine internal
# storage): /srv/users holds USER application data; engine state
# stays under /var/lib/containers/users/<UID>/storage. Splitting
# keeps `podman system reset -f` from touching app data and gives a
# clean backup boundary (back up /srv/users, ignore engine state).
#
# SELinux: dir keeps the stock Fedora /srv label (var_t). Quadlets
# MUST use `:Z` on every `Volume=` line — podman relabels each bind
# mount to a per-container container_file_t variant on activation,
# bypassing the host source label. Without :Z, the container's
# read/write to var_t paths is denied by the targeted policy.
d /srv/users 1777 root root -

# /srv/machines — raw LXC machine trees. Keep this as normal CoW Btrfs
# by default so rootfs trees remain snapshot/reflink/send-friendly. Use
# dedicated NoCOW children only for VM disk images, databases, or other
# heavy random-write payloads.
d /srv/machines 0755 root root -

# /var/games — game data outside /home. Steam libraries, ROMs, etc.
# Kept off /home so:
#   - user's homed-managed LUKS-backed home stays small (no Steam
#     blowing past the 20G default DiskSize)
#   - game binaries are public, only need disk-level LUKS (data-luks),
#     not per-user crypto
#   - shareable across multiple interactive users if we ever add more
#
# Operator creates per-user library subdirs manually once:
#
#     sudo mkdir -p /var/games/steam
#     sudo chown user:user /var/games/steam
#
# then Settings → Storage → Add Library Folder → /var/games/steam in
# Steam. Subdir ownership is NOT enforced here — tmpfiles `d` would
# adjust the dir's owner/mode back to spec on every boot, which would
# clash with the operator's choice (different user, different mode,
# adding more libs like /var/games/lutris, …).
d /var/games  0755 root root -

# /var/lib/flatpak — system-wide flatpak install path. Default location
# for `flatpak install <app>` (no --user). Shared across users; per-user
# data lives in each user's ~/.var/app/<app>/ which is small.
d /var/lib/flatpak  0755 root      root      -

# ----------------------------------------------------------------------
# Data partition layout: initrd systemd-repart creates the /var, /etc,
# /home, /srv btrfs subvolumes on the data-luks pool; myosi-data-attach
# unlocks and scans them; sysroot-{var,etc}.mount mounts them; tmpfiles
# fixes modes, NoCOW flags, and SELinux xattrs every boot.
# ----------------------------------------------------------------------

# Mode-only normalization for the dirs repart pre-created on first
# boot (MakeDirectories=/var /etc /home /srv /var/roothome).
# Idempotent on subsequent boots.
d /var/roothome       0700 root root -

# NoCOW (+C via chattr) on write-heavy paths. New files created inside
# a NoCOW dir inherit the flag → no copy-on-write fragmentation under
# random writes (qcow2, libvirt images, dnf rpmdb, journald).
# `h` line sets the attribute on the directory itself; inheritance is
# kernel-side. Format: `h PATH MODE UID GID AGE ATTR`.
h /var/tmp            - - - - +C
h /var/cache          - - - - +C
h /var/log            - - - - +C
h /var/lib/containers - - - - +C
# Rootless container storage. Lives OUTSIDE /home so it's not under
# systemd-homed's idmapped mount: homed maps only the user's stable
# UID into the home, but rootless podman writes with subuid (UID
# 100000+) which has no idmap translation and gets EOVERFLOW
# ("lchown: value too large for defined data type") on every lchown
# during image unpack. Storing under /var/lib/containers/users/<UID>
# (configured via /usr/share/containers/storage.conf's rootless_storage_path)
# sidesteps the homed idmap entirely.
#
# Sticky 1777 like /tmp: any user can mkdir their own <UID> subdir on
# first podman use, only they can delete it. NoCOW (+C) inherited from
# parent /var/lib/containers via the `h` line above.
d /var/lib/containers/users 1777 root root -
h /var/lib/libvirt    - - - - +C
h /var/lib/incus      - - - - +C

# SELinux xattrs — sets `security.selinux` directly via setxattr(2).
# Works without policy loaded (no chcon/restorecon dependency), so the
# values survive a relabel-less first boot. Format:
#   t PATH - - - - XATTR_KEY="XATTR_VALUE"
#
# Without these, btrfs subvol roots created by repart on first boot
# come up as unlabeled_t and journald + dbus-broker fail to start
# under SELinux enforcing. The /etc subvol root gets the same
# treatment one step earlier — myosi-data-attach in the initrd
# setfattr's etc_t on it before pivot, then the `t /etc` line below
# re-stamps it every subsequent boot.
t /var               - - - - security.selinux="system_u:object_r:var_t:s0"
t /var/cache         - - - - security.selinux="system_u:object_r:var_t:s0"
t /var/tmp           - - - - security.selinux="system_u:object_r:tmp_t:s0"
t /var/log           - - - - security.selinux="system_u:object_r:var_log_t:s0"
t /var/lib           - - - - security.selinux="system_u:object_r:var_lib_t:s0"
t /var/lib/incus     - - - - security.selinux="system_u:object_r:container_var_lib_t:s0"
t /var/lib/containers - - - - security.selinux="system_u:object_r:container_var_lib_t:s0"
t /var/lib/containers/users - - - - security.selinux="system_u:object_r:container_var_lib_t:s0"
# /srv/users gets stock /srv var_t from Fedora policy. We DON'T
# override here because quadlets are expected to use `:Z` on every
# Volume= line — podman then relabels each bind mount to a per-
# container unique container_file_t variant on activation, regardless
# of the host source label. Overriding to container_file_t at the
# tmpfiles level would survive boot but flip back on any
# `restorecon -R /srv/users` (host policy doesn't list our forced
# label as canonical for /srv/*).
t /var/lib/libvirt   - - - - security.selinux="system_u:object_r:virt_var_lib_t:s0"
t /home              - - - - security.selinux="system_u:object_r:home_root_t:s0"
t /var/roothome      - - - - security.selinux="system_u:object_r:admin_home_t:s0"
# /etc subvol root xattr. The initrd's myosi-data-attach already
# setfattr's etc_t on this inode before pivot (PID 1 / journald read
# /etc/* before tmpfiles --boot fires, so the early seed is mandatory).
# This line is the belt-and-suspenders idempotent enforcement at every
# subsequent boot — also keeps the canonical label intact across any
# `restorecon -R /` operator runs.
t /etc               - - - - security.selinux="system_u:object_r:etc_t:s0"

# Override directories that may be needed at first boot
d /etc/extensions 0755 root root -
d /etc/ssh/authorized_keys.d 0755 root root -

# mkosi --ssh=runtime delivers an ephemeral pubkey as the
# ssh.authorized_keys.root system credential. Upstream provision.conf
# writes it to /root/.ssh/authorized_keys, but /root is read-only in
# our erofs image. Land it in /etc/ssh/authorized_keys.d/root instead
# — /etc is the writable btrfs subvol on data-luks, and the path is already in
# AuthorizedKeysFile (sshd_config.d/50-myosi.conf). f^ = only when the
# credential is present, so production hosts (no credential delivered)
# stay untouched.
f^ /etc/ssh/authorized_keys.d/root 0600 root root - ssh.authorized_keys.root
