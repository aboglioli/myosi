# Skip gssproxy when no Kerberos keytab is present. Mirrors the same
# condition that auth-rpcgss-module.service uses (its `Before=
# rpc-gssd.service` chain is what pulls gssproxy in via nfs-client.
# target → upstream Fedora unit graph).
#
# On myosi we ship nfs-utils for userspace `mount.nfs` only — no
# Kerberos credentials, no GSSAPI need. Without this condition,
# gssproxy.service fails at every boot with
#   "Failed to set up special execution directory in /var/lib"
# because systemd's StateDirectory= mkdir hits a SELinux denial on
# /var/lib/gssproxy/{clients,rcache} before the gssproxy process even
# spawns. The unit then lands in `failed` state and clutters
# `systemctl --failed`.
#
# Same outcome as masking, but reversible by operator (drop the
# /etc/krb5.keytab in place + the unit comes online normally).
[Unit]
ConditionPathExists=/etc/krb5.keytab
