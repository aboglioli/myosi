# Skip gssproxy without a Kerberos keytab (nfs-utils is shipped for
# mount.nfs only). Otherwise the unit fails every boot: StateDirectory=
# mkdir hits a SELinux denial on /var/lib/gssproxy before the process
# spawns, cluttering `systemctl --failed`. Reversible, unlike masking —
# drop /etc/krb5.keytab in place and the unit comes online.
[Unit]
ConditionPathExists=/etc/krb5.keytab
