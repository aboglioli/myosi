# systemd-repart.service drop-in (deployed-rootfs copy).
#
# Steady-state behaviour: 90-data.conf has no SizeMaxBytes, so once
# the disk is fully laid out, repart exits 1 with "Can't fit requested
# partitions into available free space (0B), refusing" on every
# subsequent boot. Whitelist exit code 1 so the unit settles into
# active(exited); the journal still records the diagnostic line.
#
# The initrd's matching drop-in (in initrd sub-image) also adds
# After=sysroot.mount to fix the first-boot auto-detect failure; we
# don't need that override here because by the time the rootfs's own
# systemd-repart.service runs (sysinit.target), the disk is already
# in its final shape and there is nothing for repart to do anyway.
[Service]
SuccessExitStatus=1
