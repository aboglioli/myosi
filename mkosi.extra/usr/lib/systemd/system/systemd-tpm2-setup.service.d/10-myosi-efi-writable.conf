# Order systemd-tpm2-setup after the ESP mount. Upstream declares no
# ordering against /efi, and with PrivateMounts=yes the unit snapshots
# its mount namespace at start — if it wins the race against efi.mount
# (gpt-auto is disabled on myosi) it captures the read-only rootfs stub
# /efi and every write under /efi/loader/credentials/ fails EACCES.
# Related upstream symptom: https://github.com/systemd/systemd/issues/40087

[Unit]
RequiresMountsFor=/efi
