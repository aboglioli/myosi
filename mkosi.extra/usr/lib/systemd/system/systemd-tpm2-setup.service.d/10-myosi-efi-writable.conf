# Order systemd-tpm2-setup AFTER /efi is mounted.
#
# Boot-time race on myosi installs (gpt-auto-generator disabled
# because it doesn't cope with our verity setup; efi.mount is the
# explicit unit that actually mounts the ESP):
#
#   17:17:17 systemd[1]: Mounting efi.mount...
#   17:17:17 systemd[1]: Starting systemd-tpm2-setup.service...
#   17:17:17 systemd[1]: Mounted efi.mount.            ← AFTER
#   17:17:17 systemd-tpm2-setup: Failed to write anchor secret
#       file to '/efi/loader/credentials/...': Permission denied
#
# Upstream tpm2-setup.service only declares
# `RequiresMountsFor=/var/lib/systemd` and `Before=sysinit.target` —
# no ordering against the ESP. Combined with the systemd-default
# `PrivateMounts=yes`, tpm2-setup snapshots its own mount namespace
# at start time. If it wins the race against efi.mount, that snapshot
# captures the rootfs's read-only stub /efi (verity-baked 0700 dir)
# rather than the vfat ESP — every write under /efi/loader/
# credentials/ then EACCESs even though the host's mount namespace
# has the ESP mounted moments later.
#
# `RequiresMountsFor=/efi` blocks tpm2-setup start until the host
# /efi mount is complete; the unit's PrivateMounts snapshot then
# captures the real ESP. This is a targeted ordering fix — not a
# sandboxing override — and would be a valid upstream PR if the
# split-/boot vs UKI-only deployment topology that triggers it
# becomes common enough.
#
# Related upstream symptom (ENOENT on a different cause path):
#   https://github.com/systemd/systemd/issues/40087

[Unit]
RequiresMountsFor=/efi
