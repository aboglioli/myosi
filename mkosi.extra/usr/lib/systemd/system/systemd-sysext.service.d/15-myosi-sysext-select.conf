# Select one sysext version per name into /var/lib/extensions/ before
# the merge: verity-baked baselines (/usr/share/myosi/extensions/) and
# sysupdate-fetched versioned raws (/var/lib/myosi/extensions/) both live
# OUTSIDE sysext's scan paths; sysext-select links the version matching
# the booted IMAGE_VERSION. ExecStartPre fires on every boot AND every
# `systemd-sysext refresh`.
#
# OR-gate needed to break a chicken-egg: on fresh first boot all four
# upstream ConditionDirectoryNotEmpty paths are empty, so the service —
# and therefore its ExecStartPre — would never run and no baseline or
# store selection would ever activate. Gate on our source dirs instead;
# they stay out of the scan list (sysext only scans the four upstream
# paths anyway).
[Unit]
ConditionDirectoryNotEmpty=|/usr/share/myosi/extensions
ConditionDirectoryNotEmpty=|/var/lib/myosi/extensions

[Service]
ExecStartPre=/usr/libexec/myosi/sysext-select
