# Materialize verity-baked baseline raws (/usr/share/myosi/extensions/,
# a path sysext discovery does NOT scan) as symlinks in
# /var/lib/extensions/ before the merge. ExecStartPre fires on every boot
# AND every `systemd-sysext refresh`; sysext-baked-sync also prunes stale
# symlinks after image upgrades.
#
# OR-gate needed to break a chicken-egg: on fresh first boot all four
# upstream ConditionDirectoryNotEmpty paths are empty, so the service —
# and therefore its ExecStartPre — would never run and no baseline would
# ever activate. Gate on the baked dir instead; keep it out of the scan
# list (sysext only scans the four upstream paths anyway).
[Unit]
ConditionDirectoryNotEmpty=|/usr/share/myosi/extensions

[Service]
ExecStartPre=/usr/libexec/myosi/sysext-baked-sync
