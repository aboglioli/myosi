# Materialize verity-baked sysext baselines into /var/lib/extensions/
# BEFORE the systemd-sysext.service ExecStart merge runs.
#
# Background:
#   systemd-sysext discovers raws only from /etc/extensions/,
#   /run/extensions/, /var/lib/extensions/ (per systemd-sysext(8)).
#   The image-baked baseline raws ship at /usr/share/myosi/extensions/
#   (verity-immutable, atomic-swap on bootc image upgrade) — that path
#   is NOT scanned by sysext discovery.
#
# /usr/libexec/myosi/sysext-baked-sync symlinks each baked raw into
# /var/lib/extensions/ and removes stale symlinks whose target image
# no longer ships in the current baseline (image-upgrade cleanup).
#
# Runs as ExecStartPre so it fires on:
#   * every boot (sysext.service starts after sysinit)
#   * every `systemd-sysext refresh` (the service reactivates)
#
# Gate extension:
#   Upstream systemd-sysext.service skips when all four of the standard
#   ConditionDirectoryNotEmpty= paths are empty (/etc/extensions/,
#   /run/extensions/, /var/lib/extensions/, /.extra/sysext/). On a fresh
#   first boot, /var/lib/extensions/ is empty (sysext-baked-sync hasn't
#   run yet — it's ExecStartPre INSIDE the service we want to fire),
#   so the unit is skipped. ExecStartPre never runs, no symlinks land,
#   no baseline ever activates.
#
#   Add /usr/share/myosi/extensions/ as an additional OR-gate path.
#   If a baked baseline exists, the gate fires; ExecStartPre then
#   materializes the symlinks into /var/lib/extensions/; ExecStart's
#   sd-merge discovers them from the scan path. Chicken-egg resolved.
#   (We learned the hard way that systemd-sysext does NOT scan
#   /usr/share/myosi/extensions/ for discovery — it scans only the
#   four upstream-default paths — so the gate-only addition is fine.
#   We don't need or want it in the scan list.)
[Unit]
ConditionDirectoryNotEmpty=|/usr/share/myosi/extensions

[Service]
ExecStartPre=/usr/libexec/myosi/sysext-baked-sync
