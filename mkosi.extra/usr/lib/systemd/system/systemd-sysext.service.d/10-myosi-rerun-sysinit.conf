# Re-run sysinit tools that read /usr/lib/*.d/ AFTER the sysext merge —
# the upstream units run before sysext.service, leaving sysext-shipped
# fragments unprocessed. Running inside sysext.service means it fires at
# boot AND on every `systemd-sysext refresh`. Leading `-` tolerates
# expected non-fatal exits (sysusers exits 1 on missing config dir).
[Service]
# Paths matter: Fedora ships sysusers/tmpfiles at /usr/bin, binfmt/sysctl
# at /usr/lib/systemd — a wrong path is a silent skip due to `-`.
#
# sysext-modules-refresh is NOT just depmod: mkosi's sysext sealer strips
# modules.* indexes, so it stacks a tmpfs overlay on
# /usr/lib/modules/<KVER>, re-runs depmod, and modprobes modules-load.d
# entries IN THE SAME PROCESS — a separate systemd-modules-load run would
# race libkmod's cache and see a stale modules.dep ("Failed to find
# module"). Deliberately no systemd-modules-load fallback here.
ExecStartPost=-/usr/libexec/myosi/sysext-modules-refresh
ExecStartPost=-/usr/bin/systemd-sysusers
ExecStartPost=-/usr/lib/systemd/systemd-binfmt
ExecStartPost=-/usr/lib/systemd/systemd-sysctl
ExecStartPost=-/usr/bin/systemd-tmpfiles --create
ExecStartPost=-/usr/libexec/myosi/sysext-wants
