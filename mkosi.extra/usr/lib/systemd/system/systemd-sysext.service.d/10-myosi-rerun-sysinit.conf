# Re-run every sysinit-phase tool that reads /usr/lib/*.d/ AFTER the
# sysext merge so it picks up sysext-shipped drop-ins. Each upstream
# unit (systemd-sysusers.service, systemd-modules-load.service, …) also
# runs early in sysinit BEFORE sysext.service — those races leave the
# sysext-shipped fragments unprocessed when the upstream tool wins.
# This drop-in runs the second idempotent pass inside sysext.service's
# own ExecStart sequence, so:
#
#   * It fires at boot AND on every `systemd-sysext refresh` (sysupdate-
#     deployed sysext changes at runtime get picked up without a reboot).
#   * It supersedes the per-tool myosi-{sysusers,modules-load,depmod}-
#     after-sysext.service oneshots that previously did the same thing
#     with ~50 lines each and only ran once at boot.
#
# Leading `-` tolerates expected non-fatal exits:
#   * systemd-sysusers exits 1 on missing config dir (e.g. sysext stub)
#   * systemd-modules-load logs but exits 0 even if a module fails to
#     load (signature mismatch, kernel ABI drift)
#   * sysext-modules-refresh's overlay mount succeeds idempotently
#
# sysext-modules-refresh is NOT just `depmod -a`: mkosi v26's sysext sealer
# strips modules.{dep,alias,symbols,…} from kmod sysexts at build
# time. The script stacks a tmpfs overlay over /usr/lib/modules/<KVER>/
# and re-runs depmod inside it so the effective index covers the
# merged sysext .ko files. Without it `modprobe nvidia_drm` reports
# "Module not found" even though the .ko exists in the merged /usr.
[Service]
# Note Fedora's split: sysusers + tmpfiles ship at /usr/bin/, the
# others at /usr/lib/systemd/. Wrong path here = silent SKIP at boot
# because of the leading `-`. Verified empirically: `command not
# found` was logged by sd-merge for systemd-sysusers when it pointed
# at /usr/lib/systemd/systemd-sysusers (doesn't exist on F44).
#
# sysext-modules-refresh handles kmod loading itself: after stacking the
# tmpfs overlay on /usr/lib/modules/<KVER>/ and running depmod -a, it
# directly invokes `modprobe` on every entry in /usr/lib/modules-
# load.d/*.conf, /run/modules-load.d/*.conf, /etc/modules-load.d/*.conf
# IN THE SAME PROCESS. This avoids the libkmod cache-invalidation race
# observed when a separate systemd-modules-load process spawns
# immediately after depmod's write — it would see a stale modules.dep
# and report "Failed to find module 'nvidia'" even though the .ko is
# in the merged overlay. sysext-modules-refresh's same-process modprobe sees
# fresh state and loads correctly.
#
# We DELIBERATELY do NOT call systemd-modules-load here as a fallback:
# it would spawn a new process subject to the same race, log spurious
# "Failed to find" errors for modules that were just loaded by depmod-
# refresh, and produce confusing duplicate "systemd-modules-load runs
# twice" lines in the boot journal (the first being the real sysinit
# call, the second being this fallback). sysext-modules-refresh is sufficient.
ExecStartPost=-/usr/libexec/myosi/sysext-modules-refresh
ExecStartPost=-/usr/bin/systemd-sysusers
ExecStartPost=-/usr/lib/systemd/systemd-binfmt
ExecStartPost=-/usr/lib/systemd/systemd-sysctl
ExecStartPost=-/usr/bin/systemd-tmpfiles --create
