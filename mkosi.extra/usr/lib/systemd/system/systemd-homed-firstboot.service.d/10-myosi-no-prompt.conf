# Upstream runs `homectl firstboot --prompt-new-user`, which drops into an
# interactive wizard on the console when no home.create.<name> credential is
# present. On a headless first boot that is an unattended hang with nobody to
# answer it — the same trap systemd-firstboot.service.d/ already had to defuse
# for --prompt-root-password.
#
# Stripping the flag keeps the part we want: homectl still materialises every
# home.create.<name> credential it finds. A host booted without one simply gets
# no interactive user, which is the correct outcome for a server.
[Service]
ExecStart=
ExecStart=homectl firstboot --prompt-shell=no --prompt-groups=no --mute-console=yes
