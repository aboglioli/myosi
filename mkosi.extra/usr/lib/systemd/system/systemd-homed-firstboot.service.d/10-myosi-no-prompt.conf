# The unit is disabled in the preset — home.create.<name> is unusable on
# systemd 259 — so this drop-in is a guard, not part of the normal path: it
# only matters if someone enables the unit by hand.
#
# Upstream runs `homectl firstboot --prompt-new-user`, which drops into an
# interactive console wizard when no credential is present. On a headless
# first boot that is an unattended hang with nobody to answer it — the same
# trap systemd-firstboot.service.d/ already had to defuse for
# --prompt-root-password.
[Service]
ExecStart=
ExecStart=homectl firstboot --prompt-shell=no --prompt-groups=no --mute-console=yes
