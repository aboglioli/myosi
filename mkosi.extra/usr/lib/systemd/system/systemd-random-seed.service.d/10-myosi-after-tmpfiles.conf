# First boot only: the fresh /var subvol root is unlabeled until
# tmpfiles-setup stamps var_t (t-lines in tmpfiles.d/myosi.conf), and
# random-seed runs early enough to hit an SELinux denial creating
# /var/lib/systemd/random-seed ("Permission denied", unit FAILED on
# every fresh install). Order after tmpfiles-setup — no cycle:
# tmpfiles-setup carries no ordering on random-seed.
[Unit]
After=systemd-tmpfiles-setup.service
