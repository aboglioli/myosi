# Fedora's unit runs --prompt-locale/--prompt-timezone/--prompt-root-password,
# and a LOCKED root ("!" in shadow) counts as "password not set" — first boot
# then BLOCKS on an interactive console prompt (observed in qemu; would stall
# every unattended install). Locale/timezone/hostname are baked and root is
# locked BY DESIGN (bootstrap via `sudo passwd root` from user). Strip the
# prompts but keep the unit: systemd-firstboot still applies the
# firstboot.* credentials (hostname, root password, ...) when provided via
# SMBIOS/ESP — masking the unit would kill that documented flow.
[Service]
ExecStart=
ExecStart=systemd-firstboot
