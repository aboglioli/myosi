# Point libglib at the runtime union cache produced by
# myosi-glib-schemas-compile.service (rebuilt every boot from the merged
# /usr/share/glib-2.0/schemas/ across all sysexts).
#
# GSETTINGS_SCHEMA_DIR is the surgical knob: glib layers it ON TOP of
# the existing source chain (XDG_DATA_DIRS-derived) — see
# g_settings_schema_source_new_from_directory in gio/gsettingsschema.c.
# Our union cache wins for any schema it contains; for anything it
# doesn't (or when the service hasn't run yet) glib falls through to
# /usr/share/glib-2.0/schemas/gschemas.compiled (base image's cache,
# unchanged). No XDG_DATA_DIRS manipulation needed — preserves flatpak's
# carefully-ordered XDG entries, doesn't affect icon / desktop-file /
# mime-type lookup at all.
#
# Single-directory variable (not colon-separated), so no need for
# fallback expansion gymnastics.
GSETTINGS_SCHEMA_DIR=/run/myosi/glib-schemas/glib-2.0/schemas
