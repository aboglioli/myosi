# Point libglib at the per-boot union cache from
# myosi-glib-schemas-compile.service. GSETTINGS_SCHEMA_DIR layers ON TOP
# of the XDG-derived source chain: our union wins where present, glib
# falls through to the base image's gschemas.compiled otherwise. No
# XDG_DATA_DIRS manipulation — preserves flatpak's ordered entries.
GSETTINGS_SCHEMA_DIR=/run/myosi/glib-schemas/glib-2.0/schemas
