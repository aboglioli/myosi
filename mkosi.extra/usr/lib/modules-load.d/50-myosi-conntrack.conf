# Load nf_conntrack at boot so the sysctl net.netfilter.nf_conntrack_max
# value from /usr/lib/sysctl.d/50-myosi-performance.conf has a valid
# /proc target. Without this, the sysctl runs before any firewalld
# rule triggers conntrack-module autoload and logs:
#   sysctl: cannot stat /proc/sys/net/netfilter/nf_conntrack_max:
#           No such file or directory
nf_conntrack
