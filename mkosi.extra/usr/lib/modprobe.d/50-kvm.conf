# KVM module parameters. Must live in base, not the virt sysext: udev
# coldplug autoloads kvm* before systemd-sysext merges /usr, and modprobe
# reads config only at load time — sysext-shipped values land too late.
#
# nested/ept lines match upstream defaults (set explicitly to survive a
# default flip) and are inert on CPUs where the module doesn't load.
# experimental_zcopytx=1 (upstream default 0): zero-copy TX throughput win
# on multi-Gbps links; flip back to 0 first if a guest shows virtio-net
# packet loss under load.
# halt_poll_ns=400000 (default 200000): lower idle-vCPU wakeup latency at
# slight host CPU cost; adaptive shrink keeps idle guests cheap. Drop to
# 200000/0 on battery-bound hosts.
options kvm_intel nested=1 ept=1
options kvm_amd nested=1
options vhost_net experimental_zcopytx=1
options kvm halt_poll_ns=400000
