# KVM module parameters — applied at module load time.
#
# Why this lives in base (not in the virt sysext): udev coldplug
# autoloads kvm + kvm_intel/kvm_amd very early in main-system boot,
# BEFORE systemd-sysext.service merges the virt /usr layer. modprobe
# reads its config only at load time; values from a sysext-shipped
# file land too late and the modules end up with kernel defaults.
# Verified on externy 2026-06-10: with this file in the sysext,
# kvm.halt_poll_ns was 200000 (default) instead of 400000.
#
# Per-line risk envelope on hardware diversity:
#
# kvm_intel nested=1
#   - Only applied if kvm_intel actually loads (Intel CPU with VMX
#     enabled in firmware). On AMD hosts the module never loads and
#     the line is inert. On Intel without VMX it never loads either.
#   - Matches the upstream kernel default (=1 since 5.x), so a host
#     without this file behaves identically — we set it explicitly so
#     a future kernel default flip doesn't silently disable nested.
#
# kvm_intel ept=1
#   - Same load-time gating as nested. Requires EPT-capable Intel
#     (Westmere 2010+; universally true on anything that boots a
#     modern Fedora 44 kernel — F44 already requires x86_64-v2).
#   - Upstream default is also =1. Explicit set guards against a
#     future regression.
#
# kvm_amd nested=1
#   - Only applies on AMD CPUs with SVM. On Intel hosts kvm_amd never
#     loads and the line is inert. Upstream default became =1 in
#     Linux 4.20 — same explicit-vs-default story as Intel.
#
# vhost_net experimental_zcopytx=1
#   - Affects libvirt/qemu virtio-net when vhost=on. Upstream default
#     is 0 (off). Enabling zero-copy TX usually improves throughput
#     on multi-Gbps host links, occasionally regresses small-packet
#     latency or trips on older guest virtio drivers. Has carried the
#     "experimental" label for ~15 years; in practice it is stable on
#     modern guests. Worth carrying explicitly because the perf win
#     on a containerized libvirt / nspawn-bridge host is large; on
#     pure-desktop hosts that never start a VM the module never loads.
#   - If you ever see a guest with severe virtio-net packet loss
#     under load, the first knob to flip back to 0 is this one.
#
# kvm halt_poll_ns=400000
#   - Tunes how many nanoseconds the host busy-polls before halting
#     an idle vCPU. Default 200000 (200us); we double it. Trades a
#     small amount of additional host CPU for reduced wake-up latency
#     on interactive guests. Upstream's adaptive grow/shrink (the
#     halt_poll_ns_grow / halt_poll_ns_shrink knobs) keeps actual
#     consumption proportional to guest idle behavior — a guest that
#     stays halted shrinks toward 0 anyway.
#   - On a battery-bound laptop running many VMs all day, this
#     measurably increases idle wattage. If you care: drop to the
#     default 200000 or set to 0 to disable polling entirely.
#   - This is the only line in this file whose value differs from the
#     upstream kernel default and therefore the only one that would
#     observably change behaviour if removed.
options kvm_intel nested=1 ept=1
options kvm_amd nested=1
options vhost_net experimental_zcopytx=1
options kvm halt_poll_ns=400000
