[Partition]
# Encrypted mutable data partition.
#
# systemd-repart in the initrd owns the WHOLE lifecycle on first boot:
#   - creates the GPT entry (if missing)
#   - formats it as LUKS2 with a key file from
#     /usr/share/myosi/keys/data.key
#   - formats the inside as btrfs
#   - creates /var, /etc, /home, and /srv btrfs subvolumes
#   - makes /var the default subvolume
#   - pre-creates /var/roothome and the /etc /home /srv mountpoints
#     inside the /var subvol
#
# DPS auto-discovery: Type=var (DPS GUID 4d21b016-b534-45c2-a9fb-
# 5c16e091fd2d, added in systemd 252) marks this partition as /var.
# systemd-gpt-auto-generator handles non-root mounts after switch_root.
# myosi needs /var AND /etc earlier because both live as sibling
# subvolumes on the same data-luks btrfs volume, so myosi-data-attach
# selects this Type=var partition from the same disk as the booted
# root, unlocks it as /dev/mapper/data, unlocks present data-N pool
# members, scans btrfs; sysroot-{var,etc}.mount then mount the /var
# and /etc subvols before switch_root.
#
# Steady state: every boot reads the key file, unlocks LUKS, mounts
# the btrfs at /var. No operator interaction required.
#
# Operators can add TPM2/passphrase/recovery unlock methods directly via
# systemd-cryptenroll or cryptsetup, verify them, then wipe the bootstrap
# key-file slot when appropriate.
#
# /home and /srv are btrfs subvolumes of the same LUKS volume. They are
# mounted by static home.mount and srv.mount units.
#
# FactoryReset=yes lets repart recreate this partition during an explicit
# systemd factory reset. Normal first boot and steady-state growth still
# use the universal key-file path; no TPM2 PCR policy is required for the
# bootstrap unlock.

# Type=var is the DPS GUID for /var partitions. It is used by
# myosi-data-attach.service before switch_root and by systemd's DPS
# tooling after switch_root.
Type=var
Label=data-luks
SizeMinBytes=256M
# No SizeMaxBytes = grow to fill remaining free space on the disk.
FactoryReset=yes

# Universal LUKS encryption path. Key file lives at a fixed path in
# the verity-baked root, ALSO copied into the initrd cpio so both
# repart (initrd) and cryptsetup (initrd + main system) can find it.
# Absolute path = repart opens it directly (relative paths would
# resolve under /run/credentials/, which we don't use here).
Encrypt=key-file
# Directive name is KeyFile= (added in systemd 259). The non-existent
# EncryptedVolumeKeyFile= is silently ignored — was hit during qemu
# boot test 2026-06-10: repart falls back to a random key, cryptsetup
# can't unlock with our file, drops to passphrase prompt, hangs.
KeyFile=/usr/share/myosi/keys/data.key

Format=btrfs

# Single btrfs over LUKS. Layout:
#   top-level ID 5              (not normally mounted)
#   ├── var/                    (default subvol, mounted at /var)
#   ├── etc/                    (mounted at /etc — was an overlay
#   │                            upperdir under /var prior to the
#   │                            etc-subvol refactor; now a real
#   │                            persistent subvolume seeded from
#   │                            /usr/share/factory/etc by systemd-tmpfiles' C!
#   │                            directive on first boot)
#   ├── home/                   (mounted at /home)
#   └── srv/                    (mounted at /srv)
Subvolumes=/var
Subvolumes=/etc
Subvolumes=/home
Subvolumes=/srv
DefaultSubvolume=/var
MakeDirectories=/var
MakeDirectories=/etc
MakeDirectories=/home
MakeDirectories=/srv
MakeDirectories=/var/roothome

# /mnt (operator block-device landing) is provisioned by
# tmpfiles.d/myosi.conf every boot because it is a regular directory
# under the /var subvolume.
