[Partition]
# Encrypted mutable data partition. Initrd systemd-repart owns first-boot
# creation: GPT entry, LUKS2 with the baked key file, btrfs with /var
# /state /home /srv subvolumes (/var default). myosi-data-attach picks this
# Type=var partition from the boot disk and unlocks it before switch_root
# because the /etc overlay's upper lives on /state and must be mounted
# pre-pivot. Operators may enroll TPM2/passphrase/recovery slots later.

Type=var
Label=data-luks
SizeMinBytes=256M
# No SizeMaxBytes = grow to fill remaining free space on the disk.
FactoryReset=yes

# Key file baked in the verity root AND copied into the initrd cpio so
# both repart (initrd) and cryptsetup can read it. Must be absolute —
# relative paths resolve under /run/credentials/.
Encrypt=key-file
# Directive is KeyFile= (systemd 259). A wrong name is silently ignored
# and repart falls back to a random key — cryptsetup then can't unlock
# and boot hangs at a passphrase prompt.
KeyFile=/usr/share/myosi/keys/data.key

Format=btrfs

# /state carries the /etc overlay's upperdir + workdir (see
# usr/libexec/myosi/etc-assemble). It is NOT /etc itself: overlayfs needs
# upper and work as siblings inside one subvolume, so the subvolume root
# cannot be the upperdir. /home and /srv are mounted by static home.mount
# / srv.mount units. No /etc subvolume: /etc is assembled, not stored.
Subvolumes=/var
Subvolumes=/state
Subvolumes=/home
Subvolumes=/srv
DefaultSubvolume=/var
MakeDirectories=/var
MakeDirectories=/state
MakeDirectories=/home
MakeDirectories=/srv
MakeDirectories=/var/roothome
