[Partition]
# Runtime root-A — 5G-20G, Weight=200. Last in partition order (after
# verity) so growth into free space is possible. CopyBlocks=auto preserves
# the build-time minimized erofs. Same Label= as build config so sysupdate
# sees the active A slot.
Label=root-%A
Type=root
Verity=data
VerityMatchKey=root
SplitName=root
CopyBlocks=auto
SizeMinBytes=5G
SizeMaxBytes=20G
# Gentle growth curve vs data's Weight=1000: roots stay at the 5G floor
# until ~38G disk, track ~14% of free space up to ~143G, then cap at 20G
# — beyond that every extra gigabyte lands in data. Min/max are clamps
# applied after the weight pass. Keep symmetric with 22-root-b.conf.
Weight=200
