[Partition]
# Runtime root-A — variable 5G-20G + Weight=200. Last in partition
# order (after verity) so growth into free disk space is possible.
# CopyBlocks=auto preserves the build-time minimized erofs content.
#
# Same Label= as build config — sysupdate sees the active A slot.
Label=root-%A
Type=root
Verity=data
VerityMatchKey=root
SplitName=root
CopyBlocks=auto
SizeMinBytes=5G
SizeMaxBytes=20G
# Weight=200 (gentle growth curve).
#
# systemd-repart math: each partition's `fair_share` is computed as
# `(weight / total_weight) × (disk - fixed)` where `fixed` is ~2.8 G
# (ESP + 2× verity-sig + 2× verity). SizeMinBytes / SizeMaxBytes are
# *clamps* applied AFTER the weight pass — if fair_share falls below
# the min, the partition is clamped up to the min (pulling space from
# the rest); if it rises above the max, clamped down to the max
# (giving surplus back to the rest).
#
# With W_root=200 and the data partition's default Weight=1000 (total
# weight 1400), each root's fair share is 200/1400 = 14.29 % of the
# free pool. The clamp boundaries:
#
#    fair_share = SizeMinBytes (5 G) → disk = 5 × 1400/200 + 2.8 = ~37.8 G
#    fair_share = SizeMaxBytes (20 G) → disk = 20 × 1400/200 + 2.8 = ~142.8 G
#
# So three regimes apply:
#   • disk < 37.8 G   roots clamped up to 5 G; data takes whatever is left
#   • 37.8 – 142.8 G  roots grow linearly with disk; data tracks 5×
#   • disk > 142.8 G  roots clamped down to 20 G; data eats the surplus
#
#    Disk    Each root    Data         Regime
#    -----   ---------    ----------   -------------
#    15 G    5 G (min)    2.2 G        min clamp, data starved
#    20 G    5 G (min)    7.2 G        min clamp           <- USB target
#    32 G    5 G (min)    19.2 G       min clamp           <- qemu test
#    37.8 G  5 G          25 G         threshold
#    50 G    6.74 G       33.7 G       linear
#    64 G    8.74 G       43.7 G       linear
#    75 G    10.31 G      51.6 G       linear
#    100 G   13.89 G      69.4 G       linear
#    128 G   17.89 G      89.4 G       linear
#    142.8 G 20 G         120 G        threshold
#    256 G   20 G (cap)   213.2 G      max clamp
#    1 TB    20 G (cap)   981.2 G      max clamp
#
# Rationale for the gentle curve: kernel + sysexts rarely push the
# rootfs past 5 G, so leaving most of the disk for /var, /home, /srv
# is the better default. Roots stay at the floor until ~38 G disk,
# then track 14% of remaining space, then cap at ~143 G — past which
# every additional gigabyte of disk lands in data. Keep the curve
# symmetric on B-slot (22-root-b.conf).
Weight=200
