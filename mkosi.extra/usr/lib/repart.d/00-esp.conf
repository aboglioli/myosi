[Partition]
Type=esp
Format=vfat
SizeMinBytes=2G
SizeMaxBytes=2G

# Two distinct sources land on the ESP:
#
# 1. mkosi's bootctl install pass populates $BUILDROOT/efi/ with the
#    shim + sd-boot chain, our shipped DER certs, and loader config:
#      /efi/EFI/BOOT/BOOTX64.EFI   shim (firmware-fallback path)
#      /efi/EFI/BOOT/grubx64.EFI   sd-boot (renamed for shim auto-load)
#      /efi/EFI/BOOT/mmx64.efi     MOK Manager
#      /efi/EFI/systemd/...        sd-boot canonical install location
#      /efi/loader/                sd-boot loader.conf + key auto-enroll
#      /efi/keys/{boot,image}.der  certs for UEFI db enrollment
#
# 2. mkosi's ukify pass writes the signed UKI under $BUILDROOT/boot/
#    (NOT /efi/) — mkosi v26 puts UKIs there by default:
#      /boot/EFI/Linux/myosi-<KVER>-<HASH>.efi
#
# The chain firmware → BOOTX64.EFI → grubx64.EFI → /EFI/Linux/<UKI> requires
# BOTH on the ESP. An earlier attempt to drop /boot  silently orphaned the UKI
# — sd-boot loaded but found no entries to chain to and the install became
# unbootable. Fixed by copying only the /boot/EFI/Linux/ subtree, not all of
# /boot — that avoids dragging Fedora's shim-x64 RPM clutter
# (/boot/EFI/fedora/..., /boot/grub2/, /boot/symvers-*) onto the ESP.
CopyFiles=/efi:/
CopyFiles=/boot/EFI/Linux:/EFI/Linux
