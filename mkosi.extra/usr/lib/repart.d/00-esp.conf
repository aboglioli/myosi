[Partition]
Type=esp
Format=vfat
SizeMinBytes=2G
SizeMaxBytes=2G

# Two sources: bootctl install populates $BUILDROOT/efi (shim + sd-boot
# chain, DER certs, loader config); ukify writes the signed UKI under
# $BUILDROOT/boot/EFI/Linux (mkosi v26 default). Both are required —
# dropping /boot orphans the UKI and the install is unbootable. Copy only
# the /boot/EFI/Linux subtree to avoid dragging Fedora shim RPM clutter
# (/boot/EFI/fedora, /boot/grub2, symvers) onto the ESP.
CopyFiles=/efi:/
CopyFiles=/boot/EFI/Linux:/EFI/Linux
