[Partition]
# Runtime root-A verity-sig: PKCS7-wrapped roothash signature, size auto.
# CopyBlocks= is incompatible with Verity=signature — repart writes the blob.
Type=root-verity-sig
Label=root-%A-verity-sig
Verity=signature
VerityMatchKey=root
# Weight=0 keeps this fixed-size partition out of the growth split;
# repart's default Weight=1000 on the four verity partitions empirically
# crushed the roots' Weight=200 share down to their 5G minimum.
Weight=0
