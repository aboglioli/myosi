[Partition]
# Runtime root-A verity-sig partition. PKCS7-wrapped roothash
# signature, size auto-determined.
#
# CopyBlocks= cannot be used with Verity=signature — repart writes
# the signature blob.
Type=root-verity-sig
Label=root-%A-verity-sig
Verity=signature
VerityMatchKey=root
# Weight=0 keeps this fixed-size partition out of the proportional
# growth split. Without it, repart's default Weight=1000 on each
# of the 4 verity-related partitions (sig+hash × A+B) crushes the
# root partitions' Weight=200 share — empirically pulls the
# 64 G disk root partitions down to SizeMinBytes=5 G instead of
# the ~8.74 G the docs predict. The verity partitions are
# fixed-size (16K sig + 400M hash) so they have nothing to absorb
# anyway; tagging them Weight=0 makes that explicit to repart's
# context_grow_partitions algorithm.
Weight=0
