[Partition]
# Runtime root-B verity placeholder. Empty slot — no Verity=hash /
# VerityMatchKey= declared so it doesn't compete with the A slot's
# verity entry (only ONE verity hash per VerityMatchKey allowed).
# sysupdate fills these fields when it writes content into the slot.
Type=root-verity
Label=_empty
NoAuto=1
SizeMinBytes=400M
SizeMaxBytes=400M
SplitName=-
# Weight=0 — fixed-size partition, exclude from the proportional
# growth split. See 10-root-a-verity-sig.conf for the full rationale.
Weight=0
