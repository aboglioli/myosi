[Partition]
# Runtime root-A verity hash partition. Fixed 400 MiB (matches
# ParticleOS + build config).
#
# CopyBlocks= cannot be used with Verity=hash — repart computes the
# hash tree from the data partition and writes it. So we just declare
# the partition shape.
Type=root-verity
Label=root-%A-verity
Verity=hash
VerityMatchKey=root
SizeMinBytes=400M
SizeMaxBytes=400M
# Weight=0 — fixed-size partition, exclude from the proportional
# growth split. See 10-root-a-verity-sig.conf for the full rationale.
Weight=0
