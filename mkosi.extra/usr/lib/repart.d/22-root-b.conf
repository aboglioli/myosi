[Partition]
# Runtime root-B placeholder. Variable 5G-20G + Weight=200 to match
# slot A for swap parity. Label=_empty + NoAuto=1 (ParticleOS pattern)
# keep the empty B-slot invisible to auto-discovery until sysupdate
# writes content. See 12-root-a.conf for the full weight/size table.
Type=root
Label=_empty
NoAuto=1
SizeMinBytes=5G
SizeMaxBytes=20G
Weight=200
SplitName=-
