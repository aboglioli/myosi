# myosi performance + dev/VM tuning (cross-referenced against Bazzite,
# CachyOS, Nobara, Fedora CoreOS baselines).
# Deliberately NOT set: sched_*_ns knobs (removed with EEVDF in 6.6+),
# kernel.unprivileged_userns_clone (removed in 5.10+).

# ===== VM (gaming + Proton/Wine + large container images) =====
# Proton/Wine need huge per-process mappings; matches Bazzite/Nobara.
vm.max_map_count = 2147483642

# High swappiness pushes cold pages to zRAM aggressively — compressed RAM
# beats disk swap. Bazzite/CachyOS value.
vm.swappiness = 180

# Keep inode/dentry caches hot for build/IDE workloads.
vm.vfs_cache_pressure = 50

# More low-watermark headroom; fewer stall spikes on allocation bursts.
vm.watermark_scale_factor = 500

# Dirty-page limits in absolute bytes (RAM-size independent). CachyOS
# defaults: 256MB cap, 128MB background trigger, 5s writeback.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728
vm.dirty_writeback_centisecs = 500
vm.dirty_expire_centisecs = 3000

# zRAM decompresses per page — prefetching adjacent pages wastes CPU.
# 0 = swap in one page at a time.
vm.page-cluster = 0

# Proactive compaction's latency spikes hurt interactive workloads more
# than THP availability helps. Bazzite/CachyOS = 0.
vm.compaction_proactiveness = 0

# Bias page lock toward writers to avoid livelock under dirty pressure.
vm.page_lock_unfairness = 1

# ===== Filesystem (IDE + build + container file watching) =====
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
fs.inotify.max_queued_events = 32768
fs.file-max = 2097152

# ===== Network — TCP/IP stack tuning =====
# BBR (latest variant from tcp_bbr module) + fq qdisc.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Recover from ICMP blackholes dropping fragment-needed messages.
net.ipv4.tcp_mtu_probing = 1

# TCP Fast Open for client AND server roles.
net.ipv4.tcp_fastopen = 3

# Don't slow-start back to 1 after idle on long-lived multiplexed sessions.
net.ipv4.tcp_slow_start_after_idle = 0

# Bufferbloat: cap unsent socket buffer at 16 KB (Google desktop guidance).
net.ipv4.tcp_notsent_lowat = 16384

# Default 1000 drops packets under burst on modern NICs.
net.core.netdev_max_backlog = 16384

# IPv6 privacy extensions (RFC 4941): prefer temporary addresses.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# ===== Kernel scheduler + latency =====
# NMI watchdog is pure overhead on a desktop; also a jitter source.
kernel.nmi_watchdog = 0

# Split-lock detection kills some Windows games under Proton. 0 = ignore.
kernel.split_lock_mitigate = 0

# Drop delay-accounting overhead (loses iotop/taskstats data). CachyOS = 0.
kernel.task_delayacct = 0

# ===== Console verbosity =====
# Quiet console; journal still captures everything.
kernel.printk = 3 3 3 3

# ===== Security =====
# Hide kernel pointers from non-CAP_SYSLOG readers (kASLR leak mitigation).
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Keep kexec enabled for rescue/factory-reset chainloading; lock down via
# /etc override on hardened hosts.
kernel.kexec_load_disabled = 0

# Unprivileged userfaultfd is a recurring exploit primitive; only affects
# unprivileged QEMU postcopy migration, which we don't run.
vm.unprivileged_userfaultfd = 0

# Let users bind DNS/HTTP/etc. without CAP_NET_BIND_SERVICE wrappers.
net.ipv4.ip_unprivileged_port_start = 53

# ===== KVM/QEMU host networking =====
# Generous socket buffer ceiling for guest virtio-net throughput.
net.core.rmem_default = 16777216
net.core.rmem_max = 16777216
net.core.wmem_default = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Requires nf_conntrack loaded BEFORE sysctl runs — paired
# modules-load.d/50-myosi-conntrack.conf ensures that; otherwise this
# path doesn't exist yet and the sysctl fails at boot.
net.netfilter.nf_conntrack_max = 262144

# Neighbor table sizing for many bridged guests / rootless pods.
net.ipv4.neigh.default.gc_thresh1 = 2048
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192
