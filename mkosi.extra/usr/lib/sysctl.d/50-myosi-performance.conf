# myosi performance + dev/VM tuning.
#
# Sources, cross-referenced 2026-06:
#   * Bazzite (gaming desktop / Steam Deck)
#   * CachyOS (tuned defaults for current kernels)
#   * Nobara (multimedia/gaming)
#   * Fedora CoreOS (server defaults)
#   * systemd sysctl baseline (Fedora 44 / 7.0.x kernel)
#
# Knobs deliberately NOT set:
#   * kernel.sched_latency_ns, sched_min_granularity_ns,
#     sched_wakeup_granularity_ns — REMOVED in Linux 6.6+ when the
#     EEVDF scheduler replaced CFS. Writing them now logs
#     "No such file or directory" at every boot.
#   * kernel.unprivileged_userns_clone — REMOVED in 5.10+; user
#     namespaces for unprivileged callers are now always permitted at
#     the kernel level, gated by capabilities at runtime.
#   * net.netfilter.nf_conntrack_max — moved to a paired modules-
#     load.d entry that loads nf_conntrack first; without that module
#     the sysctl path doesn't exist and we get a boot-time error.

# ===== VM (gaming + Proton/Wine + large container images) =====
# Proton/Wine require very large per-process virtual mappings to map
# Windows game memory. 32-bit max would limit games like Star Citizen.
# Value matches Bazzite / Nobara / Fedora's anaconda preset.
vm.max_map_count = 2147483642

# With zRAM swap (zram-generator-defaults shipped in base): high
# swappiness lets the kernel push cold pages to compressed RAM
# aggressively, which is FASTER than disk swap and frees uncompressed
# RAM for the working set. Both Bazzite and CachyOS use 180.
vm.swappiness = 180

# Reduce inode/dentry cache reclaim pressure — keeps filesystem
# metadata hot, helps build/IDE workloads with many small files.
vm.vfs_cache_pressure = 50

# Reserve more low-watermark memory headroom before zone reclaim
# triggers; reduces stall spikes during sudden allocation bursts.
vm.watermark_scale_factor = 500

# Dirty-page tuning by ABSOLUTE bytes (vs ratio): consistent behavior
# regardless of RAM size. Values match CachyOS defaults — 256MB dirty
# cap, 128MB background-flush trigger, 5s writeback period.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728
vm.dirty_writeback_centisecs = 500
# Maximum age (centisec) of dirty data before mandatory writeback.
# Default 3000 = 30s. Bazzite uses default — keep.
vm.dirty_expire_centisecs = 3000

# zRAM compresses each page independently, so prefetching adjacent
# pages on swap-in (the default `page-cluster=3` = 2^3=8 pages) wastes
# CPU on decompression of pages that may never be touched. 0 = swap
# one page at a time.
vm.page-cluster = 0

# Disable proactive memory compaction — runs in kernel threads
# periodically to defragment, but the latency spikes hurt interactive
# workloads more than the THP availability helps. Bazzite/CachyOS = 0.
vm.compaction_proactiveness = 0

# Bias the page lock toward the writer to reduce livelock under high
# concurrent dirty pressure (build farms, db replays).
vm.page_lock_unfairness = 1

# ===== Filesystem (IDE + build + container file watching) =====
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
fs.inotify.max_queued_events = 32768
fs.file-max = 2097152

# ===== Network — TCP/IP stack tuning =====
# BBR3 congestion control (auto-selects latest available BBR variant
# from the loaded tcp_bbr module). Substantially better throughput +
# fairness than CUBIC on high-latency / lossy links.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Probe for path MTU > MSS during handshake — recovers from ICMP
# blackholes silently dropping fragment-needed messages.
net.ipv4.tcp_mtu_probing = 1

# TCP Fast Open: skip the three-way handshake's RTT for known peers
# by stashing a cookie on the first connect, then sending data with
# the SYN on subsequent connects. Value 3 = enable for both client
# AND server roles.
net.ipv4.tcp_fastopen = 3

# Don't slow-start back to 1 after an idle connection. For long-lived
# HTTP/2 / gRPC / SSH multiplexed sessions, the next packet after a
# pause shouldn't pay an N-RTT ramp-up cost again.
net.ipv4.tcp_slow_start_after_idle = 0

# Bufferbloat mitigation: cap unsent data buffered in the socket so
# the kernel pushes back on userspace earlier. 16 KB matches Google's
# published bufferbloat guidance for desktop workloads.
net.ipv4.tcp_notsent_lowat = 16384

# Increase per-CPU input queue when packets-per-second spikes (10 GbE,
# container fan-out, libvirt bridged guests). Default 1000 drops
# packets under burst on modern NICs.
net.core.netdev_max_backlog = 16384

# IPv6 privacy extensions: use temporary addresses for outbound
# connections (RFC 4941). Both default = 2 = "prefer temp addr".
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# ===== Kernel scheduler + latency =====
# NMI watchdog scans all CPUs at HZ — useful for hang detection in
# production servers, pure overhead on a desktop. Disabling saves ~1%
# CPU on average and removes a known cause of small jitter spikes.
kernel.nmi_watchdog = 0

# Split-lock detection traps atomic ops that span a cache line and
# kills the offending task. Breaks some Windows games under Proton +
# older firmware tools. 0 = ignore, 1 = warn, 2 = fatal. Bazzite = 0.
kernel.split_lock_mitigate = 0

# Disable delay accounting CPU overhead — minor (~1 syscall/sched
# event) but uniformly applied. CachyOS sets to 0. Drop only if no
# diagnostic tooling (iotop, taskstats) is expected.
kernel.task_delayacct = 0

# ===== Console verbosity =====
# Suppress non-critical kernel messages from spamming the boot console
# during normal operation. The journal still captures everything.
kernel.printk = 3 3 3 3

# ===== Security =====
# Hide pointer values from /proc when read by non-CAP_SYSLOG procs.
# Mitigates information leaks for kASLR / ROP gadget discovery.
kernel.kptr_restrict = 2

# Restrict dmesg to root by default. Same kASLR-leak reasoning.
kernel.dmesg_restrict = 1

# Keep kexec_load_disabled = 0 so factory-reset / debug workflows
# that need to chainload a rescue kernel keep working. Set to 1 on
# locked-down production hosts via /etc override.
kernel.kexec_load_disabled = 0

# Disable unprivileged userfaultfd — used as an exploit primitive in
# multiple kernel CVEs (Dirty Pipe-adjacent, etc.) to race page tables.
# Affects only QEMU postcopy migration (which we don't run unprivileged).
vm.unprivileged_userfaultfd = 0

# Lower unprivileged port floor to 53 so users can bind DNS, ssh-on-53,
# HTTP-on-80 etc. without CAP_NET_BIND_SERVICE wrappers. Common
# Bazzite/CachyOS choice for homelab/dev workflows.
net.ipv4.ip_unprivileged_port_start = 53

# ===== KVM/QEMU host networking =====
# Generous socket buffer ceiling for guest virtio-net throughput.
# Same on Bazzite for Steam-streaming workloads.
net.core.rmem_default = 16777216
net.core.rmem_max = 16777216
net.core.wmem_default = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Connection-tracking cap. Requires nf_conntrack module loaded BEFORE
# sysctl runs — see /usr/lib/modules-load.d/50-myosi-conntrack.conf
# which we ship to ensure ordering. firewalld would lazy-load
# nf_conntrack on first firewall rule, but by then this sysctl has
# already failed with "No such file or directory" at boot.
net.netfilter.nf_conntrack_max = 262144

# Neighbor (ARP/NDP) table sizing — relevant for hosts running many
# bridged libvirt guests or container networks with hundreds of
# rootless pods.
net.ipv4.neigh.default.gc_thresh1 = 2048
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192
