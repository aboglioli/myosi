# Auth — key-only, no root password, publickey-only method
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes
AuthenticationMethods publickey
PubkeyAuthentication yes
PermitEmptyPasswords no

# Authorized keys search order: per-user file, operator-managed /etc
# drop-in, baseline baked in verity-protected /usr, systemd credentials.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u /usr/share/myosi/ssh/authorized_keys.d/%u /run/credentials/@system/ssh.authorized_keys.%u

# Session limits
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 60

# Disable unused/insecure features
X11Forwarding no
PrintMotd no
PermitUserEnvironment no
PermitUserRC no
IgnoreRhosts yes
StrictModes yes
HostbasedAuthentication no

# Forwarding (agent + tcp ok, X11 off)
AllowAgentForwarding yes
AllowTcpForwarding yes

# Modern crypto only (post-2020)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

Subsystem sftp /usr/libexec/openssh/sftp-server
