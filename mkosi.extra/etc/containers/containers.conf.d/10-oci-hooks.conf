# podman only reads OCI hooks from the directories in hooks_dir, and its
# compiled-in default is /usr/share/containers/oci/hooks.d — on the read-only
# verity root, where nothing can create it. /etc is the writable overlay, and it
# is the ONLY place a hook can be registered on this system: a sysext merges
# /usr and never /etc, so a package installing a hook (nvidia-container-toolkit)
# leaves nothing podman will look at.
[engine]
hooks_dir = ["/etc/containers/oci/hooks.d", "/usr/share/containers/oci/hooks.d"]
