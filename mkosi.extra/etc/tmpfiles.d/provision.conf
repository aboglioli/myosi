# Override upstream /usr/lib/tmpfiles.d/provision.conf.
#
# tmpfiles.d(5) precedence: files in /etc win over same-name files in
# /usr/lib. By shipping this empty drop-in we neutralize the upstream
# provision.conf rules:
#
#   d- /root  :0700 root :root -
#   d- /root/.ssh  :0700 root :root -
#   f^ /root/.ssh/authorized_keys :0600 root :root - ssh.authorized_keys.root
#
# Those rules conflict with our layout:
#   1. /root is a SYMLINK to var/roothome (myosi rootfs is read-only
#      erofs — see mkosi.postinst section 9). The `d /root` line errors
#      every boot with "already exists and is not a directory".
#   2. The ssh.authorized_keys.root credential is consumed by our own
#      f^ rule in /usr/lib/tmpfiles.d/myosi.conf that lands the key at
#      /etc/ssh/authorized_keys.d/root (persistent btrfs subvol on data-luks), matching
#      sshd_config.d/50-myosi.conf AuthorizedKeysFile.
