# zram swap, always on (generator runs every boot, nothing to enable).
# In /etc to fully override the zram-generator-defaults package config.
# Device size = RAM (zram-fraction=1.0) capped at 16 GiB; zstd for best
# ratio/speed on modern CPUs.

[zram0]
compression-algorithm = zstd
zram-fraction = 1.0
max-zram-size = 16384
