# zram swap — always on. systemd-zram-generator reads this at boot
# (zram-generator is a generator, not a service; runs every boot, no
# need to `systemctl enable` anything).
#
# Placed in /etc (not /usr/lib drop-in) to fully override the
# zram-generator-defaults package config and guarantee always-on
# behavior even if upstream defaults change.
#
# zram-fraction=1.0  → device size = RAM size, capped at max-zram-size
# max-zram-size=16384 → never grow past 16 GiB regardless of RAM
# compression-algorithm=zstd → best ratio/speed on modern CPUs

[zram0]
compression-algorithm = zstd
zram-fraction = 1.0
max-zram-size = 16384
