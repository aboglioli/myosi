# systemd 257+ section name. Per systemd-sysext(5) v259, the only valid
# keys in [SysExt] are Mutable= and ImagePolicy=. ExtensionsDirectory=
# and NoImageSignaturePolicy= from earlier drafts of this file are NOT
# valid — systemd logs them as ignored.
# /var/lib/extensions/ is the default extension directory.
[SysExt]
ImagePolicy=root=signed:=absent
# /usr is the verity-protected RO root. We never want sysext merges
# to introduce a writable layer there — defense in depth against
# unverified mutations to /usr.
Mutable=no
