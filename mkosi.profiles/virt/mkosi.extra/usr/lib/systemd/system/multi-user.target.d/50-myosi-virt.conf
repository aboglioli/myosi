# multi-user.target drop-in for the virt profile.
#
# virtqemud.service is the QEMU/KVM driver daemon. Its socket
# (.socket entry) auto-spawns it on first client connect and idles
# back out after 2 min. Upholding the SERVICE here matches Fedora's
# preset behaviour for boot-time autostart of the daemon.
[Unit]
Upholds=virtqemud.service
