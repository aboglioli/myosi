# sockets.target drop-in for the virt profile.
#
# Activates the modular libvirt sockets. Upholds= (vs static .wants/
# symlink) means runtime sysext refresh auto-starts these sockets
# without a reboot — important on hosts where the virt sysext is
# updated via sysupdate-delivered swaps.
#
# Each daemon ships three sockets:
#   * main      management RW endpoint
#   * -ro       read-only queries (non-root monitoring)
#   * -admin    admin commands (reload/restart from non-root)
#
# Kept (might be useful) even when not in active daily use:
#   virtinterfaced  — host network interface mgmt (NM owns interfaces
#                     normally; useful for libvirt-managed bridges)
#   virtnwfilterd   — libvirt network filter rules (security policy)
[Unit]
Upholds=virtqemud.socket virtqemud-ro.socket virtqemud-admin.socket
Upholds=virtstoraged.socket virtstoraged-ro.socket virtstoraged-admin.socket
Upholds=virtnetworkd.socket virtnetworkd-ro.socket virtnetworkd-admin.socket
Upholds=virtnodedevd.socket virtnodedevd-ro.socket virtnodedevd-admin.socket
Upholds=virtinterfaced.socket virtinterfaced-ro.socket virtinterfaced-admin.socket
Upholds=virtnwfilterd.socket virtnwfilterd-ro.socket virtnwfilterd-admin.socket
