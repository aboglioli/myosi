# libvirt storage layout. Uses the upstream-canonical /var/lib/libvirt
# tree so stock selinux-policy-targeted virt rules apply without any
# file_contexts.subs alias or local policy patch:
#
#   /var/lib/libvirt          parent on /var's btrfs pool
#   /var/lib/libvirt/images   qemu:qemu  — libvirt 'default' pool, qcow2 disks
#   /var/lib/libvirt/isos     root:root  — libvirt 'isos' pool, read-only install media
#
# /var/lib/libvirt itself is the nodatacow btrfs subvol, so any qcow2/raw
# files created under either child inherit NoCOW (mount-time nodatacow
# applies to files created with zero size — the qcow2 case).
#
# SELinux labels come from stock policy: /var/lib/libvirt/images is
# virt_image_t, /var/lib/libvirt/isos is virt_content_t. virtqemud_t
# already has write access on both. Per-VM disk files get dynamic
# svirt_image_t labels by libvirt at VM start, overriding the parent
# dir label for the disk inode.
d /var/lib/libvirt/images 2775 qemu qemu -
d /var/lib/libvirt/isos   0755 root root -
