# libvirt's /var tree. repart leaves /var empty on first boot, so every
# RPM-owned path under it is gone and the daemons recreate what they need.
# Pre-created here for two reasons: a confined daemon cannot always create
# its own directory (virtlogd could not make /var/log/libvirt, so every
# domain start failed with "Unable to open .../<domain>.log: Permission
# denied"), and tmpfiles applies the file_contexts label rather than
# whatever the parent happens to carry.
#
# Listed = the policy type differs from the parent's, so it must not be
# left to inheritance:
#     images virt_image_t   isos/boot virt_content_t
#     qemu   qemu_var_run_t  /var/log/libvirt virt_log_t
#     /var/cache/libvirt virt_cache_t
# Paths whose type matches their parent — /var/log/libvirt/qemu, swtpm/,
# dnsmasq/ — are labelled correctly by inheritance and stay absent.
d /var/lib/libvirt/images 2775 qemu qemu -
d /var/lib/libvirt/isos   0755 root root -
d /var/lib/libvirt/boot   0755 root root -
d /var/lib/libvirt/qemu   0755 qemu qemu -
d /var/log/libvirt        0755 root root -
d /var/cache/libvirt      0755 root root -

# NoCOW the disk images and nothing else — the scope libvirt itself uses
# when it builds a btrfs storage pool. A qcow2 is overwritten randomly and
# the guest checksums its own filesystem, so losing btrfs checksums is a
# fair trade; it also avoids the spurious checksum errors Windows guests
# produce under cache=none, having no stable pages. Everything else here is
# small, rarely written and precious — nvram/, swtpm/ — and keeps its
# checksums. There is deliberately no +C on the /var/lib/libvirt parent:
# that only leaks the flag into whatever libvirt creates next.
h /var/lib/libvirt/images - - - - +C
