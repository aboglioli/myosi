# libvirt disk + ISO dirs at the upstream-canonical /var/lib/libvirt tree so stock
# SELinux policy labels apply (virt_image_t / virt_content_t) — no
# file_contexts alias needed.
d /var/lib/libvirt/images 2775 qemu qemu -
d /var/lib/libvirt/isos   0755 root root -

# NoCOW on the disk dir itself. The +C that myosi.conf stamps on
# /var/lib/libvirt never reaches here: that parent only comes into existence
# as an implicit parent of the line above, so it carries no +C at the moment
# images/ is created; btrfs applies +C only to entries created afterwards,
# and `h` is not recursive. Without this line every qcow2 is CoW and
# fragments. isos/ and qemu/ are left alone — read-mostly and tiny
# respectively, both want checksums more than they want NoCOW.
h /var/lib/libvirt/images - - - - +C

# libvirtd and virtlogd recreate these at runtime, because repart leaves /var
# empty on first boot and every RPM-owned path under it is gone. A directory
# the daemon creates inherits its PARENT's SELinux type rather than the one
# policy assigns, so /var/log/libvirt comes up var_log_t instead of
# virt_log_t — and virtlogd, being confined, then cannot open its own log:
# every domain start fails with "Unable to open .../<domain>.log: Permission
# denied". Same for /var/lib/libvirt/qemu, which lands virt_var_lib_t instead
# of qemu_var_run_t. Creating them here means tmpfiles applies the policy
# label from the start; the subdirectories the daemons add underneath then
# inherit the correct type. Same reasoning as /var/log/journal in the base.
d /var/log/libvirt      0755 root root -
d /var/lib/libvirt/qemu 0755 qemu qemu -
d /var/cache/libvirt    0755 root root -
d /var/lib/libvirt/boot 0755 root root -
