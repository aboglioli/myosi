# virt feature — default user group bindings.
#
# Single source of truth for both the profile-baked-in-base build
# AND the standalone virt sysext build: the sysext's mkosi.conf
# carries `ExtraTrees=../../mkosi.profiles/virt/mkosi.extra:/`,
# pulling this file into the sysext payload too. Do NOT duplicate
# under mkosi.images/virt/mkosi.extra/.
#
# Consumed by /usr/libexec/myosi/homed-bind-sysext-groups (run from
# systemd-homed.service ExecStartPost on first boot + from
# refresh_sysext() on every live `systemd-sysext refresh`). The
# libvirt group itself is created by Fedora's libvirt-daemon
# sysusers.d shipped in the virt feature's package set.

libvirt
