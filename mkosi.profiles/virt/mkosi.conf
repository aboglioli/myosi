# Virt profile — qemu + libvirt + spice + swtpm.
# Single source of truth: sysext wrapper (mkosi.images/virt), main image
# via --profile=virt, and mybox as a bake.

[Content]
Packages=qemu-kvm
        qemu-system-x86
        qemu-system-x86-core
        qemu-img
        qemu-char-spice
        qemu-device-display-virtio-gpu
        qemu-device-display-virtio-vga
        qemu-device-usb-host
        qemu-block-curl
        edk2-ovmf
        libvirt-daemon
        libvirt-daemon-driver-qemu
        libvirt-daemon-driver-network
        libvirt-daemon-driver-storage-core
        libvirt-daemon-driver-storage-disk
        libvirt-daemon-driver-storage-iscsi
        libvirt-daemon-driver-storage-logical
        libvirt-daemon-driver-nwfilter
        libvirt-daemon-driver-interface
        libvirt-daemon-config-network
        libvirt-client
        virt-install
        # virt-manager + virt-viewer come from Flathub, not here.
        swtpm
        swtpm-tools
        virtiofsd
        spice-server
        spice-protocol
        genisoimage
        lxc
        lxcfs
