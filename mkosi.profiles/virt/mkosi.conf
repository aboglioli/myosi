# Virt profile — qemu + libvirt + spice + swtpm.
#
# Single source of truth for the "virt" feature. Consumed by:
#   - mkosi.images/virt/mkosi.conf          (sysext wrapper)
#   - mybox nspawn DDI consumes this profile AT RUNTIME via the
#     virt_<VER>.raw sysext dropped into the container's
#     /var/lib/extensions/ — NOT baked into mybox at build time
#   - main image via `mkosi --profile=virt build`

[Content]
Packages=qemu-kvm
        qemu-system-x86
        qemu-system-x86-core
        qemu-img
        qemu-char-spice
        qemu-device-display-virtio-gpu
        qemu-device-display-virtio-vga
        qemu-device-usb-host
        qemu-block-curl
        edk2-ovmf
        libvirt-daemon
        libvirt-daemon-driver-qemu
        libvirt-daemon-driver-network
        libvirt-daemon-driver-storage-core
        libvirt-daemon-driver-storage-disk
        libvirt-daemon-driver-storage-iscsi
        libvirt-daemon-driver-storage-logical
        libvirt-daemon-driver-nwfilter
        libvirt-daemon-driver-interface
        libvirt-daemon-config-network
        libvirt-client
        virt-install
        # virt-manager + virt-viewer dropped: shipped via Flathub
        # (org.virt_manager.virt-manager + org.libvirt.virt-viewer).
        # GUI virt management is a per-user concern that benefits from
        # the flatpak sandbox + atomic per-user upgrades; the system
        # only needs the libvirtd + qemu stack below.
        swtpm
        swtpm-tools
        virtiofsd
        spice-server
        spice-protocol
        genisoimage
        lxc
        lxcfs
