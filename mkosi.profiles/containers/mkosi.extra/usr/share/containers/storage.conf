# myosi container storage configuration.
#
# Ships via the containers profile (mkosi.profiles/containers/mkosi.extra/
# usr/share/containers/storage.conf) — NOT from the base image. Active
# only when the containers profile is BAKED into main OR the containers
# sysext is merged. Base-image-only hosts have no podman → no need for
# storage.conf either.
#
# Effective path at runtime: /usr/share/containers/storage.conf — the
# VENDOR tier of the containers-storage.conf(5) search path. /usr is
# sealed in the erofs root, so this file cannot be modified at runtime;
# operator override via /etc/containers/storage.conf still works (and
# lands on the writable overlay), but the default behaviour is locked
# in the image.
#
# Why we ship our own vendor file instead of dropping at /etc:
#   1. Static / immutable by default — matches the bootc model.
#   2. No /etc/containers/storage.conf needed in the image at all.
#   3. systemd-sysupdate-delivered image upgrades replace this file
#      atomically along with the rest of /usr.
#
# Trade-off: Fedora's containers-common package's
# /usr/share/containers/storage.conf is REPLACED by this file (mkosi
# applies mkosi.extra/ AFTER dnf install). Future containers-common
# updates won't propagate their vendor-default changes automatically
# — we must merge them into this file at next image bump.
#
# CONTENT below: Fedora vendor defaults from containers-common
# 5.x ([storage], [storage.options], [storage.options.overlay])
# PLUS our additions:
#   * rootless_storage_path     → per-user storage outside the homed
#                                 LUKS-encrypted home (avoid the
#                                 EOVERFLOW on lchown caused by
#                                 homed's idmapped mount mapping
#                                 only the user's stable UID; podman
#                                 subuid 100000+ has no translation).
#                                 $UID is expanded by podman at
#                                 runtime.
#
# graphroot/runroot are intentionally NOT set: their would-be values are
# already podman's compiled-in defaults (rootful → /var/lib/containers/
# storage + /run/containers/storage), so pinning them changes nothing
# for rootful — while an explicit graphroot can, on some podman versions,
# OVERRIDE rootless_storage_path ("using graphroot only, rootless_storage
# _path deprecated") and send rootless storage into the root-owned tree.
# Omitting them keeps rootful on the same paths and lets rootless honour
# rootless_storage_path unconditionally.

[storage]
driver = "overlay"
rootless_storage_path = "/var/lib/containers/users/$UID"

[storage.options]
additionalimagestores = [
    "/usr/lib/containers/storage",
]

[storage.options.pull_options]
# Symmetric with [engine] compression_format = "zstd:chunked" in
# containers.conf.d/50-myosi.conf. enable_partial_images lets podman
# pull zstd:chunked-formatted layers from the registry incrementally
# (skip blocks already cached locally) — significant bandwidth + time
# saving on image updates where only a few layers changed.
# Requires registry-side zstd:chunked support; falls back to full pull
# when not available. Safe everywhere.
enable_partial_images = "true"

[storage.options.overlay]
mountopt = "nodev,metacopy=on"
