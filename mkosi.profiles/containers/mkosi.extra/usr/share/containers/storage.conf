# myosi vendor-tier storage.conf — REPLACES containers-common's copy
# (mkosi.extra applies after dnf install); merge upstream changes at
# image bumps. Override via /etc/containers/storage.conf still works.
#
# Upstream defaults kept for root. Only rootless users move off $HOME:
# homed's idmapped mount maps just the stable UID, so subuid (100000+)
# writes get EOVERFLOW on lchown inside the LUKS home.
#
# graphroot and rootless_storage_path coexist — c/storage builds the
# rootless options in a fresh struct and never copies graphroot in
# (measured, podman 5.8.4). Do NOT drop graphroot to "let rootless win":
# root then falls through to rootless_storage_path as well and lands in
# users/0, orphaning whatever is in the real graphroot.

[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
rootless_storage_path = "/var/lib/containers/users/$UID"

[storage.options]
# Root-only: c/storage discards [storage.options] when building rootless
# options. Empty skeleton in the image today; seeded base layers land here.
additionalimagestores = [
    "/usr/lib/containers/storage",
]

[storage.options.pull_options]
# The one section that does reach rootless. Pairs with [engine]
# compression_format = "zstd:chunked" in containers.conf.d/50-myosi.conf;
# falls back to a full pull when the registry lacks zstd:chunked.
enable_partial_images = "true"

[storage.options.overlay]
# metacopy=on forces Native Overlay Diff off, so every build/commit/push
# computes layer diffs by walking the tree. Building is the rootful
# workload here, so keep upstream's plain "nodev".
mountopt = "nodev"
