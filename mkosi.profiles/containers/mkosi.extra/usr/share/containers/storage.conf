# myosi vendor-tier storage.conf — REPLACES containers-common's copy
# (mkosi.extra applies after dnf install); merge upstream changes at
# image bumps. Override via /etc/containers/storage.conf still works.
# rootless_storage_path keeps per-user storage outside the homed LUKS
# home (idmapped mount maps only the stable UID → subuid lchown EOVERFLOW).
# graphroot/runroot unset: explicit graphroot can override rootless path.

[storage]
driver = "overlay"
rootless_storage_path = "/var/lib/containers/users/$UID"

[storage.options]
additionalimagestores = [
    "/usr/lib/containers/storage",
]

[storage.options.pull_options]
# Pairs with [engine] compression_format = "zstd:chunked" in
# containers.conf.d/50-myosi.conf; falls back to full pull when the
# registry lacks zstd:chunked support.
enable_partial_images = "true"

[storage.options.overlay]
mountopt = "nodev,metacopy=on"
