[containers]
log_driver = "journald"
# catatonit as PID 1 (podman auto-skips for systemd images). Images with
# a non-systemd init (s6-overlay, tini, runit) need --init=false to opt out.
init = true
default_sysctls = [
  "net.ipv4.ping_group_range=0 0",
]

[engine]
runtime = "crun"
database_backend = "sqlite"
compression_format = "zstd:chunked"
events_logger = "journald"

[network]
default_rootless_network_cmd = "pasta"
# Explicit netavark — stale /etc/cni/net.d/ entries on upgraded hosts
# can otherwise trip the auto-detect into CNI fallback.
network_backend = "netavark"
