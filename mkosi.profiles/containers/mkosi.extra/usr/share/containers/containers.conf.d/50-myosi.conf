[containers]
log_driver = "journald"
# Inject catatonit (/usr/libexec/podman/catatonit) as PID 1 in every
# container that doesn't already ship its own init. Reaps zombies +
# forwards signals (SIGTERM, SIGINT) correctly. Podman auto-detects
# systemd/system-container images (CMD ending in /sbin/init,
# /usr/lib/systemd/systemd, etc.) and SKIPS catatonit injection there
# so they keep their own systemd as PID 1.
#
# Edge case: images that ship a NON-systemd init (s6-overlay,
# tini, dumb-init, runit) — like LinuxServer.io's arr stack —
# need PodmanArgs=--init=false in their .container quadlet to opt out.
init = true
default_sysctls = [
  "net.ipv4.ping_group_range=0 0",
]

[engine]
runtime = "crun"
database_backend = "sqlite"
compression_format = "zstd:chunked"
events_logger = "journald"

[network]
default_rootless_network_cmd = "pasta"
# Explicit netavark backend. It's the auto-detected default in
# podman 5+, but setting it here defends against accidental CNI
# fallback on upgraded hosts where stale /etc/cni/net.d/ entries
# might confuse the auto-detect. Pairs with pasta for rootless.
network_backend = "netavark"
