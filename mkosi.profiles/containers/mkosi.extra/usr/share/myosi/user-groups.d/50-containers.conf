# containers feature — default user group bindings.
#
# Single source of truth for both the profile-baked-in-base build
# AND the standalone containers sysext build: the sysext's
# mkosi.conf carries
# `ExtraTrees=../../mkosi.profiles/containers/mkosi.extra:/`,
# pulling this file into the sysext payload too. Do NOT duplicate
# under mkosi.images/containers/mkosi.extra/.
#
# Consumed by /usr/libexec/myosi/homed-bind-sysext-groups. The
# incus-admin group itself is created by Fedora's incus sysusers.d
# shipped in the containers feature's package set.

incus-admin
