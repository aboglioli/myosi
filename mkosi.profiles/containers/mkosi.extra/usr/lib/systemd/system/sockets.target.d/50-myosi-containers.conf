# sockets.target drop-in for the containers profile.
#
# Upholds= ensures the listed units are RUNNING whenever sockets.target
# is active — stronger than a static `.wants/` symlink. The wants pattern
# only pulls units in at target activation; Upholds re-evaluates on
# every `systemctl daemon-reload`, so when this drop-in arrives via a
# runtime sysext refresh (sysupdate-delivered swap, `systemd-sysext
# refresh`), systemd notices the new Upholds= line on the already-active
# sockets.target and auto-starts the listed sockets without needing a
# target restart or full reboot.
#
# Same artifact covers both delivery modes (profile baked into main
# image AND sysext-merged at runtime).
#
# Both daemons use socket activation: the kernel queues the socket
# from boot, first client request spawns the service, daemon idles
# back out. No need to Upholds= the daemon unit itself — the socket
# is the activation trigger.
[Unit]
Upholds=podman.socket incus.socket
