# sockets.target drop-in for the containers profile.
# Upholds= (not .wants/) re-evaluates on daemon-reload, so a runtime
# sysext refresh auto-starts these sockets without a reboot. Sockets
# only — the daemons are socket-activated.
#
# netavark-dhcp-proxy.socket is what hands a DHCP lease to a macvlan or
# ipvlan container, i.e. any container that is meant to be its own host
# on the LAN. Without it netavark fails the container start with
#
#   netavark: unable to obtain lease: socket "/run/podman/nv-proxy.sock":
#             No such file or directory, is the netavark-dhcp-proxy.socket
#             unit enabled?
#
# It was previously left to a manual `systemctl enable` on each host,
# which put the only record of it in that host's /etc overlay upper:
# undeclared, absent from a fresh install, and silently lost by an /etc
# factory reset. Declaring it here makes it reproducible like the others.
[Unit]
Upholds=podman.socket incus.socket netavark-dhcp-proxy.socket
