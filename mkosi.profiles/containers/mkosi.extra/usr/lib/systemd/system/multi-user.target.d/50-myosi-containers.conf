# multi-user.target drop-in for the containers profile.
#
# incus-startup.service is the unit that brings up containers/VMs
# marked `boot.autostart=true` (and runs `incus admin shutdown` on
# host shutdown to stop them gracefully). It's a Type=oneshot wrapper
# around incus admin commands — needs the incus daemon available,
# which socket activation (Upholds=incus.socket in sockets.target.d/)
# provides.
#
# Upholding it on multi-user.target (instead of static .wants/) means
# the unit auto-starts when this drop-in arrives via a runtime sysext
# refresh — important for the containers-as-sysext delivery path. The
# main image baked path also picks it up at boot.
#
# No equivalent for podman: rootless podman containers are managed
# per-user via quadlets + linger; no system-wide "startup" service.
[Unit]
Upholds=incus-startup.service
