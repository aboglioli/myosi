# User-scope sockets.target drop-in for the containers profile.
# Mirrors the system-scope drop-in for rootless podman: ensures the
# user's podman.socket is running so the rootless API is reachable
# at $XDG_RUNTIME_DIR/podman/podman.sock without an explicit
# `systemctl --user start podman.socket`.
[Unit]
Upholds=podman.socket
