# Containers profile — podman + distrobox + skopeo + incus.
#
# Single source of truth for the "containers" feature. Consumed by:
#   - mkosi.images/containers/mkosi.conf    (sysext wrapper)
#   - mybox nspawn DDI consumes this profile AT RUNTIME via the
#     containers_<VER>.raw sysext dropped into the container's
#     /var/lib/extensions/ — NOT baked into mybox at build time
#   - main image via `mkosi --profile=containers build` (bake into base)
#
# Activate by passing `--profile=containers` on the mkosi CLI, OR by
# setting `Profiles=containers` in `mkosi.local.conf` (per host).

[Content]
# podman-compose dropped: deprecated upstream — `podman compose` is
# built into podman 5+ and reads docker-compose.yml directly via the
# bundled compose subcommand.
Packages=podman
        distrobox
        skopeo
        incus
        incus-tools
