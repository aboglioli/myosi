# Fedora's pipewire-jack-audio-connection-kit ships libjack.so.0 + libjackserver.so.0
# + libjacknet.so.0 under /usr/lib64/pipewire-0.3/jack/ to avoid colliding with the
# legacy jack-audio-connection-kit package. The RPM normally drops the
# corresponding ld.so.conf.d entry under /etc/, but sysexts only ship /usr/ —
# /etc/ stays empty so waybar (and any other JACK client) fails at runtime with
# "libjack.so.0: cannot open shared object file: No such file or directory".
#
# Verified failure: waybar refused to start under niri on the 2026.06.07.04
# image; immediate symptom was no top bar in the compositor.
#
# Drop our own conf in /usr/lib/ld.so.conf.d/ — the dynamic linker reads
# both /etc/ld.so.conf.d/ and /usr/lib/ld.so.conf.d/, and the latter is
# shippable via sysext. refresh_sysext() must run ldconfig after merging
# this sysext for the cache to pick up the new search dir without reboot.
/usr/lib64/pipewire-0.3/jack
