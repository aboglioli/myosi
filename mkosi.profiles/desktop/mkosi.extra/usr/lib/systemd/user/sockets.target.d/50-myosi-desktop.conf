# User-scope sockets.target drop-in for the desktop profile.
#
# Fedora's pipewire/gnome-keyring units rely on
# /usr/lib/systemd/user-preset/90-default-user.preset for enablement,
# but nothing in myosi runs `systemctl --user preset-all` per user.
# Without this Upholds= drop-in, fresh users boot with pipewire +
# gnome-keyring disabled → silent audio, no SSH key agent. The
# drop-in survives sysext strip (lives under /usr) and applies to
# every user session.
[Unit]
Upholds=pipewire.socket pipewire-pulse.socket gnome-keyring-daemon.socket
