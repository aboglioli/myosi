# multi-user.target drop-in for the desktop profile.
#
# Two verbs on purpose:
#
#   Upholds= — power-profiles-daemon.service is Type=dbus and stays active
#     for the whole boot, so "keep it up" is meaningful: it comes back if it
#     crashes or is stopped.
#
#   Wants=  — flatpak-setup.service is gated by
#     ConditionPathExists=!/var/lib/myosi/.marks/flatpak-setup.done. Once the
#     marker exists every start is condition-SKIPPED, and a skipped start
#     leaves the unit inactive, so Upholds= retried it forever (~29k skips in
#     4.8 h). RemainAfterExit=yes does not help — it only applies to a start
#     that actually ran.
#
# Rule: Upholds= only for units that stay active once started. Anything that
# can end up inactive — oneshots without RemainAfterExit, or any Condition*=
# that can fail — gets Wants=.
[Unit]
Upholds=power-profiles-daemon.service
Wants=flatpak-setup.service
