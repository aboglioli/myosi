# multi-user.target drop-in for the desktop profile.
# Rule: Upholds= only for units that stay active once started; anything
# that can end up inactive (condition-gated like flatpak-setup, or
# oneshots without RemainAfterExit) gets Wants= — Upholds= busy-loops
# retrying a condition-skipped unit (~29k starts in 4.8 h).
[Unit]
Upholds=power-profiles-daemon.service
Wants=flatpak-setup.service
