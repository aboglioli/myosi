# Theme + Wayland-native rendering hints for desktop sysext.
# Lifted from myos/system/etc/environment.d/50-myos-theme.conf and
# parked at /usr/lib/environment.d so it ships in the sealed sysext
# instead of needing a writable-/etc copy on every host.
#
# systemd's user environment-generator reads /usr/lib/environment.d/
# at user-session start (via systemd --user), so every login user
# picks these up automatically — no per-user shell init, no
# ~/.config/environment.d duplication.

# GTK apps render in dark Adwaita by default. Override per-app via
# the standard GTK_THEME env in a wrapper if needed.
GTK_THEME=Adwaita-dark

# Qt apps pick up the GTK/portal theme via xdg-desktop-portal-gnome
# (already in desktop packages) so KDE-style and Qt-style apps match
# the rest of the session.
QT_QPA_PLATFORMTHEME=xdgdesktopportal

# Qt platform: prefer wayland, fall back to xcb. The semicolon-
# separated list is the Qt convention.
QT_QPA_PLATFORM=wayland;xcb

# Qt's default Wayland behaviour is to draw its own client-side
# decorations (window border + title bar). Niri tiles windows full-
# size in their column, so the Qt-drawn bar is visual noise. This
# disables it; combined with `prefer-no-csd` in niri's config the
# decoration is gone in both clients-that-listen and clients-that-
# need-the-env-var.
QT_WAYLAND_DISABLE_WINDOWDECORATION=1

# Electron / Chrome / VSCode / Discord / Slack: opt into Wayland
# automatically when the session is Wayland. Without this they boot
# on XWayland by default, which means they ignore niri's xdg-
# decoration prefer-no-csd request and draw their own CSD. "auto"
# lets the app probe XDG_SESSION_TYPE and pick correctly.
ELECTRON_OZONE_PLATFORM_HINT=auto
