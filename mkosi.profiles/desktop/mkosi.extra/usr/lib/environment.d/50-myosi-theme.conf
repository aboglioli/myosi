# Theme + Wayland-native rendering hints for the desktop sysext.
# Shipped in /usr/lib/environment.d (sealed sysext, no /etc copy);
# systemd's user environment-generator applies it to every login user.

GTK_THEME=Adwaita-dark

QT_QPA_PLATFORMTHEME=xdgdesktopportal

QT_QPA_PLATFORM=wayland;xcb

# Qt draws its own CSD on Wayland by default — visual noise under niri's
# tiling; pairs with prefer-no-csd in niri config.
QT_WAYLAND_DISABLE_WINDOWDECORATION=1

# Electron apps otherwise default to XWayland and ignore prefer-no-csd.
ELECTRON_OZONE_PLATFORM_HINT=auto
