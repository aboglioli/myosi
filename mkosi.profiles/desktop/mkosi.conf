# Desktop profile — Niri Wayland compositor + Pipewire + Flatpak.
# Lists no font packages: fonts are a user concern, installed into
# ~/.local/share/fonts by `myenv install-fonts` (bundles/fonts.list);
# fontconfig lives in the base profile so those resolve. Adwaita and
# open-sans still land here as GTK dependencies — that is the fallback
# until the user installs their own, not an oversight.
# Single source of truth: sysext wrapper (mkosi.images/desktop) and main
# image via --profile=desktop.
# ghostty is the only COPR package; its repo is a build-only sandbox tree
# (mkosi.images/desktop/mkosi.sandbox/etc/yum.repos.d/) — never deployed.

[Content]
Packages=dnf5
        dnf5-plugins
        niri
        foot
        ghostty
        xwayland-satellite
        waybar
        fuzzel
        dunst
        swaylock
        xdg-desktop-portal
        xdg-desktop-portal-gnome
        xorg-x11-server-Xwayland
        mesa-dri-drivers
        mesa-vulkan-drivers
        vulkan-loader
        # Intel iGPU VAAPI decode (now in Fedora main, no RPMFusion) +
        # GPU/Vulkan diagnostics (vainfo, intel_gpu_top, vulkaninfo).
        libva-intel-media-driver
        libva-utils
        igt-gpu-tools
        vulkan-tools
        libxkbcommon
        pipewire
        pipewire-alsa
        pipewire-jack-audio-connection-kit
        pipewire-pulseaudio
        wireplumber
        # Audio debug CLIs (pactl, aplay, amixer) — ~1 MB total.
        pulseaudio-utils
        alsa-utils
        grim
        slurp
        wl-clipboard
        brightnessctl
        bluez
        blueman
        gnome-keyring
        polkit
        power-profiles-daemon
        network-manager-applet
        ffmpeg
        flatpak
        # Primary browser. qt6-qtwebengine + python3-pyqt6-webengine
        # arrive as hard deps; both link the SYSTEM libavcodec, so
        # H.264/AAC playback depends entirely on the RPM Fusion ffmpeg
        # swap in mkosi.postinst — Fedora's ffmpeg-free has the h264 and
        # hevc decoders configured out.
        # ~440 MB installed, 291 MB of it qt6-qtwebengine: by far the
        # largest single line in this file. That is the price of a
        # host-integrated browser instead of a flatpak; Chrome stays a
        # flatpak as the compatibility escape hatch.
        qutebrowser
        # Qt's Wayland platform plugin is a WEAK dep of qt6-qtbase and
        # mkosi.sandbox/etc/dnf/dnf.conf sets install_weak_deps=False, so
        # without this line every Qt app silently falls back to XWayland
        # despite QT_QPA_PLATFORM=wayland;xcb in 50-myosi-theme.conf.
        qt6-qtwayland

# dnf5 + dnf5-plugins: build-time only for the postinst ffmpeg swap;
# stripped from the sealed sysext by strip_buildroot_dnf.
