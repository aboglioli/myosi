# Desktop profile — Niri Wayland compositor + Pipewire + Flatpak + fonts.
#
# Single source of truth for the "desktop" feature. Consumed by:
#   - mkosi.images/desktop/mkosi.conf       (sysext wrapper)
#   - mybox nspawn DDI consumes this profile AT RUNTIME via the
#     desktop_<VER>.raw sysext dropped into the container's
#     /var/lib/extensions/ — NOT baked into mybox at build time
#   - main image via `mkosi --profile=desktop build`
#
# COPR for ghostty lives in
#   mkosi.images/desktop/mkosi.sandbox/etc/yum.repos.d/copr-scottames-ghostty.repo
# as a sandbox tree (build-time only — never lands in deployed
# /etc/yum.repos.d/). niri (25.11+) and xwayland-satellite (0.8.1+)
# shipped into Fedora F44 main during the release cycle, so only
# ghostty remains COPR-only.

[Content]
Packages=dnf5
        dnf5-plugins
        niri
        foot
        ghostty
        xwayland-satellite
        waybar
        fuzzel
        dunst
        swaylock
        xdg-desktop-portal
        xdg-desktop-portal-gnome
        xorg-x11-server-Xwayland
        mesa-dri-drivers
        mesa-vulkan-drivers
        vulkan-loader
        # VAAPI hardware decode for Intel iGPU (Gen 8+). Fedora 44 now
        # ships its own `libva-intel-media-driver` in the main updates
        # repo (previously the only source was RPMFusion-free under the
        # `intel-media-driver` name). libva-utils ships `vainfo`.
        libva-intel-media-driver
        libva-utils
        # Live GPU utilization monitor (`intel_gpu_top`) + GPU profiling.
        # Same package ships intel_gpu_frequency / intel_gpu_time.
        igt-gpu-tools
        # Vulkan diagnostics CLI: `vulkaninfo`, `vkcube`. Made the
        # niri-stuck investigation on externy 20x faster; keep the
        # debug surface in the same profile that ships the GL/EGL stack.
        vulkan-tools
        libxkbcommon
        pipewire
        pipewire-alsa
        pipewire-jack-audio-connection-kit
        pipewire-pulseaudio
        wireplumber
        # Diagnostic CLIs for audio. pulseaudio-utils -> pactl, alsa-utils
        # -> aplay, amixer, alsamixer. ~1 MB total, makes "no audio"
        # debugging viable without flatpak pavucontrol.
        pulseaudio-utils
        alsa-utils
        grim
        slurp
        wl-clipboard
        brightnessctl
        bluez
        blueman
        gnome-keyring
        polkit
        power-profiles-daemon
        network-manager-applet
        ffmpeg
        fira-code-fonts
        jetbrains-mono-fonts
        google-noto-emoji-fonts
        flatpak

# dnf5 + dnf5-plugins are needed at build time by the sysext wrapper's
# postinst for the `--allowerasing ffmpeg` swap. Stripped from sealed
# sysext payload by strip_buildroot_dnf, invoked from sysext_finalize.
