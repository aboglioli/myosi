# Desktop profile — Niri Wayland compositor + Pipewire + Flatpak + fonts.
# Single source of truth: sysext wrapper (mkosi.images/desktop), main image
# via --profile=desktop, and mybox at runtime as desktop_<VER>.raw sysext.
# ghostty is the only COPR package; its repo is a build-only sandbox tree
# (mkosi.images/desktop/mkosi.sandbox/etc/yum.repos.d/) — never deployed.

[Content]
Packages=dnf5
        dnf5-plugins
        niri
        foot
        ghostty
        xwayland-satellite
        waybar
        fuzzel
        dunst
        swaylock
        xdg-desktop-portal
        xdg-desktop-portal-gnome
        xorg-x11-server-Xwayland
        mesa-dri-drivers
        mesa-vulkan-drivers
        vulkan-loader
        # Intel iGPU VAAPI decode (now in Fedora main, no RPMFusion) +
        # GPU/Vulkan diagnostics (vainfo, intel_gpu_top, vulkaninfo).
        libva-intel-media-driver
        libva-utils
        igt-gpu-tools
        vulkan-tools
        libxkbcommon
        pipewire
        pipewire-alsa
        pipewire-jack-audio-connection-kit
        pipewire-pulseaudio
        wireplumber
        # Audio debug CLIs (pactl, aplay, amixer) — ~1 MB total.
        pulseaudio-utils
        alsa-utils
        grim
        slurp
        wl-clipboard
        brightnessctl
        bluez
        blueman
        gnome-keyring
        polkit
        power-profiles-daemon
        network-manager-applet
        ffmpeg
        fira-code-fonts
        jetbrains-mono-fonts
        google-noto-emoji-fonts
        flatpak

# dnf5 + dnf5-plugins: build-time only for the postinst ffmpeg swap;
# stripped from the sealed sysext by strip_buildroot_dnf.
