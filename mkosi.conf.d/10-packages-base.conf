# Base package set. The starship COPR ships as a base-tree sandbox tree
# (build-time only, no repo leak into the image) — mkosi v26 rejects
# `Repositories=copr:...` in sub-image confs.

[Content]
Packages=systemd
        systemd-boot-unsigned
        # Ships nspawn + portablectl; portable services are the blessed
        # mechanism for self-contained service images (confext rejected).
        systemd-container
        systemd-pam
        systemd-resolved
        systemd-ukify
        shim-x64
        mokutil
        efibootmgr
        microcode_ctl
        amd-ucode-firmware
        # Firmware MUST live in base, not a sysext: the kernel loads
        # blobs at module probe time, long before sysext merge — GPU/
        # Wi-Fi/BT fail -ENOENT and stay dead for the whole boot.
        # Costs ~400 MB but the alternative is no GPU/Wi-Fi on modern hosts.
        linux-firmware
        intel-gpu-firmware
        amd-gpu-firmware
        nvidia-gpu-firmware
        iwlwifi-mvm-firmware
        iwlwifi-dvm-firmware
        iwlegacy-firmware
        atheros-firmware
        brcmfmac-firmware
        mt7xxx-firmware
        realtek-firmware
        kernel
        kernel-modules
        kernel-modules-extra
        kernel-modules-core
        btrfs-progs
        btrfsmaintenance
        compsize
        duperemove
        tar
        util-linux
        iproute
        iputils
        hostname
        e2fsprogs
        dosfstools
        cryptsetup
        veritysetup
        gdisk
        openssl
        keyutils
        tpm2-tools
        tpm2-tss
        # Must live in base: the RPM ships /etc/fonts/, sysext finalize
        # strips /etc, so desktop-sysext delivery loses the master config
        # ("Fontconfig error: Cannot load default config file" everywhere).
        # No font package is listed anywhere any more — fonts are a user
        # concern (~/.local/share/fonts, `myenv install-fonts`). The image
        # still carries whatever arrives as a DEPENDENCY: Cantarell and
        # Noto Sans here, Adwaita + open-sans via GTK in the desktop
        # sysext. That is the fallback a first login renders with, before
        # the user has installed anything — don't strip it believing the
        # image is already font-free.
        fontconfig
        selinux-policy-targeted
        policycoreutils
        libselinux-utils
        # SELinux policy modules for sysext-shipped binaries — baked into
        # base so sysext content is labeled correctly without sysext-side
        # semodule -i (races with merge; blocked on F44 standalone).
        # Without container-selinux, BPF prog_load silently EACCESes on
        # container scope creation.
        container-selinux
        flatpak-selinux
        incus-selinux
        passt-selinux
        swtpm-selinux
        NetworkManager
        NetworkManager-wifi
        firewalld
        openssh-server
        openssh-clients
        wireless-regdb
        iw
        sudo
        fish
        bash
        neovim
        tree-sitter-cli
        git
        git-delta
        gh
        just
        gnupg2
        pinentry-tty
        jq
        ripgrep
        fd-find
        fzf
        bat
        eza
        zoxide
        curl
        rsync
        # NFS client userspace — kernel modules exist but mount(8) needs
        # the mount.nfs helper. Server units ship disabled; no exposed
        # surface unless the operator starts them.
        nfs-utils
        unzip
        xz
        bzip2
        gzip
        zstd
        file
        findutils
        coreutils
        procps-ng
        libatomic
        glibc-langpack-en
        zram-generator-defaults
        # Shell prompt for every login, desktop or not (flatpak stays in
        # the desktop sysext).
        starship
