# COPR for starship lives in
#   mkosi.images/base-tree/mkosi.sandbox/etc/yum.repos.d/copr-atim-starship.repo
# as a per-sub-image sandbox tree. dnf5 reads it only when mkosi
# invokes the package manager for base-tree (build-time only — sandbox
# trees are not baked into the final image, so no repo files leak into
# the deployed /etc/yum.repos.d/).
#
# This replaces the old `Repositories=copr:atim/starship` line (which
# mkosi v26 rejects in sub-image confs and which cascaded into the
# tools image, blowing up its dnf invocation).

[Content]
Packages=systemd
        systemd-boot-unsigned
        # systemd-container ships BOTH systemd-nspawn AND portablectl on
        # Fedora 44 (verified: rpm -qf /usr/bin/portablectl =
        # systemd-container). The portabled daemon ships in systemd-udev
        # (also already part of the base via systemd's hard deps).
        # Portable services are the myosi-blessed mechanism for shipping
        # self-contained service images with their own /etc namespace —
        # confext is rejected (single /var/etc upperdir invariant; see
        # README "No confext" section). Image gets mounted under
        # /run/portables/<name>/, its units land in
        # /etc/systemd/system.attached/ via portablectl attach.
        systemd-container
        systemd-pam
        systemd-resolved
        systemd-ukify
        shim-x64
        mokutil
        efibootmgr
        microcode_ctl
        amd-ucode-firmware
        # GPU + Wi-Fi + Bluetooth firmware MUST live in the base image,
        # not in a sysext. The kernel loads firmware blobs at module
        # probe time (boot+~6 s for i915 / iwlwifi / bt-intel on a
        # modern Raptor Lake laptop); systemd-sysext.service can't
        # finish merging the sysext until sysinit.target (boot+~23 s).
        # By the time the firmware sysext lands in /usr/lib/firmware/,
        # i915/iwlwifi/bt have already failed -ENOENT and either
        # declared the GPU "wedged" or shut down the radio. Verified
        # failure on the externy host (Intel Raptor Lake-S UHD 770 +
        # Intel AX211 + Intel BT). niri died with "Kernel is too old or
        # unusable for Iris" because i915 was wedged; nmcli couldn't see
        # the Wi-Fi card at all. Pre-firmware-sysext-merge devices are
        # gone for the lifetime of the boot.
        #
        # The cost is ~400 MB on the base .raw.zst that no operator can
        # opt out of, but the alternative is "every host with hardware
        # newer than 2018 silently boots with no GPU and no Wi-Fi", so
        # this is the right place. The mkosi.images/firmware/ sub-image
        # is correspondingly deleted.
        linux-firmware
        intel-gpu-firmware
        amd-gpu-firmware
        nvidia-gpu-firmware
        iwlwifi-mvm-firmware
        iwlwifi-dvm-firmware
        iwlegacy-firmware
        atheros-firmware
        brcmfmac-firmware
        mt7xxx-firmware
        realtek-firmware
        kernel
        kernel-modules
        kernel-modules-extra
        kernel-modules-core
        btrfs-progs
        compsize
        duperemove
        tar
        util-linux
        iproute
        iputils
        hostname
        e2fsprogs
        dosfstools
        cryptsetup
        veritysetup
        gdisk
        openssl
        keyutils
        tpm2-tools
        tpm2-tss
        # fontconfig MUST live in base, not in the desktop sysext.
        # The Fedora RPM ships /etc/fonts/fonts.conf and the
        # /etc/fonts/conf.d/ symlinks alongside /usr/share/fontconfig/
        # conf.avail/. Sysext finalize strips /etc, so when fontconfig
        # landed in the desktop sysext (transitively pulled by gtk, etc.)
        # the master config went missing on the deployed host. Every
        # userspace app then warned
        #   Fontconfig error: Cannot load default config file
        # on startup and fell back to built-in defaults — verified on
        # externy 2026-06-08. Putting fontconfig in base lands
        # /etc/fonts/ at /usr/share/factory/etc which becomes the /etc overlay
        # lowerdir at boot. ~1 MiB cost; pulled in transitively by gtk
        # in the desktop sysext anyway, so net base+desktop size is
        # unchanged (path-dedup strips the duplicate from the sysext).
        fontconfig
        selinux-policy-targeted
        policycoreutils
        libselinux-utils
        # SELinux policy modules for optional sysext-shipped binaries.
        # Each *-selinux RPM is small (tens of KB of CIL/.pp.bz2 — pure
        # policy text, no daemon code). Baking them into base policy at
        # compile time means sysexts ship binaries that get correctly
        # labeled at runtime without any sysext-side semodule -i (which
        # races with sysext merge and is blocked on F44 by the
        # typealiasactual gap when loaded standalone).
        #
        # Empirically: without container-selinux in base, systemd's
        # cgroup-device BPF prog_load returns EACCES on container scope
        # creation (silently — bpf_token_perms=0 policy capability
        # suppresses AVC). Fedora bootc / CoreOS reference confirms this
        # is the standard pattern; lockdown=integrity is unrelated to the
        # BPF block.
        container-selinux
        flatpak-selinux
        incus-selinux
        passt-selinux
        swtpm-selinux
        NetworkManager
        NetworkManager-wifi
        firewalld
        openssh-server
        openssh-clients
        wireless-regdb
        iw
        sudo
        fish
        bash
        neovim
        tree-sitter-cli
        git
        git-delta
        gh
        just
        gnupg2
        pinentry-tty
        jq
        ripgrep
        fd-find
        fzf
        bat
        eza
        zoxide
        curl
        rsync
        # NFS client userspace: provides mount.nfs / mount.nfs4 (needed
        # by `mount -t nfs ...` and fstab entries with type=nfs), plus
        # showmount, nfsstat, nfsidmap and the rpc helpers. The kernel
        # already ships nfs / nfsv4 / sunrpc / lockd via kernel-modules-
        # extra, but without nfs-utils the userspace mount(8) hook fails
        # with "mount: /mnt/foo: bad option; for several filesystems
        # (e.g. nfs, cifs) you might need a /sbin/mount.<type> helper
        # program." nfs-utils covers both client AND server in one RPM
        # but server units (nfs-server.service, rpcbind.service) ship
        # masked / not-enabled — no exposed surface unless an operator
        # explicitly starts them and opens the firewall.
        nfs-utils
        unzip
        xz
        bzip2
        gzip
        zstd
        file
        findutils
        coreutils
        procps-ng
        libatomic
        glibc-langpack-en
        zram-generator-defaults
        # Parity with myos/profiles/core.sh — shell prompt used by
        # every login regardless of whether the host runs a desktop.
        # flatpak belongs in the desktop sysext (GUI app delivery),
        # not in base.
        starship
