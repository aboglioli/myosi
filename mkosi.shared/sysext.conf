# Shared defaults for all signed sysexts, symlinked into each sub-image
# as mkosi.conf.d/00-shared.conf; per-sysext mkosi.conf only sets ImageId.

[Output]
Format=sysext
Overlay=yes

[Content]
# base-tree dir is named <id>_<ver>_<arch>; %v/%a keep the cross-image
# reference in lockstep across arches.
BaseTrees=../../build/base-tree_%v_%a
# No SELinuxRelabel=yes: mkosi needs /etc/selinux/config, which
# /usr-only sysexts never have — the build aborts. Running setfiles
# ourselves in the rootless sandbox writes erofs xattrs with the wrong
# name_index, so everything surfaces unlabeled_t at runtime and PAM
# locks the operator out. Instead mkfs.erofs --file-contexts bakes
# correct security.selinux xattrs at creation time — wired via the
# Environment= line below; each postinst stages the policy via
# stage_sysext_policy (sysext-build.sh).

[Config]
Dependencies=base-tree

[Build]
# systemd-repart reads extra mkfs args from this env var; the absolute
# path is valid inside mkosi's sandbox at format time.
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS=--file-contexts=/buildroot/usr/share/myosi/file_contexts

[Validation]
# VerityKey/VerityCertificate cannot be declared in sub-image configs
# (mkosi v26 errors); sub-images inherit [Validation] from the
# top-level mkosi.conf.
Verity=signed
