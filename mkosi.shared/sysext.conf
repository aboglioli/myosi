# Shared defaults for all signed sysexts (desktop, firmware, virt, nvidia,
# nvidia-580xx). Symlinked into each sub-image as mkosi.conf.d/00-shared.conf.
# Per-sysext mkosi.conf only sets ImageId (and any rare overrides).

[Output]
Format=sysext
Overlay=yes

[Content]
# base-tree dir is named <id>_<ver>_<arch> (Output=%i_%v_%a in
# mkosi.images/base-tree/mkosi.conf). %a here resolves to the same
# arch as the consuming sysext build, so the cross-image reference
# stays in lockstep across x86-64 and arm64 builds.
BaseTrees=../../build/base-tree_%v_%a
# We deliberately do NOT use SELinuxRelabel=yes here. mkosi insists on
# reading /etc/selinux/config from the buildroot to pick a policy, but
# Format=sysext sub-images are /usr-only by definition and never have an
# /etc/selinux/config — the build aborts with
# "SELinux relabel is requested but could not find selinux config at
# /etc/selinux/config".
#
# Empirically, running setfiles ourselves inside the rootless mkosi
# postinst sandbox does write xattrs into the buildroot but they end up
# in the erofs with name_index=7 instead of name_index=6 (the kernel's
# EROFS_XATTR_INDEX_SECURITY). At runtime the kernel doesn't recognize
# them as security.selinux, every sysext-shipped file surfaces as
# unlabeled_t, and the first PAM helper that has to read /etc/shadow
# (sudo, sshd) gets denied — the operator gets "Access denied by PAM
# account configuration" and is locked out.
#
# mkfs.erofs DOES support --file-contexts=<path> directly — when used,
# it bakes correct security.selinux xattrs at erofs-creation time using
# the file_contexts policy, bypassing the userns-restricted setxattr
# path entirely. systemd-repart reads extra mkfs args from
# $SYSTEMD_REPART_MKFS_OPTIONS_EROFS, so we pass --file-contexts there
# via Environment= below. Each sysext postinst stages the policy from
# base-tree at a known buildroot path via stage_sysext_policy in
# mkosi.shared/sysext-build.sh.
#
# Note: dnf strip from sysext payloads is handled by strip_buildroot_dnf
# in mkosi.shared/sysext-build.sh, invoked from sysext_finalize. NOT via
# RemovePackages= here, because (1) dnf5 is in Fedora's protected
# packages list (/etc/dnf/protected.d/dnf5.conf — `dnf remove dnf5`
# refuses), and (2) mkosi v26 errors when RemovePackages= lists a
# package that wasn't installed. The helper uses rpm -e --nodeps
# --noscripts to bypass both limitations and tolerates missing pkgs.

[Config]
Dependencies=base-tree

[Build]
# mkfs.erofs --file-contexts is wired up via systemd-repart's
# $SYSTEMD_REPART_MKFS_OPTIONS_EROFS environment variable. mkosi's
# Environment= setting in [Build] flows through config.finalize_environment()
# into the env dict that mkosi.bootloader.run_systemd_sign_tool() passes to
# the systemd-repart subprocess. stage_sysext_policy stages base-tree's
# policy at /buildroot/usr/share/myosi/file_contexts so the absolute path
# here is valid inside mkosi's sandbox at format time.
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS=--file-contexts=/buildroot/usr/share/myosi/file_contexts

[Validation]
# VerityKey/VerityCertificate cannot be declared in sub-image configs
# (mkosi v26 errors: "Setting VerityKey cannot be configured in <X> image").
# Sub-images inherit [Validation] from the top-level mkosi.conf even when
# built standalone via `mkosi -C mkosi.images/<name> build` (mkosi walks
# parent dirs to discover the main image config).
Verity=signed
