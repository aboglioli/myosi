# Desktop sysext — thin wrapper.
#
# Content lives in mkosi.profiles/desktop/. This sub-image:
#   - Pulls the profile's Packages= via the conf.d/10-packages.conf
#     SYMLINK to ../../../mkosi.profiles/desktop/mkosi.conf
#   - Pulls the profile's mkosi.extra/ via the ExtraTrees= line below.
#   - Inherits sysext infra from mkosi.shared/sysext.conf
#   - Runs sysext-specific close-out in mkosi.postinst (ffmpeg swap,
#     COPR cleanup, finalize)

[Output]
ImageId=desktop
Output=%i_%v_%a

[Content]
ExtraTrees=../../mkosi.profiles/desktop/mkosi.extra:/
