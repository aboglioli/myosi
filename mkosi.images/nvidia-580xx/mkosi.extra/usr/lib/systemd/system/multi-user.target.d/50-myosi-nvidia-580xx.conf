# multi-user.target drop-in for the nvidia-580xx sysext (Pascal /
# Maxwell legacy proprietary driver).
#
# Same unit set as the nvidia sysext — only the kmod driver differs.
# Filename is per-branch so activating both sysexts doesn't collide on one
# target.d/ filename and silently shadow the other.
#
# Wants=, never Upholds= — nvidia-cdi-refresh.service is Type=oneshot with
# RemainAfterExit=no, so Upholds= restarts it forever. See the nvidia
# sysext's 50-myosi-nvidia.conf. Keep both branches in sync.
[Unit]
Wants=nvidia-cdi-refresh.service nvidia-cdi-refresh.path
