# Relax (not disable) the start-rate limit: sysext-modules-refresh
# rewrites modules.dep{,.bin}, so a normal boot fires the .path watcher
# past upstream's 5/10s and parks the idempotent service in `failed`.
# Never set StartLimitIntervalSec=0 — that removed the only brake on an
# Upholds= restart loop (27,380 starts in 4.8 h).
[Unit]
StartLimitIntervalSec=10s
StartLimitBurst=20
