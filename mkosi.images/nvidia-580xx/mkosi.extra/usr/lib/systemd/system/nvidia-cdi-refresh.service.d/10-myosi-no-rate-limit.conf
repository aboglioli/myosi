# Relax, but do not disable, the start-rate limit for
# nvidia-cdi-refresh.service (upstream: 5 starts / 10 s).
#
# Upstream's limit is too tight here: nvidia-cdi-refresh.path watches
# modules.dep, modules.dep.bin and /usr/bin/nvidia-ctk, and one
# sysext-modules-refresh run rewrites the first two — so a normal boot can
# legitimately fire the watcher more than five times in ten seconds and park
# the unit in `failed`. The service is idempotent and ~150 ms, so the extra
# runs are harmless.
#
# Keep the window bounded. This used to set StartLimitIntervalSec=0, which
# removed the only brake on an unrelated Upholds= restart loop and let it
# reach 27,380 starts unnoticed. 20/10 s clears the real burst ~4x while
# still tripping within seconds on a runaway, where `failed` makes it visible.
[Unit]
StartLimitIntervalSec=10s
StartLimitBurst=20
