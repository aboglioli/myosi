# Containers sysext — thin wrapper over mkosi.profiles/containers/.
# Packages= arrive via the conf.d/10-packages.conf symlink (sub-image
# Include=/Profiles= don't propagate profile content in mkosi v26; conf.d
# auto-loads), mkosi.extra via ExtraTrees= below, sysext infra via the
# conf.d/00-shared.conf symlink, close-out in mkosi.postinst.

[Output]
ImageId=containers
Output=%i_%v_%a

[Content]
ExtraTrees=../../mkosi.profiles/containers/mkosi.extra:/
