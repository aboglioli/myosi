# Containers sysext — thin wrapper.
#
# Content lives in mkosi.profiles/containers/. This sub-image:
#   - Pulls the profile's Packages= via the conf.d/10-packages.conf
#     SYMLINK to ../../../mkosi.profiles/containers/mkosi.conf
#     (sub-image's Include= and Profiles= don't propagate profile
#     content in mkosi v26, but conf.d/ auto-loads everything in it).
#   - Pulls the profile's mkosi.extra/ via the ExtraTrees= line below.
#   - Inherits sysext infra from mkosi.shared/sysext.conf (via the
#     conf.d/00-shared.conf symlink).
#   - Runs sysext-specific close-out in mkosi.postinst (finalize,
#     extension-release, target drop-ins for runtime preset enables).

[Output]
ImageId=containers
Output=%i_%v_%a

[Content]
ExtraTrees=../../mkosi.profiles/containers/mkosi.extra:/
