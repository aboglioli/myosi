# mybox — sealed verity-erofs nspawn DDI: the myosi userspace minus the
# boot stack (no kernel/initrd/UKI/bootloader/LUKS/TPM). nspawn dissects
# the GPT and verifies the signed verity roothash against the host's
# .platform keyring. Deploy to /var/lib/machines/mybox.raw + the
# containers/machines/mybox/mybox.nspawn config; `machinectl start mybox`.
#
# Bake set mirrors the reference host's mkosi.local.conf: containers +
# virt BAKED (conf.d/ symlinks + ExtraTrees= below), desktop consumed as
# a runtime sysext, NVIDIA host-CDI-bound (lib version must match host
# driver — neither bake nor sysext fits). Re-target by editing conf.d/
# symlinks manually: mkosi v26 sub-image confs can't Include= a matched
# profile.
#
# Rule: never drop a sysext for a baked profile into /var/lib/extensions/
# (containers_*.raw, virt_*.raw) — duplicates baked content. desktop OK.

[Output]
ImageId=mybox
# Explicit Output= — mkosi v26 defaults to the sub-image DIRECTORY name
# even when ImageId= is set.
Output=%i_%v_%a
Format=disk
# No SplitArtifacts=: nspawn dissects the full .raw itself, and sysupdate
# replaces the whole mybox.raw file — split copies waste ~3.1 GB/build.

[Content]
# base-tree output dir is <id>_<ver>_<arch>; %a keeps the cross-image
# reference in lockstep across x86-64/arm64 builds.
BaseTrees=../../build/base-tree_%v_%a
Bootable=no
UnifiedKernelImages=no
KernelInitrdModules=

# Main mkosi.extra/ is not in base-tree (would bloat every sysext via
# BaseTrees=), so pull it here explicitly, then layer the baked-profile
# extras in the same order as the conf.d/<NN>-bake-*.conf symlinks.
ExtraTrees=../../mkosi.extra:/
ExtraTrees=../../mkosi.profiles/containers/mkosi.extra:/
ExtraTrees=../../mkosi.profiles/virt/mkosi.extra:/

# Only what dnf dependency protection allows; grub2+shim+mokutil knot
# stays (~10-15 MB) — breaking it would need rpm -e --nodeps.
RemovePackages=kernel
        kernel-core
        kernel-modules
        kernel-modules-core
        dracut
        systemd-ukify
        sbsigntools
        cryptsetup
        tpm2-tools
        tpm2-tss

# Boot-stack files useless under a shared-kernel nspawn. /var/* wipe is
# safe: /var is shadowed at runtime by the data.raw bind. /etc cleanup is
# NOT here — RemoveFiles= runs before mkosi.finalize, which snapshots
# /etc → /usr/share/factory/etc; the snapshot + wipe live in finalize.
RemoveFiles=/var/*
        /usr/lib/systemd/system/sysroot-etc.mount
        /usr/lib/systemd/system/initrd-*.target
        /usr/lib/systemd/system/initrd-*.service
        /usr/lib/repart.d
        /usr/lib/modules
        /usr/lib/firmware
        /usr/lib/kernel
        /usr/lib/modprobe.d
        /usr/lib/modules-load.d
        /usr/lib/sysupdate.d
        /usr/lib/sysupdate.extensions.d
        /usr/local/bin/sysupdate
        /usr/share/myosi/keys
        /efi
        /boot

[Config]
Dependencies=base-tree

[Validation]
# Signing keys inherit from the top-level mkosi.crt/mkosi.key — mkosi v26
# rejects VerityKey/VerityCertificate in sub-image confs.
Verity=signed
