# mybox — sealed verity-erofs nspawn DDI for GUI + dev workloads.
#
# Phase 1 target of the nspawn container architecture: a myosi-style
# sealed image projected onto systemd-nspawn. Same userspace surface
# as a myosi boot host MINUS the boot stack (no kernel, no initrd,
# no UKI, no bootloader, no LUKS, no TPM). EVERY OTHER CAPABILITY is
# preserved so mybox doubles as a smoke-test ground for new myosi
# sysext releases on the host running it.
#
# mybox's bake set mirrors the HOST's mkosi.local.conf. The reference host
# runs:
#   Profiles=containers,virt        ← BAKED
#   Dependencies=desktop,nvidia     ← SYSEXT
# so mybox bakes containers + virt and consumes desktop as a sysext at
# runtime (same desktop_<VER>.raw the host uses). NVIDIA stays
# host-CDI-bound via containers/machines/_features/40-gpu-nvidia (lib
# version must match host driver — neither bake nor sysext fits).
#
# Auto-respect of mkosi.local.conf via [Match] Profiles= IS NOT
# implemented — mkosi v26 sub-image confs allow [Match] but not the
# Include= needed to load the matched profile's content (the conf.d/
# symlink is unconditional). For now operator edits conf.d/ symlinks
# manually when re-targeting mybox to a host with a different
# Profiles/Dependencies mix. Acceptable cost for the current 3-host
# fleet; revisit if mybox ships to more than ~5 hosts.
#
# Sysext extensibility KEPT — same delivery channel as bare-metal myosi:
#   - systemd-sysext.service stays enabled
#   - operator drops <name>_<ver>.raw into the container's
#     /var/lib/extensions/ (writable on the data.raw /var subvol),
#     reboots OR runs `systemd-sysext refresh` inside the container;
#     mybox's /usr inherits the union
#   - Useful for: desktop sysext (as configured today), zfs, future
#     custom add-ons, runtime testing of a new sysext version before
#     promoting it to a bake.
#
# Rule from bare-metal mkosi.local.conf.example line 136: a host that
# bakes a profile MUST NOT also install the matching sysext at
# runtime — would duplicate baked content. So do NOT drop
# containers_<VER>.raw or virt_<VER>.raw into mybox's
# /var/lib/extensions/. desktop_<VER>.raw IS expected there.
#
# What gets baked in mybox:
#   - mybox 10-packages.conf baseline CLI (vim, tmux, eza, bat, …)
#   - Full containers profile via 30-bake-containers.conf symlink
#   - Full virt profile via 40-bake-virt.conf symlink
#   - PAM-visible Wayland/PipeWire env vars + interactive-shell exports
#   - subuid/subgid for rootless nested podman
#
# What gets host-bound at runtime via _features/:
#   - NVIDIA libs + nvidia-smi (version-locked to host driver — see
#     containers/machines/_features/40-gpu-nvidia + the auto-generated
#     41-gpu-nvidia-libs.conf from `nspawn-gpu-nvidia-drop-in mybox`)
#
# kmod-bearing sysexts (nvidia*, zfs) caveat: .ko files land in
# /usr/lib/modules/ after merge but the host kernel ignores them
# (nspawn shares host kernel + host modules). The userspace shipped
# in the same sysext IS usable. For NVIDIA, prefer host CDI bind over
# the kmod sysext to keep driver/lib versions locked together.
#
# Output:
#   build/mybox_<ver>_<arch>.raw  — full DDI with verity (root + verity
#                                   + verity-sig partitions in one GPT)
#
# A single sealed .raw is all nspawn needs. No SplitArtifacts= here —
# see the [Output] block below for the rationale.
#
# Operator deploys the full .raw to /var/lib/machines/mybox.raw and
# starts via `machinectl start mybox`. nspawn dissects the GPT,
# finds the root + verity + verity-sig partitions by type GUID, and
# mounts the root with dm-verity using the embedded signature
# verified against the host's .platform keyring.
#
# Build:
#   mkosi --image=base-tree build           # required first
#   just build                              # builds everything including mybox
#
# Use:
#   sudo cp build/mybox_<VER>_<ARCH>.raw /var/lib/machines/mybox.raw
#   sudo install -D -m 0644 \
#     containers/machines/mybox/mybox.nspawn \
#     /etc/systemd/nspawn/mybox.nspawn
#   sudo systemctl daemon-reload
#   # provision /srv/machines/mybox/data.raw (see mybox.nspawn header)
#   sudo machinectl start mybox
#
# Architecture reference:
#   myosi/NSPAWN-CONTAINER-ARCHITECTURE.md — full design rationale
#   containers/machines/mybox/mybox.nspawn — runtime nspawn config
#   containers/machines/_features/         — opt-in GPU drop-ins
#
# What's stripped vs the boot image:
#   - kernel, kernel-core, kernel-modules — host kernel is used
#   - dracut, dracut-* — no initrd built inside container
#   - systemd-boot, systemd-boot-unsigned — no boot path
#   - systemd-ukify, sbsigntools, shim, mokutil — no UKI/MOK
#   - grub2-* — no GRUB fallback
#   - plymouth* — no splash
#   - cryptsetup, tpm2-tools — no LUKS/TPM inside container
#
# What's added vs the deprecated container/ predecessor:
#   - mybox-specific 10-packages.conf with baseline CLI (vim-enhanced,
#     tmux, eza, bat, zoxide, fd-find, starship, bind-utils, ...)
#   - containers + virt profiles BAKED via conf.d/ symlinks (Packages=)
#     + ExtraTrees= lines below (profile mkosi.extra/ file trees).
#     Desktop stays a runtime sysext per the host's mkosi.local.conf
#     (matches the reference host's bake/sysext split).
#   - mkosi.extra: /etc/environment + /etc/profile.d/wayland.sh
#     so PAM-scrubbed login shells still see Wayland/Pulse vars
#   - mkosi.extra: /etc/subuid + /etc/subgid for rootless nested
#     podman
#   - mkosi.postinst: runs preset-all (so myosi-* services + Fedora
#     services activate per the 40/50/99 .preset files), then masks
#     the SHORT list of boot-stack units that can't run in nspawn
#     (efi.mount, veritysetup, repart, binfmt, cryptsetup@var).
#     systemd-sysext, sysext-relabel, glib-schemas-compile, homed,
#     authselect-apply-changes, sshd-keygen drop-ins ALL stay enabled.

[Output]
ImageId=mybox
# Explicit Output= because mkosi v26 defaults to the sub-image
# DIRECTORY NAME (`mybox`) when no Output= is set, even when
# ImageId is. We want artifacts named mybox_<ver>_<arch>.
Output=%i_%v_%a
Format=disk
# No SplitArtifacts= here. mybox deploys as the full sealed .raw to
# /var/lib/machines/mybox.raw; nspawn dissects the GPT itself and
# pairs the root partition with the in-image verity+verity-sig
# partitions. Splitting per-partition would only matter for a
# sysupdate transfer that targets individual partitions inside the
# DDI — but our sysupdate.d transfers (mkosi.extra/usr/lib/
# sysupdate.d/) target only the host's root/verity/UKI. mybox
# updates atomically by replacing the whole mybox.raw file (one
# transfer, Type=regular-file at /var/lib/machines/mybox_@v.raw),
# so the split copies just waste ~3.1 GB per build.

[Content]
# base-tree dir is named <id>_<ver>_<arch> (see base-tree/mkosi.conf
# Output=). Mybox is per-arch too; the %a here resolves to the same
# value as the base-tree build's %a, so the cross-image reference
# stays in lockstep across x86-64 and arm64 builds.
BaseTrees=../../build/base-tree_%v_%a
Bootable=no
UnifiedKernelImages=no
KernelInitrdModules=

# Pull the SAME file trees the main image consumes — single source of
# truth at myosi/mkosi.extra/. Without this, anything the main image
# ships via mkosi.extra (sshd_config.d/50-myosi.conf, sudoers.d/wheel,
# /usr/share/myosi/users/user.user, /etc/profile.d/{editor.sh,gpg.sh},
# /usr/libexec/myosi/* homed scripts, /usr/lib/systemd/system/*.d/
# drop-ins, sysusers, tmpfiles, /usr/local/bin/myosi CLI, etc.) would
# be MISSING from mybox even though base-tree has the packages.
# base-tree itself doesn't ship those files (it has no mkosi.extra),
# so we can't inherit them via BaseTrees=.
#
# We do NOT move the main extras into base-tree's mkosi.extra because
# every sysext also uses BaseTrees=base-tree, and strip_to_sysext_layout
# only drops /etc — /usr files from main extras would bloat every
# sysext. ExtraTrees= here keeps sysexts lean and gives mybox the
# same /etc + /usr surface as bare-metal myosi.
#
# Then layer the baked-profile extras on top (mirrors what sysext
# wrappers do — e.g. mkosi.images/containers/mkosi.conf has the same
# ExtraTrees= line). Keep order aligned with the conf.d/<NN>-bake-*.conf
# symlinks:
#   30-bake-containers.conf → containers/mkosi.extra
#   40-bake-virt.conf       → virt/mkosi.extra
ExtraTrees=../../mkosi.extra:/
ExtraTrees=../../mkosi.profiles/containers/mkosi.extra:/
ExtraTrees=../../mkosi.profiles/virt/mkosi.extra:/

# Strip what can safely be removed without triggering dnf dependency
# protection. The grub2 + shim + mokutil knot is left in (~10-15 MB
# dead weight) because the protected.d/ rules + dependency closure
# would need rpm -e --nodeps to break. Acceptable trade for v1.
#
# kernel + kernel-core + kernel-modules + kernel-modules-core
# dominate at ~200 MB — those are the biggest savings. dracut and
# friends (~40 MB) come next. The rest is cleanup.
RemovePackages=kernel
        kernel-core
        kernel-modules
        kernel-modules-core
        dracut
        systemd-ukify
        sbsigntools
        cryptsetup
        tpm2-tools
        tpm2-tss

# Strip files that don't make sense without a boot stack OR inside a
# shared-kernel nspawn container. Most come from base-tree; a few come
# from main mkosi.extra/ via ExtraTrees= above.
#
# /var/* is a wholesale wipe of erofs dead weight — /var gets fully
# SHADOWED at runtime by Bind=/mnt/machines/mybox/var:/var:idmap from
# the data.raw btrfs subvol. tmpfiles.d/myosi.conf re-creates every
# needed /var/lib/<svc> dir at sysinit on the bound btrfs.
#
# /etc cleanup is NOT here. mkosi pipeline order:
#   17. mkosi.postinst
#   …
#   26. RemoveFiles=
#   27. SELinux relabel
#   28. mkosi.finalize
# RemoveFiles= runs BEFORE finalize. /etc/* wipe here would leave
# /usr/share/factory/etc empty after finalize's /etc → /usr/share/factory/etc snapshot. The
# snapshot + /etc wipe live atomically inside
# myosi/mkosi.images/mybox/mkosi.finalize.
#
# Glob keeps /var dir as mount point — only children purged.
RemoveFiles=/var/*
        /usr/lib/systemd/system/sysroot-etc.mount
        /usr/lib/systemd/system/initrd-*.target
        /usr/lib/systemd/system/initrd-*.service
        /usr/lib/repart.d
        /usr/lib/modules
        /usr/lib/firmware
        /usr/lib/kernel
        /usr/lib/modprobe.d
        /usr/lib/modules-load.d
        /usr/lib/sysupdate.d
        /usr/lib/sysupdate.extensions.d
        /usr/local/bin/sysupdate
        /usr/share/myosi/keys
        /efi
        /boot

[Config]
# Dependencies on base-tree (consumed via BaseTrees=). mybox sub-image
# is independent of all sysexts — it bakes the desktop + containers
# package surface directly so no runtime sysext merge is needed.
Dependencies=base-tree

[Validation]
# Sealed verity-erofs DDI matching the bare-metal myosi tamper-
# evidence model. dm-verity hash tree + PKCS7-signed roothash; nspawn
# validates the signature against the host's .platform keyring on
# dissection. Operator gets "tampered image" rejection if either the
# root or the hash tree was modified out-of-band.
#
# Keys come from the top-level mkosi.crt / mkosi.key (the same boot
# key chain used for UKIs). Sub-images cannot declare VerityKey /
# VerityCertificate themselves (mkosi v26 errors with "Setting
# VerityKey cannot be configured in <X> image"), so they inherit
# [Validation] from the top-level mkosi.conf.
Verity=signed
