[Partition]
# dm-verity hash tree for the mybox root (pairs via VerityMatchKey).
# 3 GiB root → ~24 MiB tree; fixed 64M bounds for repeatable repart
# runs. Bump in lockstep if the root grows past 6 GiB.
Type=root-verity
Label=mybox-root-verity
Verity=hash
VerityMatchKey=root
SplitName=verity
SizeMinBytes=64M
SizeMaxBytes=64M
