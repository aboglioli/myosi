[Partition]
# dm-verity hash tree partition for the mybox root.
#
# VerityMatchKey=root pairs with 10-root.conf's Verity=data side.
# mkosi/systemd-repart computes the SHA-256 hash tree from the
# erofs root content and writes it here.
#
# Size: 3 GiB root at 4 KiB block + fan-out 128 → ~24 MiB hash tree.
# 64 MiB leaves comfortable headroom for tree-format overhead and
# alignment rounding. Fixed bounds required for repeatable repart
# runs (the --split=yes extract pass must agree with the build pass
# on the exact hash partition layout). Bump in lockstep with the
# root partition if the root size grows past 6 GiB.
Type=root-verity
Label=mybox-root-verity
Verity=hash
VerityMatchKey=root
SplitName=verity
SizeMinBytes=64M
SizeMaxBytes=64M
