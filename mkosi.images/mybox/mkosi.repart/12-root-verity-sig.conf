[Partition]
# PKCS7-signed roothash (keys from top-level [Validation]); nspawn
# verifies against the host's .platform keyring at dissection. No size
# bounds — systemd-repart forbids explicit sizes on Verity=signature.
Type=root-verity-sig
Label=mybox-root-verity-sig
Verity=signature
VerityMatchKey=root
SplitName=verity-sig
