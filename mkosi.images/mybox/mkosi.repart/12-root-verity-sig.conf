[Partition]
# PKCS7-signed roothash partition for the mybox root.
#
# Verity=signature → systemd-repart wraps the dm-verity roothash in
# a PKCS7 envelope signed with VerityKey / VerityCertificate from the
# top-level mkosi.conf [Validation] block. At dissection time, nspawn
# (via libsystemd-image-dissect) verifies the signature against the
# host's .platform keyring (populated from UEFI db at boot via
# CONFIG_LOAD_UEFI_KEYS, OR from MOK if the host enrolled the myosi
# CA there). Tamper-evidence: any modification to either the root or
# the hash partition invalidates the roothash, and the embedded
# signature stops verifying.
#
# No SizeMinBytes / SizeMaxBytes here — systemd-repart enforces that
# Verity=signature partitions cannot have explicit sizes; the
# PKCS7-wrapped roothash signature length determines partition size
# automatically.
Type=root-verity-sig
Label=mybox-root-verity-sig
Verity=signature
VerityMatchKey=root
SplitName=verity-sig
