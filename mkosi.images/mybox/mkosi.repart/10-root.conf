[Partition]
# Sealed erofs root partition for the mybox nspawn DDI.
#
# Type=root-x86-64 → nspawn's dissection logic identifies the partition
# by Discoverable Partitions Spec type GUID, then dm-verity-validates it
# against the companion verity-hash + verity-sig partitions in the same
# image (11-root-verity.conf + 12-root-verity-sig.conf).
#
# Verity=data + VerityMatchKey=root pair this partition with the verity
# hash + signature partitions that share the same VerityMatchKey value.
# mkosi computes the hash tree from the root content at build time and
# fills the verity-hash partition with the tree.
#
# Size: mybox bakes containers + virt profiles into the rootfs
# (podman + distrobox + incus + qemu + libvirt + swtpm + spice +
# lxc), plus the baseline CLI from 10-packages.conf. Desktop is a
# sysext at runtime, not baked. ~2-2.5 GB compressed erofs in
# practice. 3 GiB leaves headroom for future virt-profile additions.
# Fixed bounds required for repeatable repart runs and matching the
# verity hash tree size at --split=yes extract time. Bump if a
# future bake addition pushes the buildroot close to 3 GiB.
Type=root-x86-64
Label=mybox-root
Format=erofs
CopyFiles=/
Verity=data
VerityMatchKey=root
SplitName=root
SizeMinBytes=3G
SizeMaxBytes=3G
Compression=zstd
CompressionLevel=3
ReadOnly=yes
