[Partition]
# Sealed erofs root for the mybox DDI; nspawn finds it by DPS type GUID
# and verity-validates against the paired partitions (VerityMatchKey).
# ~2-2.5 GB compressed in practice; fixed 3G bounds required for
# repeatable repart runs — bump if a bake addition nears 3 GiB.
Type=root-x86-64
Label=mybox-root
Format=erofs
CopyFiles=/
Verity=data
VerityMatchKey=root
SplitName=root
SizeMinBytes=3G
SizeMaxBytes=3G
Compression=zstd
CompressionLevel=3
ReadOnly=yes
