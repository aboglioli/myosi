# mybox baseline package surface — mybox-specific extras only.
#
# Desktop / containers / virt profiles are baked via the conf.d/
# 20-bake-desktop.conf, 30-bake-containers.conf, 40-bake-virt.conf
# symlinks alongside this file. This file adds ONLY mybox-specific
# CLI tools that don't belong in any of those shared profiles —
# tools an operator reaches for in any mybox shell regardless of
# which profiles are enabled.
#
# Sysext infrastructure is kept active (mkosi.postinst) for non-
# profile sysexts: zfs, future custom add-ons, runtime testing of a
# new sysext version before promotion to a bake.

[Content]
Packages=
        # Editors beyond neovim for muscle-memory parity with the
        # bare-metal host. base-tree ships vim-minimal already;
        # vim-enhanced adds the full /usr/bin/vim binary.
        vim-enhanced

        # Terminal multiplexer — useful for long-running sessions
        # accessed via `machinectl shell user@mybox`.
        tmux

        # CLI productivity tools missing from base-tree. Adding them
        # here costs ~10 MB total but covers the typical "start a
        # fresh shell, immediately reach for these" muscle memory.
        eza
        bat
        zoxide
        fd-find
        starship
        bash-completion
        man-pages
        man-db
        tig
        gh

        # Network diagnostics. Base-tree has curl + ping but not the
        # rest. When a GUI app inside can't reach a host, debugging
        # starts with these.
        bind-utils
        traceroute
        nmap-ncat
        wget
