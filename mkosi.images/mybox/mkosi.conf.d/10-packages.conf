# mybox-specific CLI extras only — profiles are baked via the sibling
# conf.d/<NN>-bake-*.conf symlinks.

[Content]
Packages=
        vim-enhanced

        tmux

        # CLI productivity tools missing from base-tree (~10 MB total).
        eza
        bat
        zoxide
        fd-find
        starship
        bash-completion
        man-pages
        man-db
        tig
        gh

        # Network diagnostics beyond base-tree's curl + ping.
        bind-utils
        traceroute
        nmap-ncat
        wget
