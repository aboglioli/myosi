# Directory-format image that sysexts use as BaseTrees=.
# Holds the same packages as the main myosi image so sysexts can
# layer additional /usr content on top.

[Output]
Format=directory
ImageId=base-tree
# Arch suffix aligns the base-tree dir with every other artifact
# (main image, sysexts, mybox). mkosi defaults a Format=directory
# image to just <ImageId>_<ImageVersion>; we add %a so a future
# arm64 base-tree can sit beside the x86-64 one without collision.
# Sub-images that consume this dir (mybox) must use the matching
# pattern in their BaseTrees= path.
Output=%i_%v_%a

[Content]
# Don't synthesise an ESP/UKI for base-tree. The top-level mkosi.conf
# sets Bootable=yes + UnifiedKernelImages=auto, so without this
# override mkosi extracts a kernel + initrd for every kernel package
# installed into base-tree and writes them next to the directory tree
# as base-tree_<VER>_<ARCH>.vmlinuz / .initrd. Nothing consumes those
# (base-tree is only used as BaseTrees= by every sysext + mybox), so
# they're 50 MB + 40 MB of dead weight per build. Setting Bootable=no
# AND UnifiedKernelImages=no skips both passes.
Bootable=no
UnifiedKernelImages=no
