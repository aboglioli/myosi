# Directory-format image that sysexts use as BaseTrees=.
# Holds the same packages as the main myosi image so sysexts can
# layer additional /usr content on top.

[Output]
Format=directory
ImageId=base-tree
# %a suffix keeps arch variants apart; consumers' BaseTrees= paths must
# use the matching pattern.
Output=%i_%v_%a

[Content]
# Without both overrides, the top-level Bootable=yes +
# UnifiedKernelImages=auto make mkosi extract an unused kernel + initrd
# (~90 MB dead weight) next to the directory tree.
Bootable=no
UnifiedKernelImages=no
