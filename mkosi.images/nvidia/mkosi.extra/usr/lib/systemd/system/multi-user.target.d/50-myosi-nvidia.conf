# Enables nvidia-cdi-refresh.{path,service} (CDI spec regen) — myosi
# never runs preset-all, so this drop-in is the enable.
# Wants=, never Upholds=: the oneshot goes inactive on success, so
# Upholds= retriggered it forever (27,380 starts in 4.8 h).
[Unit]
Wants=nvidia-cdi-refresh.service nvidia-cdi-refresh.path
