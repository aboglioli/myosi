# multi-user.target drop-in for the nvidia sysext.
#
# nvidia-cdi-refresh.{path,service} come from nvidia-container-toolkit and
# regenerate the CDI spec that `podman --device nvidia.com/gpu=all` consumes.
# Both ship [Install] WantedBy=multi-user.target, but myosi never runs
# preset-all and /etc enable symlinks don't survive a rebuild — so this
# drop-in is the enable.
#
# Wants=, never Upholds=. The service is Type=oneshot with
# RemainAfterExit=no, so it returns to inactive the moment it succeeds.
# Upholds= is a continuous "keep this active" assertion, so success itself
# retriggered it — 27,380 starts in 4.8 h on a live host.
[Unit]
Wants=nvidia-cdi-refresh.service nvidia-cdi-refresh.path
