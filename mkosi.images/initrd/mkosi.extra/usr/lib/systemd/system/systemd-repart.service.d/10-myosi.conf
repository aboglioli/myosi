# systemd-repart.service drop-in (initrd copy).
#
# Two changes vs upstream:
#
# 1. After=sysroot.mount — upstream orders Before=initrd-root-fs.target
#    only, meaning it can run BEFORE sysroot.mount actually mounts the
#    verity-protected root. Without /sysroot mounted, systemd-repart's
#    auto-detect for the backing block device fails with:
#
#       Failed to determine backing device of /sysroot/:
#       No such file or directory
#
#    Adding After=sysroot.mount makes repart wait until /sysroot is
#    populated; the upstream Before=initrd-root-fs.target still applies
#    so we stay inside the initrd-phase window and the new partitions
#    are visible by the time sysroot-prep.service selects Type=var.
#
#    sysroot-prep.service explicitly orders After=systemd-repart.service;
#    sysroot-etc.mount then orders after sysroot-prep.service.
#
# 2. SuccessExitStatus=1 — 90-data.conf has no SizeMaxBytes, so on
#    every boot AFTER the first repart exits 1 with "Can't fit
#    requested partitions into available free space (0B), refusing".
#    Whitelist exit code 1 so the unit settles into active(exited)
#    instead of failed; the journal still records the diagnostic.
#
# Drop-ins only apply within the filesystem they ship in. The matching
# drop-in for the deployed rootfs's own systemd-repart.service is at
# mkosi.extra/usr/lib/systemd/system/systemd-repart.service.d/.
[Unit]
After=sysroot.mount

[Service]
SuccessExitStatus=1
