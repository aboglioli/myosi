# systemd-repart drop-in (initrd copy; rootfs copy in main mkosi.extra).
# After=sysroot.mount: upstream can run before /sysroot is mounted, then
# fails "Failed to determine backing device of /sysroot/".
# SuccessExitStatus=1: 90-data.conf has no SizeMaxBytes, so every boot
# after the first exits 1 ("Can't fit requested partitions... refusing");
# whitelist it so the unit is active(exited), not failed.
[Unit]
After=sysroot.mount

[Service]
SuccessExitStatus=1
