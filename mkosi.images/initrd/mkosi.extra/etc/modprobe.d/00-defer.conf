# Defer Wi-Fi/BT driver load until after switch_root: the initrd lacks
# their firmware, and iwlwifi/btusb mark the device dead on -ENOENT and
# never retry. This file only exists in the initrd's modprobe.d, so the
# deployed root coldplugs them clean with full /usr/lib/firmware.
install iwlwifi /bin/false
install iwlmvm  /bin/false
install btusb   /bin/false
install btintel /bin/false
