# Defer Wi-Fi + Bluetooth driver loading until AFTER initrd-switch-root.
#
# Why this file exists:
# The initrd cpio ships only the minimum firmware mkosi-initrd selects;
# /usr/lib/firmware/iwlwifi-* and intel/ibt-* are not in it. udev's
# 80-drivers.rules coldplugs the PCI/USB tree inside the initrd and
# autoloads iwlwifi + btusb + btintel BEFORE the deployed root with the
# full firmware payload is pivoted in. Both drivers use synchronous
# request_firmware; on -ENOENT they mark the device dead and never
# retry. Empirical fingerprint:
#
#   iwlwifi 0000:00:14.3: Direct firmware load for
#       iwlwifi-so-a0-gf-a0-89.ucode failed with error -2
#   iwlwifi 0000:00:14.3: no suitable firmware found!
#   Bluetooth: hci0: Failed to load Intel firmware file
#       intel/ibt-1040-0041.sfi (-2)
#
# `install <mod> /bin/false` is the canonical way to refuse loading
# under modprobe — applies whenever modprobe is invoked while this
# config is part of the running modprobe.d set. The initrd's
# /etc/modprobe.d/ is the running set BEFORE switch_root; after
# switch_root, the deployed root's /etc/modprobe.d/ becomes the active
# set and has no such entries, so normal udev coldplug load the modules
# clean (with the full /usr/lib/firmware/ now visible) and the radios
# come up on the first boot without any post-pivot rmmod+modprobe
# dance.
install iwlwifi /bin/false
install iwlmvm  /bin/false
install btusb   /bin/false
install btintel /bin/false
