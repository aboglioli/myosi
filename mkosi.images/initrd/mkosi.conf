[Include]
Include=mkosi-initrd

[Output]
Output=initrd
ImageId=initrd

[Content]
# cryptsetup: myosi-data-attach unlocks data-luks + data-N pool members.
# btrfs-progs: repart Format=btrfs first-boot path + `btrfs device scan`.
# attr: myosi-etc-prepare stamps etc_t on the /etc overlay layers with
# setfattr before sysroot-etc.mount assembles them.
# tpm2-tss: systemd-cryptsetup dlopens libtss2-esys/mu/rc and the
# tcti-device backend to honour `tpm2-device=auto`. Fedora ships that
# binary in systemd-udev, which only *Recommends* those sonames, and
# mkosi leaves weak deps off (WithRecommends= defaults false), so they
# never land in mkosi-initrd — a SEPARATE minimal build that inherits
# nothing from the main image. Upstream's mkosi-initrd adds libfido2
# for the same reason and simply never covered the TPM2 backend. Absent
# them, unlock_one logs "TPM2 support not available." and drops to the
# console passphrase prompt for every volume the bootstrap key-file
# does not cover.
Packages=bash
         cryptsetup
         btrfs-progs
         util-linux
         attr
         tpm2-tss

# GPT layout baked in so initrd systemd-repart can create missing
# partitions on first boot. Needed because myosi mounts /var AND /etc
# (sibling subvols on data-luks) pre-pivot — systemd-gpt-auto-generator
# can't unlock that volume and only handles /var after switch_root.
# mkosi-initrd is a SEPARATE minimal build, so the runtime repart.d
# (single source of truth in mkosi.extra/) must be injected explicitly.
ExtraTrees=../../mkosi.extra/usr/lib/repart.d:/usr/lib/repart.d
# Bootstrap LUKS key (scripts/generate-bootstrap-key.sh). Needed for
# first-boot repart format AND every boot's cryptsetup unlock; the main
# image gets its copy via mkosi.postinst.
ExtraTrees=../../keys/data.key:/usr/share/myosi/keys/data.key

[Config]
Dependencies=
