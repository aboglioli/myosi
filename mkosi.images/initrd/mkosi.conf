[Include]
Include=mkosi-initrd

[Output]
Output=initrd
ImageId=initrd

[Content]
# cryptsetup: myosi-data-attach.service uses systemd-cryptsetup in the
#             initrd to unlock the Type=var LUKS partition (the
#             single-tenant data-luks pool, btrfs over LUKS) from the
#             boot/root disk plus any matching data-N pool members
#             before sysroot-var.mount and sysroot-etc.mount mount the
#             /var and /etc subvolumes for the post-pivot rootfs.
# btrfs-progs: systemd-repart's Format=btrfs path needs mkfs.btrfs and
#             btrfs(8) for the subvolume + MakeDirectories= layout on
#             first-boot partition creation; myosi-data-attach also
#             calls `btrfs device scan` to register multi-disk pool
#             members.
Packages=bash
         cryptsetup
         btrfs-progs
         util-linux
         attr

# Bake the full GPT layout into the initrd at /usr/lib/repart.d/ so
# systemd-repart.service inside the initrd can create any missing
# partitions on first boot.
#
# How the boot chain works in the initrd:
#   1. systemd-repart.service (upstream, in initrd) reads
#      /usr/lib/repart.d/*.conf from this image.
#        - Existing full-disk image: every partition already exists;
#          repart sees Type+Label matches and no-ops them, only growing
#          data-luks to fill the disk.
#        - Seed image / first boot: only ESP + root-A + verity-A +
#          verity-sig-A ship in the .raw; repart creates the missing
#          root-B + verity-B + verity-sig-B + data-luks placeholders,
#          formats data-luks as LUKS2 + btrfs in one pass with the key
#          file from /usr/share/myosi/keys/data.key, creates the /home
#          subvol, and pre-creates the dirs sysroot-etc.mount needs.
#   2. myosi-data-attach.service selects the Type=var partition from
#      the same disk as the booted root (guard rail: primary data
#      must come from the boot disk), unlocks it as /dev/mapper/data
#      with TPM2-first/key-file-fallback semantics, unlocks present
#      data-N LUKS pool members from ANY disk (pool members are
#      free-floating across disks by design), and runs `btrfs device
#      scan` so the kernel knows every multi-device pool member.
#   3. sysroot-var.mount + sysroot-etc.mount mount /sysroot/var and
#      /sysroot/etc as plain btrfs subvolumes (subvol=/var and
#      subvol=/etc) on the same /dev/mapper/data. /etc is a real
#      persistent subvolume — NOT an overlay — seeded from /usr/share/factory/etc
#      on first boot by systemd-tmpfiles' C! rule
#      (/usr/lib/tmpfiles.d/myosi-etc-factory.conf).
#   4. initrd-switch-root → pivot. Kernel/systemd default propagation
#      for / is shared post-pivot, so containers + flatpak see mount
#      events across user namespaces without explicit make-rshared.
#
# systemd-gpt-auto-generator does not mount non-root Type=var partitions
# in the initrd. It handles /var after switch_root. myosi needs /var
# AND /etc earlier because both live as sibling subvols on the same
# data-luks btrfs volume that the gpt generator can't unlock.
#
# Runtime repart.d — single source of truth at
# mkosi.extra/usr/lib/repart.d/ (ParticleOS pattern). The auto-built
# initrd would normally inherit /usr/lib/repart.d/ from the main rootfs
# build, but mkosi-initrd is a SEPARATE minimal build with its own
# package set, so the dir needs explicit injection here.
ExtraTrees=../../mkosi.extra/usr/lib/repart.d:/usr/lib/repart.d
# Dynamic LUKS pool discovery after switch_root is handled by the udev
# rule + template service in mkosi.extra/. The initrd does not need that
# event path: myosi-data-attach.service directly unlocks present
# data-N devices before btrfs scan + /sysroot/var + /sysroot/etc mount.
# Bootstrap LUKS key, sourced from the same keys/ directory as the
# signing certs. scripts/generate-bootstrap-key.sh writes
# ../../keys/data.key from $MYOSI_DATA_KEY in CI or from a cached
# local copy. Initrd needs the key for first-boot repart format AND
# every subsequent boot cryptsetup unlock. Main image gets a copy
# via mkosi.postinst (installs to /usr/share/myosi/keys/data.key and
# /efi/keys/data.key).
ExtraTrees=../../keys/data.key:/usr/share/myosi/keys/data.key

[Config]
Dependencies=
