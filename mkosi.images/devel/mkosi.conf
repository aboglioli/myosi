# Devel sysext — a native build toolchain for hosts that do development.
#
# Packages= lives here rather than in a mkosi.profiles/devel/ tree (the
# shape desktop/containers/virt use) because this feature is deliberately
# NEVER baked into the main image: the profile indirection exists to share
# one package list between a `--profile=` bake and the sysext of the same
# name, and there is no bake here to share with. See the README FAQ entry
# "Why is the build toolchain a sysext and not base packages?".
#
# What the base is missing, and why a bare compiler would not have been
# enough: /usr/include carries three entries (no libc headers),
# /usr/lib64/pkgconfig is empty, there are no unversioned *.so devel
# symlinks, and binutils/make/cmake are absent entirely. A native build
# needs all four of those, not just cc.

[Output]
ImageId=devel
Output=%i_%v_%a

[Content]
Packages=gcc
        gcc-c++
        # Explicit rather than leaning on gcc's dependency chain: `ar` and
        # `ranlib` are what the Rust cc crate shells out to by literal
        # name, and a silent drop here fails builds far from the cause.
        binutils
        glibc-devel
        kernel-headers
        make
        cmake
        ninja-build
        autoconf
        automake
        libtool
        m4
        patch
        # -devel packages for the libraries native crates and autotools
        # projects actually link against. Each contributes the header plus
        # the unversioned *.so symlink the linker resolves -l<name> through
        # — the base ships only the versioned runtime SONAME, which is why
        # `-lz` fails there despite libz.so.1 being present.
        zlib-ng-compat-devel
        openssl-devel
        libzstd-devel
        lz4-devel
        libcurl-devel
        cyrus-sasl-devel
        sqlite-devel
        libffi-devel
        libuuid-devel
        libblkid-devel
        elfutils-libelf-devel
        systemd-devel

# No language runtimes here on purpose: go, node, rust and zig are
# per-project and version-switched, which is mise's job, not the image's.
