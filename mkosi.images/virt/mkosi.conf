# Virt sysext — thin wrapper.
#
# Content lives in mkosi.profiles/virt/. This sub-image:
#   - Pulls the profile's Packages= via the conf.d/10-packages.conf
#     SYMLINK to ../../../mkosi.profiles/virt/mkosi.conf (sub-image's
#     Include= and Profiles= don't propagate profile content in
#     mkosi v26, but conf.d/ auto-loads everything in it).
#   - Pulls the profile's mkosi.extra/ via the ExtraTrees= line below.
#   - Inherits sysext infra from mkosi.shared/sysext.conf
#   - Runs sysext-specific close-out in mkosi.postinst (preset replay
#     via target drop-ins, finalize)

[Output]
ImageId=virt
Output=%i_%v_%a

[Content]
ExtraTrees=../../mkosi.profiles/virt/mkosi.extra:/
